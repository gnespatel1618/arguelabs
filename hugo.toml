baseURL = "https://arguelabs.in/"
languageCode = "en-in"
title = "Arguelabs"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  author = "Ganesh"
  description = "Notes and essays by Ganesh."

[permalinks]
  blog = "/blog/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "github"
