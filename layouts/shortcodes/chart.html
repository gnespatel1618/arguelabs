{{- $src := .Get "src" -}}{{- $res := .Page.Resources.GetMatch $src -}}
{{- if not $res }}{{ errorf "chart shortcode: %q not found in %s" $src .Page.File.Path }}{{ end -}}
<figure class="fig fig-chart">
  <div class="chart-box">{{ $res.Content | safeHTML }}</div>
  <figcaption><span class="lab">{{ .Get "label" | default "Figure" }}</span>{{- with .Get "source" }}<span class="src">Source: {{ . | markdownify }}</span>{{ end }}<button type="button" class="enl" data-enlarge>Enlarge</button></figcaption>
</figure>
