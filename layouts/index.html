{{ define "main" }}
{{ $posts := (where site.RegularPages "Section" "blog").ByDate.Reverse }}
<section class="lede wrap">
  <h1>Notes on markets, businesses, capital and incentives.</h1>
  <div class="g3"><div class="intro col2">{{ .Content }}</div></div>
</section>
<section class="wrap" aria-label="All writing">
  <div class="idx-head g3"><span>Date</span><span>Writing</span><span class="c3">Length</span></div>
  <a class="row g3 continue" href="#" data-continue hidden><span><img class="thumb" alt="" data-continue-img hidden><span class="d" data-continue-d>Continue</span></span><span><span class="t" data-continue-t></span></span><span class="x" data-continue-x></span></a>
  {{ range $posts }}{{ partial "row.html" (dict "page" .) }}{{ end }}
</section>
{{ end }}
