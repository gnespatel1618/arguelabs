<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Losses hurt about twice as much as gains please, and experts disagree five times more than their bosses think" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Two flaws in every human decision-maker</text><text x="24" y="72" font-weight="600" fill="#1b1a17">Bias: losses hurt about twice as much</text><text x="24" y="90" font-size="11.5" fill="#6d685f">Pain of a loss vs joy of a gain</text><g><text x="24" y="127" fill="#1b1a17">Lose ₹1,000</text><rect x="124" y="110" width="160" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="292" y="128" fill="#6d685f" font-size="11.5">same feeling</text></g><g><text x="24" y="169" fill="#1b1a17">Gain ₹1,000</text><rect x="124" y="152" width="80" height="26" fill="#b9b3a8" fill-opacity="0.8"></rect><text x="212" y="170" fill="#6d685f" font-size="11.5">half as strong</text></g><g><text x="24" y="211" fill="#1b1a17">Gain ₹2,000</text><rect x="124" y="194" width="160" height="26" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="292" y="212" fill="#6d685f" font-size="11.5">same feeling</text></g><line x1="382" x2="382" y1="60" y2="250" stroke="#e4ded2"></line><text x="400" y="72" font-weight="600" fill="#1b1a17">Noise: experts disagree with each other</text><text x="400" y="90" font-size="11.5" fill="#6d685f">Median gap between two underwriters pricing the same case</text><g><text x="400" y="122" fill="#1b1a17">What executives expected</text><rect x="400" y="130" width="54" height="26" fill="#b9b3a8" fill-opacity="0.8"></rect><text x="462" y="148" font-weight="600" fill="#1b1a17">10%</text></g><g><text x="400" y="184" fill="#1b1a17">What actually happened</text><rect x="400" y="192" width="297" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="705" y="210" font-weight="600" fill="#1b1a17">55%</text></g><text x="24" y="282" font-size="11.5" fill="#6d685f">Machines have neither flaw. They have different ones (section 3).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>