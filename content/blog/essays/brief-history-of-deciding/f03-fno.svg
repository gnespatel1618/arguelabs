2f9e5b" fill-opacity="0.9"></rect><text x="24" y="204" font-size="22" font-weight="600" fill="#d8463d">93 in 100 lost money</text><text x="24" y="226" fill="#6d685f">Combined loss over ₹1.8 lakh crore,</text><text x="24" y="244" fill="#6d685f">about ₹2 lakh per trader. Over 75% of</text><text x="24" y="262" fill="#6d685f">loss-makers kept trading.</text><line x1="376" x2="376" y1="76" y2="300" stroke="#e4ded2"></line><text x="400" y="88" font-weight="600" fill="#1b1a17">Who made money in FY24 (gross profit)</text><g><text x="400" y="120" fill="#1b1a17">Proprietary firms</text><rect x="400" y="128" width="240" height="28" fill="#4f7be0" fill-opacity="0.85"></rect><rect x="640" y="128" width="10" height="28" fill="#b9b3a8"></rect><text x="658" y="147" font-weight="600" fill="#1b1a17">₹33,000 cr</text><text x="400" y="172" font-size="11.5" fill="#6d685f">96% of it from algorithmic trading</text></g><g><text x="400" y="198" fill="#1b1a17">Foreign investors (FPIs)</text><rect x="400" y="206" width="205.75757575757575" height="28" fill="#4f7be0" fill-opacity="0.85"></rect><rect x="605.7575757575758" y="206" width="6.363636363636363" height="28" fill="#b9b3a8"></rect><text x="620.1212121212121" y="225" font-weight="600" fill="#1b1a17">₹28,000 cr</text><text x="400" y="250" font-size="11.5" fill="#6d685f">97% of it from algorithmic trading</text></g><rect x="400" y="272" width="12" height="12" fill="#4f7be0" fill-opacity="0.85"></rect><text x="418" y="282" font-size="11.5" fill="#6d685f">by algorithm</text><rect x="520" y="272" width="12" height="12" fill="#b9b3a8"></rect><text x="538" y="282" font-size="11.5" fill="#6d685f">other</text><text x="24" y="318" font-size="11.5" fill="#6d685f">The machines did not win because they are wiser. They won because they feel nothing.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>