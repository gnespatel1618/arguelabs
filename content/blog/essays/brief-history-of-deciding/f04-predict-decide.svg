<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 320" role="img" aria-label="Machines predict what is likely; humans decide what it is worth" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">As prediction gets cheap, judgment gets valuable</text><g><rect x="24" y="64" width="340" height="222" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.6"></rect><text x="42" y="94" font-size="17" font-weight="600" fill="#4f7be0">Prediction: what is likely</text><text x="42" y="114" font-size="11.5" fill="#6d685f">Cheap, and getting cheaper (AI)</text><g><circle cx="48" cy="142" r="4" fill="#4f7be0"></circle><text x="62" y="146" fill="#1b1a17">Which customer will leave</text></g><g><circle cx="48" cy="178" r="4" fill="#4f7be0"></circle><text x="62" y="182" fill="#1b1a17">Which X-ray shows a tumour</text></g><g><circle cx="48" cy="214" r="4" fill="#4f7be0"></circle><text x="62" y="218" fill="#1b1a17">Odds that a stock doubles</text></g><g><circle cx="48" cy="250" r="4" fill="#4f7be0"></circle><text x="62" y="254" fill="#1b1a17">Every annual report on the NSE, before lunch</text></g></g><g><rect x="396" y="64" width="340" height="222" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="414" y="94" font-size="17" font-weight="600" fill="#d8463d">Judgment: what it is worth to you</text><text x="414" y="114" font-size="11.5" fill="#6d685f">Scarce, and still your job</text><g><circle cx="420" cy="142" r="4" fill="#d8463d"></circle><text x="434" y="146" fill="#1b1a17">Whether you need the money in 2 years or 20</text></g><g><circle cx="420" cy="178" r="4" fill="#d8463d"></circle><text x="434" y="182" fill="#1b1a17">Whether you can sleep through a 40% fall</text></g><g><circle cx="420" cy="214" r="4" fill="#d8463d"></circle><text x="434" y="218" fill="#1b1a17">Which goal you are actually pursuing</text></g><g><circle cx="420" cy="250" r="4" fill="#d8463d"></circle><text x="434" y="254" fill="#1b1a17">When the machine itself is wrong</text></g></g><text x="24" y="308" font-size="11.5" fill="#6d685f">Based on Agrawal, Gans and Goldfarb, Prediction Machines (2018).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>