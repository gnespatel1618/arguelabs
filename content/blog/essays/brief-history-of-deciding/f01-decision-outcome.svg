<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Decision quality and outcome are two different things" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">A decision and its outcome are two different things</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">&quot;Resulting&quot; means judging the row by the column: calling every good outcome a good decision</text><text x="310" y="82" text-anchor="middle" font-weight="600" fill="#1b1a17">Good outcome</text><text x="600" y="82" text-anchor="middle" font-weight="600" fill="#1b1a17">Bad outcome</text><text x="156" y="142" text-anchor="end" font-weight="600" fill="#1b1a17">Good decision</text><text x="156" y="244" text-anchor="end" font-weight="600" fill="#1b1a17">Bad decision</text><g><rect x="170" y="92" width="280" height="92" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="186" y="122" font-size="16" font-weight="600" fill="#2f9e5b">Deserved success</text><text x="186" y="146" fill="#6d685f">Dhoni gives Joginder the last over;</text><text x="186" y="163" fill="#6d685f">Sreesanth takes the catch</text></g><g><rect x="460" y="92" width="280" height="92" fill="#f6f2ea" stroke="#e2a623" stroke-width="1.6"></rect><text x="476" y="122" font-size="16" font-weight="600" fill="#1b1a17">Bad luck</text><text x="476" y="146" fill="#6d685f">Carroll calls a pass from the one-yard</text><text x="476" y="163" fill="#6d685f">line; it is intercepted</text></g><g><rect x="170" y="194" width="280" height="92" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="186" y="224" font-size="16" font-weight="600" fill="#d8463d">Dumb luck</text><text x="186" y="248" fill="#6d685f">A WhatsApp tip on a penny stock</text><text x="186" y="265" fill="#6d685f">doubles your money</text></g><g><rect x="460" y="194" width="280" height="92" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="476" y="224" font-size="16" font-weight="600" fill="#d8463d">Deserved failure</text><text x="476" y="248" fill="#6d685f">LTCM borrows 25 dollars for every</text><text x="476" y="265" fill="#6d685f">dollar of its own; Russia defaults</text></g><text x="24" y="318" font-size="11.5" fill="#6d685f">The market sends many people to the bottom-left box often enough to teach them exactly the wrong lesson.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>