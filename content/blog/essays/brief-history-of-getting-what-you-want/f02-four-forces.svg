<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="The four forces multiply" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The four forces do not add up. They multiply.</text><g><rect x="24" y="72" width="150" height="84" fill="#f6f2ea" stroke="#1b1a17"></rect><text x="99" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1a17">Hard work</text><text x="99" y="132" text-anchor="middle" fill="#6d685f">Intensity</text><text x="191" y="122" text-anchor="middle" font-size="24" fill="#d8463d">×</text></g><g><rect x="208" y="72" width="150" height="84" fill="#f6f2ea" stroke="#1b1a17"></rect><text x="283" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1a17">Consistency</text><text x="283" y="132" text-anchor="middle" fill="#6d685f">Time</text><text x="375" y="122" text-anchor="middle" font-size="24" fill="#d8463d">×</text></g><g><rect x="392" y="72" width="150" height="84" fill="#f6f2ea" stroke="#1b1a17"></rect><text x="467" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1a17">Discipline</text><text x="467" y="132" text-anchor="middle" fill="#6d685f">Survival</text><text x="559" y="122" text-anchor="middle" font-size="24" fill="#d8463d">×</text></g><g><rect x="576" y="72" width="150" height="84" fill="#f6f2ea" stroke="#1b1a17"></rect><text x="651" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1a17">Risk</text><text x="651" y="132" text-anchor="middle" fill="#6d685f">Upside</text></g><text x="24" y="196" font-weight="600" fill="#1b1a17">Multiply anything by zero and you get zero:</text><g><rect x="24" y="210" width="228" height="70" fill="#d8463d" fill-opacity="0.08" stroke="#d8463d" stroke-width="1.25"></rect><text x="36" y="236" font-size="12" fill="#1b1a17">A genius who quits after a year</text><text x="36" y="262" font-weight="600" fill="#d8463d">Consistency = 0 → result 0</text></g><g><rect x="264" y="210" width="228" height="70" fill="#d8463d" fill-opacity="0.08" stroke="#d8463d" stroke-width="1.25"></rect><text x="276" y="236" font-size="12" fill="#1b1a17">A grinder who never takes a chance</text><text x="276" y="262" font-weight="600" fill="#d8463d">Risk = 0 → result 0</text></g><g><rect x="504" y="210" width="228" height="70" fill="#d8463d" fill-opacity="0.08" stroke="#d8463d" stroke-width="1.25"></rect><text x="516" y="236" font-size="12" fill="#1b1a17">A gambler with no rules</text><text x="516" y="262" font-weight="600" fill="#d8463d">Discipline = 0 → result 0</text></g><text x="24" y="312" font-size="11.5" fill="#6d685f">The gambler reaches zero faster than anyone.</text></svg>