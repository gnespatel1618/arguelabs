<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Practice explains a minority of the differences between people" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Practice explains less than we think, and least of all at work</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Share of the differences in performance between people explained by deliberate practice</text><g><line x1="200" x2="200" y1="78" y2="226" stroke="#e4ded2"></line><text x="200" y="242" text-anchor="middle" font-size="11" fill="#6d685f">0%</text></g><g><line x1="346.66666666666663" x2="346.66666666666663" y1="78" y2="226" stroke="#e4ded2"></line><text x="346.66666666666663" y="242" text-anchor="middle" font-size="11" fill="#6d685f">10%</text></g><g><line x1="493.3333333333333" x2="493.3333333333333" y1="78" y2="226" stroke="#e4ded2"></line><text x="493.3333333333333" y="242" text-anchor="middle" font-size="11" fill="#6d685f">20%</text></g><g><line x1="640" x2="640" y1="78" y2="226" stroke="#e4ded2"></line><text x="640" y="242" text-anchor="middle" font-size="11" fill="#6d685f">30%</text></g><g><text x="188" y="110" text-anchor="end" font-weight="600" fill="#1b1a17">Games (e.g. chess)</text><rect x="200" y="92" width="381.33333333333337" height="26" fill="#4f7be0" fill-opacity="0.85"></rect><text x="589.3333333333334" y="110" font-weight="600" fill="#1b1a17">26%</text></g><g><text x="188" y="160" text-anchor="end" font-weight="600" fill="#1b1a17">Sports</text><rect x="200" y="142" width="264" height="26" fill="#4f7be0" fill-opacity="0.85"></rect><text x="472" y="160" font-weight="600" fill="#1b1a17">18%</text></g><g><text x="188" y="210" text-anchor="end" font-weight="600" fill="#1b1a17">Professions</text><rect x="200" y="192" width="10.266666666666666" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="218.26666666666665" y="210" font-weight="600" fill="#1b1a17">&lt;1%</text></g><line x1="376" x2="376" y1="72" y2="226" stroke="#1b1a17" stroke-dasharray="4 4"></line><text x="382" y="70" font-size="11.5" fill="#1b1a17">All 88 studies: about 12%</text><text x="24" y="282" font-size="11.5" fill="#6d685f">The rest comes from elsewhere: genes, luck, parents and where you were born.</text></svg>