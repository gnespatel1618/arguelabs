<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="A good risk has a survivable downside and an enormous upside" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The shape of a risk matters more than its size</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Schematic, not to scale: what you can lose (below the line) against what you can win (above it)</text><g><rect x="24" y="76" width="340" height="230" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="38" y="98" font-size="14" font-weight="600" fill="#2f9e5b">A good risk</text><text x="38" y="116" font-size="11.5" fill="#6d685f">Sudha Murty, Barry Marshall</text><line x1="38" x2="350" y1="210" y2="210" stroke="#1b1a17"></line><rect x="64" y="143.5" width="70" height="66.5" fill="#2f9e5b" fill-opacity="0.75"></rect><rect x="64" y="210" width="70" height="15.299999999999999" fill="#d8463d" fill-opacity="0.75"></rect><text x="148" y="157.5" font-size="11.5" fill="#1b1a17">Enormous: Infosys, a Nobel</text><text x="148" y="226" font-size="11.5" fill="#1b1a17">Survivable: savings, not the house</text></g><g><rect x="388" y="76" width="340" height="230" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="402" y="98" font-size="14" font-weight="600" fill="#d8463d">A ruinous risk</text><text x="402" y="116" font-size="11.5" fill="#6d685f">Jesse Livermore</text><line x1="402" x2="714" y1="210" y2="210" stroke="#1b1a17"></line><rect x="428" y="171.5" width="70" height="38.5" fill="#2f9e5b" fill-opacity="0.75"></rect><rect x="428" y="210" width="70" height="80.75" fill="#d8463d" fill-opacity="0.75"></rect><text x="512" y="185.5" font-size="11.5" fill="#1b1a17">Large, until it was not</text><text x="512" y="226" font-size="11.5" fill="#1b1a17">Everything, again and again</text></g></svg>