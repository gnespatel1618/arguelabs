<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 320" role="img" aria-label="Committing in advance raised saving rates; in the February 2025 fall, 122 SIPs ended for every 100 that began" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Ropes made of money, and the month they came loose</text><text x="24" y="70" font-weight="600" fill="#1b1a17">Decide once, in advance</text><text x="24" y="88" font-size="11.5" fill="#6d685f">Save More Tomorrow: average saving rate of joiners</text><g><text x="24" y="116" fill="#1b1a17">Before</text><rect x="24" y="122" width="73.5" height="24" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="105.5" y="139" font-weight="600" fill="#1b1a17">3.5%</text></g><g><text x="24" y="168" fill="#1b1a17">After 40 months</text><rect x="24" y="174" width="285.59999999999997" height="24" fill="#2f9e5b" fill-opacity="0.85"></rect><text x="317.59999999999997" y="191" font-weight="600" fill="#1b1a17">13.6%</text></g><text x="24" y="228" font-size="11.5" fill="#6d685f">78% of employees offered the plan signed up</text><text x="24" y="244" font-size="11.5" fill="#6d685f">(Thaler and Benartzi, 2004).</text><line x1="376" x2="376" y1="58" y2="270" stroke="#e4ded2"></line><text x="400" y="70" font-weight="600" fill="#1b1a17">SIPs ended for every 100 started</text><text x="400" y="88" font-size="11.5" fill="#6d685f">Includes SIPs that simply matured</text><g><text x="400" y="116" fill="#1b1a17">Oct 2026<tspan fill="#6d685f" font-size="11.5">  a normal month</tspan></text><rect x="400" y="122" width="266.79999999999995" height="24" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="674.8" y="139" font-weight="600" fill="#1b1a17">116</text></g><g><text x="400" y="178" fill="#1b1a17">Feb 2025<tspan fill="#6d685f" font-size="11.5">  market down ~5%, a record</tspan></text><rect x="400" y="184" width="280.59999999999997" height="24" fill="#d8463d" fill-opacity="0.85"></rect><text x="688.5999999999999" y="201" font-weight="600" fill="#1b1a17">122</text></g><line x1="630" x2="630" y1="112" y2="236" stroke="#1b1a17" stroke-dasharray="4 3"></line><text x="630" y="252" text-anchor="middle" font-size="11" fill="#6d685f">100 = as many ended as began</text><text x="24" y="302" font-size="11.5" fill="#6d685f">The gap in the crash month was six or seven ropes in a hundred: a clue, not a verdict.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>