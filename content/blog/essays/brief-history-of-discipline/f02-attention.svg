<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 270" role="img" aria-label="Children waited longer when the treat was hidden or reframed" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Where you look matters more than how hard you try</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Average wait for a bigger treat in Mischel&#x27;s experiments, minutes</text><g><text x="238" y="96" text-anchor="end" fill="#1b1a17">Treats in sight</text><rect x="250" y="80" width="66.66666666666666" height="24" fill="#d8463d" fill-opacity="0.85"></rect><text x="324.66666666666663" y="97" font-weight="600" fill="#1b1a17">about 3</text></g><g><text x="238" y="142" text-anchor="end" fill="#1b1a17">Treats hidden</text><rect x="250" y="126" width="200" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="458" y="143" font-weight="600" fill="#1b1a17">nearly 9</text></g><g><text x="238" y="188" text-anchor="end" fill="#1b1a17">&quot;Put a frame around it&quot;</text><rect x="250" y="172" width="400" height="24" fill="#2f9e5b" fill-opacity="0.85"></rect><text x="658" y="189" font-weight="600" fill="#1b1a17">almost 18</text></g><text x="24" y="246" font-size="11.5" fill="#6d685f">The longest waiters covered their eyes, turned their backs or sang. They were not stronger, just smarter about attention.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>