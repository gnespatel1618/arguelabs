<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="The 1998 cookie study suggested willpower runs out; two large replications found little or no effect" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The willpower &quot;fuel tank&quot; could not be found</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Minutes spent on an unsolvable puzzle after a test of self-control (Baumeister et al., 1998)</text><g><text x="188" y="98" text-anchor="end" fill="#1b1a17">Ate the cookies</text><rect x="200" y="82" width="399" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="607" y="99" font-weight="600" fill="#1b1a17">about 19 min</text></g><g><text x="188" y="140" text-anchor="end" fill="#1b1a17">Had to eat radishes</text><rect x="200" y="124" width="168" height="24" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="376" y="141" font-weight="600" fill="#1b1a17">about 8 min</text></g><line x1="24" x2="736" y1="182" y2="182" stroke="#e4ded2"></line><text x="24" y="208" font-weight="600" fill="#1b1a17">Then science checked</text><g><rect x="24" y="222" width="350" height="72" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.25"></rect><text x="38" y="246" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#d8463d">2016</text><text x="86" y="246" fill="#1b1a17">23 labs, 2,141 people</text><text x="38" y="276" font-size="15" font-weight="600" fill="#1b1a17">Effect close to zero</text></g><g><rect x="386" y="222" width="350" height="72" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.25"></rect><text x="400" y="246" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#d8463d">2021</text><text x="448" y="246" fill="#1b1a17">36 labs, 3,500+ people, led by believers</text><text x="400" y="276" font-size="15" font-weight="600" fill="#1b1a17">No evidence for it</text></g><text x="24" y="318" font-size="11.5" fill="#6d685f">Differences in self-control are real. The fuel-tank explanation for them did not survive.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>