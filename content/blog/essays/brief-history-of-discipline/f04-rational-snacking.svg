<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="Children who met a reliable adult waited four times longer" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Impatience can be a reasonable response to broken promises</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">&quot;Rational snacking&quot; (Kidd, Palmeri and Aslin, 2013): 28 children, half met an adult who kept a promise</text><text x="24" y="86" font-weight="600" fill="#1b1a17">Average wait, minutes</text><g><text x="218" y="116" text-anchor="end" fill="#1b1a17">Adult kept the promise</text><rect x="230" y="100" width="320" height="24" fill="#2f9e5b" fill-opacity="0.85"></rect><text x="558" y="117" font-weight="600" fill="#1b1a17">about 12</text></g><g><text x="218" y="158" text-anchor="end" fill="#1b1a17">Adult broke the promise</text><rect x="230" y="142" width="80" height="24" fill="#d8463d" fill-opacity="0.85"></rect><text x="318" y="159" font-weight="600" fill="#1b1a17">about 3</text></g><text x="24" y="212" font-weight="600" fill="#1b1a17">Held out the full 15 minutes</text><text x="218" y="244" text-anchor="end" fill="#1b1a17">Reliable adult</text><circle cx="242" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="266" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="290" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="314" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="338" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="362" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="386" cy="240" r="8" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1.6"></circle><circle cx="410" cy="240" r="8" fill="#2f9e5b" stroke="#2