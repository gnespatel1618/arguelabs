<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 360" role="img" aria-label="Hospitals bill consumables at up to 29 times what they pay" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Hospitals bill some consumables at up to 29 times what they pay</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Billed MRP as a multiple of the purchase or landed price</text><g><text x="168" y="110" text-anchor="end" font-weight="600" fill="#1b1a17">IV infusion set</text><rect x="180" y="92" width="411.59999999999997" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="599.5999999999999" y="110" font-weight="600" fill="#1b1a17">29.4x</text><text x="643.5999999999999" y="110" font-size="11.5" fill="#6d685f">Rs 11.05 → Rs 325</text></g><g><text x="168" y="162" text-anchor="end" font-weight="600" fill="#1b1a17">10 ml syringe</text><rect x="180" y="144" width="119" height="26" fill="#b9b3a8" fill-opacity="1"></rect><text x="307" y="162" font-weight="600" fill="#1b1a17">8.5x</text><text x="351" y="162" font-size="11.5" fill="#6d685f">Rs 6.75 → Rs 57.20</text></g><g><text x="168" y="214" text-anchor="end" font-weight="600" fill="#1b1a17">Cardiac catheter</text><rect x="180" y="196" width="71.39999999999999" height="26" fill="#b9b3a8" fill-opacity="1"></rect><text x="259.4" y="214" font-weight="600" fill="#1b1a17">~5.1x</text><text x="303.4" y="214" font-size="11.5" fill="#6d685f">Rs 1,500–2,000 → Rs 7,000–11,000</text></g><g><text x="168" y="266" text-anchor="end" font-weight="600" fill="#1b1a17">Disposable mask</text><rect x="180" y="248" width="35" height="26" fill="#b9b3a8" fill-opacity="1"></rect><text x="223" y="266" font-weight="600" fill="#1b1a17">2.5x</text><text x="267" y="266" font-size="11.5" fill="#6d685f">153% mark-up</text></g><line x1="196.8" x2="196.8" y1="80" y2="286" stroke="#2f9e5b" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="200.8" y="76" font-size="11" fill="#2f9e5b">a 20% cap on the landing-price-to-MRP gap would sit here (1.2x)</text><text x="24" y="318" font-size="11" fill="#6d685f">IV set, syringe and mask: a Maharashtra price-monitoring survey of inpatient consumables. Catheter: industry body AiMeD</text><text x="24" y="334" font-size="11" fill="#6d685f">(landed vs MRP, midpoint multiple). The 20% cap is a parliamentary committee suggestion, not policy.</text></svg>