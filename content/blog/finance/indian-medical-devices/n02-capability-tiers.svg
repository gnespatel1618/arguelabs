<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 400" role="img" aria-label="India makes disposables, assembles mid-tech devices and imports the high end" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">India makes the disposables, assembles the middle and imports the top</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">India&#x27;s medical-device capability, by tier. Placement of products is a synthesis of industry sources.</text><g><rect x="160" y="70" width="440" height="70" fill="#d8463d" fill-opacity="0.16" stroke="#d8463d" stroke-width="1.5"></rect><text x="380" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b1a17">Tier 3: Mostly imports</text><text x="380" y="120" text-anchor="middle" font-size="11" fill="#6d685f">Advanced MRI and CT, robotic surgery, pacemakers, CGMs, high-end analysers</text></g><g><rect x="90" y="148" width="580" height="70" fill="#e2a623" fill-opacity="0.16" stroke="#e2a623" stroke-width="1.5"></rect><text x="380" y="176" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b1a17">Tier 2: Makes the device, imports the critical input</text><text x="380" y="198" text-anchor="middle" font-size="12" fill="#6d685f">Stents, dialysers, ultrasound and X-ray, monitors, analysers</text></g><g><rect x="24" y="226" width="712" height="70" fill="#2f9e5b" fill-opacity="0.16" stroke="#2f9e5b" stroke-width="1.5"></rect><text x="380" y="254" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b1a17">Tier 1: Makes competitively</text><text x="380" y="276" text-anchor="middle" font-size="11" fill="#6d685f">IV sets, cannulas, syringes, needles, blood bags, gloves, labware</text></g><rect x="30" y="310" width="700" height="58" fill="none" stroke="#1b1a17" stroke-dasharray="5 4"></rect><text x="380" y="334" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b1a17">Under every tier: components India barely makes</text><text x="380" y="354" text-anchor="middle" fill="#6d685f">Medical-grade resins, specialty alloys, membranes, X-ray tubes, detectors, sensors, chips, magnets</text></svg>