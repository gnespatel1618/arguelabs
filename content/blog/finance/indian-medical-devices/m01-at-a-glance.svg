<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="Indian medical devices at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Indian medical devices at a glance, 24 Oct 2026</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="82" fill="#6d685f">India market size, 2025</text><text x="40" y="112" font-size="22" font-weight="600" fill="#1b1a17">$15–19B</text><text x="40" y="136" font-size="11.5" fill="#6d685f">Forecast growth: 6% to 27% a year</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="280" y="82" fill="#6d685f">Imports vs exports, FY25</text><text x="280" y="112" font-size="22" font-weight="600" fill="#1b1a17">$8.8B vs $4B</text><text x="280" y="136" font-size="11.5" fill="#6d685f">Net importer by about $4.8B</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="82" fill="#6d685f">Local content</text><text x="520" y="112" font-size="22" font-weight="600" fill="#1b1a17">~30%</text><text x="520" y="136" font-size="11.5" fill="#6d685f">The rest of the value is imported</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="194" fill="#6d685f">Domestic share of local demand</text><text x="40" y="224" font-size="22" font-weight="600" fill="#1b1a17">~10% → ~30%</text><text x="40" y="248" font-size="11.5" fill="#6d685f">Over the last five years</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="280" y="194" fill="#6d685f">Poly Medicure EV/EBITDA</text><text x="280" y="224" font-size="22" font-weight="600" fill="#1b1a17">25.8x</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Global device median: 13.7x</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.75"></rect><text x="520" y="194" fill="#6d685f">Growth Poly&#x27;s price needs</text><text x="520" y="224" font-size="22" font-weight="600" fill="#d8463d">~35% a year</text><text x="520" y="248" font-size="11.5" fill="#6d685f">To FY30; my base case is 17%</text></g></svg>