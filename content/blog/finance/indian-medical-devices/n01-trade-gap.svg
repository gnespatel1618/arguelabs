<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 310" role="img" aria-label="India imports more than twice what it exports in medical devices" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">India imports more than twice the medical devices it exports</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Medical devices trade, US$ billion</text><g><line x1="200" x2="200" y1="74" y2="220" stroke="#e4ded2"></line><text x="200" y="236" text-anchor="middle" font-size="11" fill="#6d685f">0</text></g><g><line x1="300" x2="300" y1="74" y2="220" stroke="#e4ded2"></line><text x="300" y="236" text-anchor="middle" font-size="11" fill="#6d685f">5</text></g><g><line x1="400" x2="400" y1="74" y2="220" stroke="#e4ded2"></line><text x="400" y="236" text-anchor="middle" font-size="11" fill="#6d685f">10</text></g><g><line x1="500" x2="500" y1="74" y2="220" stroke="#e4ded2"></line><text x="500" y="236" text-anchor="middle" font-size="11" fill="#6d685f">15</text></g><g><line x1="600" x2="600" y1="74" y2="220" stroke="#e4ded2"></line><text x="600" y="236" text-anchor="middle" font-size="11" fill="#6d685f">20</text></g><g><text x="188" y="102" text-anchor="end" font-weight="600" fill="#1b1a17">Imports, FY25</text><rect x="200" y="84" width="176" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="384" y="102" font-weight="600" fill="#1b1a17">$8.8B</text></g><g><text x="188" y="152" text-anchor="end" font-weight="600" fill="#1b1a17">Exports, FY25</text><rect x="200" y="134" width="80" height="26" fill="#4f7be0" fill-opacity="0.85"></rect><text x="288" y="152" font-weight="600" fill="#1b1a17">$4B</text></g><g><text x="188" y="202" text-anchor="end" font-weight="600" fill="#1b1a17">Export target, FY30</text><rect x="200" y="184" width="400" height="26" fill="none" stroke="#4f7be0" stroke-dasharray="5 4" stroke-width="1.5"></rect><text x="608" y="202" font-weight="600" fill="#1b1a17">$20B</text></g><rect x="24" y="252" width="712" height="44" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="38" y="270" fill="#1b1a17">Local content is only about 30%. About 6,000 devices sit across 160 customs codes,</text><text x="38" y="287" fill="#1b1a17">and 40 of those codes make up roughly 85% of the import bill.</text></svg>