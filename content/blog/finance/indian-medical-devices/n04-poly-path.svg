<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 360" role="img" aria-label="Poly Medicure price needs revenue far above its own target" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Poly&#x27;s price needs revenue far above its own Vision 2030 target</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Revenue, Rs crore. &quot;What the price needs&quot; = FY26 revenue compounded at the ~35% a year the reverse DCF requires.</text><g><line x1="70" x2="560" y1="300" y2="300" stroke="#e4ded2"></line><text x="62" y="304" text-anchor="end" fill="#6d685f">0</text></g><g><line x1="70" x2="560" y1="237.14285714285714" y2="237.14285714285714" stroke="#e4ded2"></line><text x="62" y="241.14285714285714" text-anchor="end" fill="#6d685f">2,000</text></g><g><line x1="70" x2="560" y1="174.28571428571428" y2="174.28571428571428" stroke="#e4ded2"></line><text x="62" y="178.28571428571428" text-anchor="end" fill="#6d685f">4,000</text></g><g><line x1="70" x2="560" y1="111.42857142857144" y2="111.42857142857144" stroke="#e4ded2"></line><text x="62" y="115.42857142857144" text-anchor="end" fill="#6d685f">6,000</text></g><g><rect x="86" y="241.07142857142858" width="70" height="58.928571428571416" fill="#1b1a17" fill-opacity="1"></rect><text x="121" y="233.07142857142858" text-anchor="middle" font-weight="600" fill="#1b1a17">1,875</text><text x="121" y="316" text-anchor="middle" font-size="11" fill="#6d685f">FY26 actual</text></g><g><rect x="190" y="227.71428571428572" width="70" height="72.28571428571428" fill="#4f7be0" fill-opacity="1"></rect><rect x="190" y="224.57142857142856" width="70" height="3.142857142857167" fill="#4f7be0" fill-opacity="0.35"></rect><text x="225" y="216.57142857142856" text-anchor="middle" font-weight="600" fill="#1b1a17">2,300–2,400</text><text x="225" y="316" text-anchor="middle" font-size="11" fill="#6d685f">FY27 guidance</text></g><g><rect x="294" y="189.12" width="70" height="110.88" fill="#b9b3a8" fill-opacity="1"></rect><text x="329" y="181.12" text-anchor="middle" font-weight="600" fill="#1b1a17">3,528</text><text x="329" y="316" text-anchor="middle" font-size="11" fill="#6d685f">FY30</text><text x="329" y="330" text-anchor="middle" font-size="11" fill="#1b1a17">my base (E)</text></g><g><rect x="398" y="182.14285714285717" width="70" height="117.85714285714283" fill="#b9b3a8" fill-opacity="1"></rect><text x="433" y="174.14285714285717" text-anchor="middle" font-weight="600" fill="#1b1a17">3,750</text><text x="433" y="316" text-anchor="middle" font-size="11" fill="#6d685f">FY30</text><text x="433" y="330" text-anchor="middle" font-size="11" fill="#1b1a17">Vision 2030</text></g><g><rect x="502" y="104.23142857142855" width="70" height="195.76857142857145" fill="#d8463d" fill-opacity="0.85"></rect><text x="537" y="96.23142857142855" text-anchor="middle" font-weight="600" fill="#1b1a17">~6,229</text><text x="537" y="316" text-anchor="middle" font-size="11" fill="#6d685f">FY30</text><text x="537" y="330" text-anchor="middle" font-size="11" fill="#1b1a17">what the price needs</text></g><rect x="590" y="86" width="150" height="176" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="604" y="108" font-weight="600" fill="#1b1a17">FY27 check</text><text x="604" y="128" font-size="11" fill="#6d685f">To hit the Rs 2,300 cr</text><text x="604" y="142" font-size="11" fill="#6d685f">floor, Q2–Q4 must</text><text x="604" y="156" font-size="11" fill="#6d685f">average per quarter:</text><text x="604" y="186" font-size="20" font-weight="600" fill="#4f7be0">Rs 592 cr</text><text x="604" y="210" font-size="11" fill="#6d685f">against Q1 FY27:</text><text x="604" y="238" font-size="20" font-weight="600" fill="#1b1a17">Rs 525 cr</text></svg>