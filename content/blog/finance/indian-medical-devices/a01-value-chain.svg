<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 412" role="img" aria-label="Margins are fat at the maker and the hospital, thin in between" font-size="11.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Margins are fat at the maker and the hospital, thin in between</text><g stroke="#e4ded2"><line x1="24" x2="736" y1="186" y2="186"></line><line x1="24" x2="736" y1="272" y2="272"></line></g><text x="24" y="134" font-weight="600" fill="#6d685f">WHO</text><text x="24" y="204" font-weight="600" fill="#6d685f">MARGIN EVIDENCE</text><text x="24" y="290" font-weight="600" fill="#6d685f">WHAT CAN HURT</text><g><polygon points="24,52 146,52 162,80 146,108 24,108" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></polygon><text text-anchor="middle" font-size="13" font-weight="600" fill="#1b1a17"><tspan x="86" y="77">Components</tspan><tspan x="86" y="93">and inputs</tspan></text><text x="30" y="154" fill="#1b1a17">Resins, metals,</text><text x="30" y="170" fill="#1b1a17">sensors, chips</text><text x="30" y="224" font-weight="400" fill="#1b1a17">60-70% of Poly&#x27;s raw</text><text x="30" y="240" font-weight="400" fill="#1b1a17">materials imported</text><text x="30" y="256" font-weight="400" fill="#6d685f">(FY22-23 data)</text><text x="30" y="310" fill="#1b1a17">FX, resin and</text><text x="30" y="326" fill="#1b1a17">freight costs</text></g><g><polygon points="166,52 288,52 304,80 288,108 166,108 182,80" fill="#4f7be0" fill-opacity="0.12" stroke="#4f7be0" stroke-width="2"></polygon><text text-anchor="middle" font-size="13" font-weight="600" fill="#1b1a17"><tspan x="236" y="85">Manufacturer</tspan></text><text x="172" y="154" fill="#1b1a17">Poly Medicure, SMT,</text><text x="172" y="170" fill="#1b1a17">Tarsons, MNCs</text><text x="172" y="224" font-weight="600" fill="#1b1a17">EBITDA 14% to 28%:</text><text x="172" y="240" font-weight="400" fill="#1b1a17">Poly 24-28%,</text><text x="172" y="256" font-weight="400" fill="#1b1a17">SMT 14%</text><text x="172" y="310" fill="#1b1a17">Dumping, tariffs,</text><text x="172" y="326" fill="#1b1a17">PLI ends FY27</text></g><g><polygon points="308,52 430,52 446,80 430,108 308,108 324,80" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></polygon><text text-anchor="middle" font-size="13" font-weight="600" fill="#1b1a17"><tspan x="378" y="77">Importer /</tspan><tspan x="378" y="93">distributor</tspan></text><text x="314" y="154" fill="#1b1a17">Meril India, dealers,</text><text x="314" y="170" fill="#1b1a17">dental e-commerce</text><text x="314" y="224" font-weight="600" fill="#1b1a17">Operating 4% to 10%:</text><text x="314" y="240" font-weight="400" fill="#1b1a17">Meril India 10%,</text><text x="314" y="256" font-weight="400" fill="#1b1a17">Vasa Denticity 4-6%</text><text x="314" y="310" fill="#1b1a17">Margin caps and</text><text x="314" y="326" fill="#1b1a17">working capital</text></g><g><polygon points="450,52 572,52 588,80 572,108 450,108 466,80" fill="#4f7be0" fill-opacity="0.12" stroke="#4f7be0" stroke-width="2"></polygon><text text-anchor="middle" font-size="13" font-weight="600" fill="#1b1a17"><tspan x="520" y="77">Hospital /</tspan><tspan x="520" y="93">clinic</tspan></text><text x="456" y="154" fill="#1b1a17">Apollo, Narayana,</text><text x="456" y="170" fill="#1b1a17">stand-alone clinics</text><text x="456" y="224" font-weight="600" fill="#1b1a17">Apollo net 7.9%.</text><text x="456" y="240" font-weight="400" fill="#1b1a17">Consumable MRP up</text><text x="456" y="256" font-weight="400" fill="#1b1a17">to ~29x purchase price</text><text x="456" y="310" fill="#1b1a17">Billing probes,</text><text x="456" y="326" fill="#1b1a17">insurer packages</text></g><g><polygon points="592,52 714,52 730,80 714,108 592,108 608,80" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></polygon><text text-anchor="middle" font-size="13" font-weight="600" fill="#1b1a17"><tspan x="662" y="77">Payer /</tspan><tspan x="662" y="93">patient</tspan></text><text x="598" y="154" fill="#1b1a17">Households, insurers,</text><text x="598" y="170" fill="#1b1a17">Ayushman Bharat</text><text x="598" y="224" font-weight="400" fill="#1b1a17">Pays the billed MRP,</text><text x="598" y="240" font-weight="400" fill="#1b1a17">the top of the</text><text x="598" y="256" font-weight="400" fill="#1b1a17">mark-up chain</text><text x="598" y="310" fill="#1b1a17">Price sensitivity,</text><text x="598" y="326" fill="#1b1a17">policy change</text></g><rect x="24" y="350" width="712" height="36" rx="8" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><text x="380" y="372" text-anchor="middle" fill="#1b1a17">Across every stage: price control and trade-margin rules (NPPA, DoP), tariffs, PLI support</text></svg>