<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 370" role="img" aria-label="What Poly Medicure at Rs 1,444 requires" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">What Rs 1,444 asks of Poly Medicure, one variable at a time</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Reverse DCF: solve for one input, keep the rest at my base case. Red = what the price needs.</text><g><line x1="220" x2="220" y1="74" y2="282" stroke="#e4ded2"></line><text x="220" y="300" text-anchor="middle" fill="#6d685f">0%</text></g><g><line x1="320" x2="320" y1="74" y2="282" stroke="#e4ded2"></line><text x="320" y="300" text-anchor="middle" fill="#6d685f">10%</text></g><g><line x1="420" x2="420" y1="74" y2="282" stroke="#e4ded2"></line><text x="420" y="300" text-anchor="middle" fill="#6d685f">20%</text></g><g><line x1="520" x2="520" y1="74" y2="282" stroke="#e4ded2"></line><text x="520" y="300" text-anchor="middle" fill="#6d685f">30%</text></g><g><line x1="620" x2="620" y1="74" y2="282" stroke="#e4ded2"></line><text x="620" y="300" text-anchor="middle" fill="#6d685f">40%</text></g><g><line x1="720" x2="720" y1="74" y2="282" stroke="#e4ded2"></line><text x="720" y="300" text-anchor="middle" fill="#6d685f">50%</text></g><g><text x="24" y="104" font-weight="600" fill="#1b1a17">Revenue growth to FY30</text><line x1="391" x2="570" y1="100" y2="100" stroke="#1b1a17" stroke-width="1"></line><g><circle cx="391" cy="100" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="391" y="88" text-anchor="middle" font-size="11" fill="#6d685f">my base 17.1%</text></g><g><circle cx="409" cy="100" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="409" y="124" text-anchor="middle" font-size="11" fill="#6d685f">Vision 2030 18.9%</text></g><circle cx="570" cy="100" r="8" fill="#d8463d"></circle><text x="570" y="86" text-anchor="middle" font-weight="600" fill="#d8463d">needs 35%</text></g><g><text x="24" y="182" font-weight="600" fill="#1b1a17">Discount rate</text><line x1="290" x2="345" y1="178" y2="178" stroke="#1b1a17" stroke-width="1"></line><g><circle cx="345" cy="178" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="341" y="202" text-anchor="start" font-size="11" fill="#6d685f">my cost of capital 12.5%</text></g><g><circle cx="290" cy="178" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="294" y="202" text-anchor="end" font-size="11" fill="#6d685f">bond rate 7%</text></g><circle cx="311" cy="178" r="8" fill="#d8463d"></circle><text x="311" y="164" text-anchor="middle" font-weight="600" fill="#d8463d">needs 9.1%</text></g><g><text x="24" y="260" font-weight="600" fill="#1b1a17">EBITDA margin, every year</text><line x1="460" x2="700" y1="256" y2="256" stroke="#1b1a17" stroke-width="1"></line><g><circle cx="460" cy="256" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="460" y="244" text-anchor="middle" font-size="11" fill="#6d685f">guidance 23–25%</text></g><g><circle cx="491" cy="256" r="6" fill="#b9b3a8" stroke="#1b1a17"></circle><text x="491" y="280" text-anchor="middle" font-size="11" fill="#6d685f">global median 27.1%</text></g><circle cx="700" cy="256" r="8" fill="#d8463d"></circle><text x="700" y="242" text-anchor="middle" font-weight="600" fill="#d8463d">needs 48%</text></g><text x="24" y="358" font-size="11" fill="#6d685f">A 9.1% discount rate is barely two points above the government bond yield: how a very safe compounder is priced.</text></svg>