<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 350" role="img" aria-label="A 12% return needs 16% EPS growth and a 40x exit" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">A 12% return from Rs 1,444 needs ~16% EPS growth and a 40x exit P/E</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Price today that earns 12% a year for five years, by EPS growth and exit P/E. Green = at or above Rs 1,444.</text><text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#6d685f">Exit P/E in five years →</text><text x="250" y="94" text-anchor="middle" font-weight="600" fill="#1b1a17">25x</text><text x="370" y="94" text-anchor="middle" font-weight="600" fill="#1b1a17">30x</text><text x="490" y="94" text-anchor="middle" font-weight="600" fill="#1b1a17">35x</text><text x="610" y="94" text-anchor="middle" font-weight="600" fill="#1b1a17">40x</text><text x="176" y="94" text-anchor="end" font-size="11.5" fill="#6d685f">EPS growth ↓</text><g><text x="176" y="132" text-anchor="end" font-weight="400" fill="#1b1a17">12% a year</text><g><rect x="190" y="104" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="248" y="131" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 777</text></g><g><rect x="310" y="104" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="368" y="131" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 933</text></g><g><rect x="430" y="104" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="488" y="131" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 1,088</text></g><g><rect x="550" y="104" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="608" y="131" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 1,244</text></g></g><g><text x="176" y="178" text-anchor="end" font-weight="600" fill="#1b1a17">16% (my base)</text><g><rect x="190" y="150" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="248" y="177" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 926</text></g><g><rect x="310" y="150" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="368" y="177" text-anchor="middle" font-weight="700" fill="#1b1a17">Rs 1,112</text><rect x="309" y="149" width="118" height="44" fill="none" stroke="#1b1a17" stroke-width="2"></rect></g><g><rect x="430" y="150" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="488" y="177" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 1,297</text></g><g><rect x="550" y="150" width="116" height="42" fill="#2f9e5b" fill-opacity="0.3"></rect><text x="608" y="177" text-anchor="middle" font-weight="700" fill="#1b1a17">Rs 1,482</text></g></g><g><text x="176" y="224" text-anchor="end" font-weight="400" fill="#1b1a17">20% a year</text><g><rect x="190" y="196" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="248" y="223" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 1,097</text></g><g><rect x="310" y="196" width="116" height="42" fill="#b9b3a8" fill-opacity="0.25"></rect><text x="368" y="223" text-anchor="middle" font-weight="400" fill="#1b1a17">Rs 1,317</text></g><g><rect x="430" y="196" width="116" height="42" fill="#2f9e5b" fill-opacity="0.3"></rect><text x="488" y="223" text-anchor="middle" font-weight="700" fill="#1b1a17">Rs 1,536</text></g><g><rect x="550" y="196" width="116" height="42" fill="#2f9e5b" fill-opacity="0.3"></rect><text x="608" y="223" text-anchor="middle" font-weight="700" fill="#1b1a17">Rs 1,756</text></g></g><text x="24" y="278" font-size="11.5" fill="#1b1a17">Boxed: my base EPS growth at a 30x exit supports about Rs 1,112, roughly 23% below today.</text><text x="24" y="296" font-size="11.5" fill="#6d685f">Starting from trailing EPS of Rs 31.09; returns before dividends.</text><text x="24" y="312" font-size="11.5" fill="#6d685f">Five turns of exit P/E or four points of EPS growth are each worth roughly Rs 180–200 a share.</text></svg>