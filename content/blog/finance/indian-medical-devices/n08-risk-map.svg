<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 420" role="img" aria-label="Price risks are the most likely and most damaging" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The biggest risks are about price, not demand</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Likelihood and impact are my judgement, not measured probabilities</text><text x="238" y="392" text-anchor="middle" font-size="11.5" fill="#6d685f">Medium</text><text x="440" y="392" text-anchor="middle" font-size="11.5" fill="#6d685f">Medium-high</text><text x="642" y="392" text-anchor="middle" font-size="11.5" fill="#6d685f">High</text><text x="443" y="412" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d685f">Likelihood →</text><text x="128" y="134" text-anchor="end" font-size="11.5" fill="#6d685f">High</text><text x="128" y="232" text-anchor="end" font-size="11.5" fill="#6d685f">Medium</text><text x="128" y="330" text-anchor="end" font-size="11.5" fill="#6d685f">Low-medium</text><text x="24" y="74" font-size="11.5" font-weight="600" fill="#6d685f">Impact ↓</text><g><rect x="140" y="84" width="196" height="92" rx="6" fill="#e2a623" fill-opacity="0.12" stroke="#e4ded2"></rect></g><g><rect x="342" y="84" width="196" height="92" rx="6" fill="#d8463d" fill-opacity="0.12" stroke="#e4ded2"></rect><g><circle cx="356" cy="100" r="3.5" fill="#d8463d"></circle><text x="366" y="104" font-size="11.5" font-weight="600" fill="#1b1a17">Trade-margin or price caps</text></g><g><circle cx="356" cy="119" r="3.5" fill="#d8463d"></circle><text x="366" y="123" font-size="11.5" font-weight="600" fill="#1b1a17">De-rating of premium multiples</text></g></g><g><rect x="544" y="84" width="196" height="92" rx="6" fill="#d8463d" fill-opacity="0.12" stroke="#e4ded2"></rect></g><g><rect x="140" y="182" width="196" height="92" rx="6" fill="none" fill-opacity="1" stroke="#e4ded2"></rect><g><circle cx="154" cy="198" r="3.5" fill="#1b1a17"></circle><text x="164" y="202" font-size="11.5" font-weight="400" fill="#1b1a17">US tariffs (Section 232)</text></g><g><circle cx="154" cy="217" r="3.5" fill="#1b1a17"></circle><text x="164" y="221" font-size="11.5" font-weight="400" fill="#1b1a17">Working-capital stretch</text></g></g><g><rect x="342" y="182" width="196" height="92" rx="6" fill="#e2a623" fill-opacity="0.12" stroke="#e4ded2"></rect></g><g><rect x="544" y="182" width="196" height="92" rx="6" fill="#d8463d" fill-opacity="0.12" stroke="#e4ded2"></rect><g><circle cx="558" cy="198" r="3.5" fill="#d8463d"></circle><text x="568" y="202" font-size="11.5" font-weight="400" fill="#1b1a17">Chinese and ASEAN dumping</text></g><g><circle cx="558" cy="217" r="3.5" fill="#d8463d"></circle><text x="568" y="221" font-size="11.5" font-weight="400" fill="#1b1a17">Thin component base</text></g><g><circle cx="558" cy="236" r="3.5" fill="#d8463d"></circle><text x="568" y="240" font-size="11.5" font-weight="400" fill="#1b1a17">Inverted duty and GST</text></g><g><circle cx="558" cy="255" r="3.5" fill="#d8463d"></circle><text x="568" y="259" font-size="11.5" font-weight="400" fill="#1b1a17">Integration and cost inflation</text></g></g><g><rect x="140" y="280" width="196" height="92" rx="6" fill="none" fill-opacity="1" stroke="#e4ded2"></rect><g><circle cx="154" cy="296" r="3.5" fill="#1b1a17"></circle><text x="164" y="300" font-size="11.5" font-weight="400" fill="#1b1a17">PLI scheme ends FY27</text></g></g><g><rect x="342" y="280" width="196" height="92" rx="6" fill="none" fill-opacity="1" stroke="#e4ded2"></rect></g><g><rect x="544" y="280" width="196" height="92" rx="6" fill="#e2a623" fill-opacity="0.12" stroke="#e4ded2"></rect></g></svg>