<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 290" role="img" aria-label="Poly Medicure warning lights" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Poly Medicure: sales are growing; margin, cash and ownership are the warning lights</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">From Screener.in (23 Oct 2026), the Q1 FY27 call and company slides</text><g><rect x="24" y="70" width="172" height="92" fill="#d8463d" fill-opacity="0.12" stroke="#d8463d" stroke-width="1.25"></rect><rect x="24" y="70" width="5" height="92" fill="#d8463d"></rect><text x="38" y="92" fill="#6d685f">Q1 FY27 net profit</text><text x="38" y="122" font-size="19" font-weight="600" fill="#1b1a17">−8.6%</text><text x="38" y="144" font-size="11" fill="#6d685f">on sales up 30%</text></g><g><rect x="204" y="70" width="172" height="92" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="204" y="70" width="5" height="92" fill="#e2a623"></rect><text x="218" y="92" fill="#6d685f">EBITDA margin</text><text x="218" y="122" font-size="19" font-weight="600" fill="#1b1a17">24.1%</text><text x="218" y="144" font-size="11" fill="#6d685f">from 26.7% a year ago</text></g><g><rect x="384" y="70" width="172" height="92" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="384" y="70" width="5" height="92" fill="#e2a623"></rect><text x="398" y="92" fill="#6d685f">Debtor days</text><text x="398" y="122" font-size="19" font-weight="600" fill="#1b1a17">76 → 103</text><text x="398" y="144" font-size="11" fill="#6d685f">FY26</text></g><g><rect x="564" y="70" width="172" height="92" fill="#d8463d" fill-opacity="0.12" stroke="#d8463d" stroke-width="1.25"></rect><rect x="564" y="70" width="5" height="92" fill="#d8463d"></rect><text x="578" y="92" fill="#6d685f">Inventory days</text><text x="578" y="122" font-size="19" font-weight="600" fill="#1b1a17">323</text><text x="578" y="144" font-size="11" fill="#6d685f">FY26</text></g><g><rect x="24" y="170" width="172" height="92" fill="#d8463d" fill-opacity="0.12" stroke="#d8463d" stroke-width="1.25"></rect><rect x="24" y="170" width="5" height="92" fill="#d8463d"></rect><text x="38" y="192" fill="#6d685f">Foreign holding</text><text x="38" y="222" font-size="19" font-weight="600" fill="#1b1a17">12.3% → 5.4%</text><text x="38" y="244" font-size="11" fill="#6d685f">in seven quarters</text></g><g><rect x="204" y="170" width="172" height="92" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="204" y="170" width="5" height="92" fill="#e2a623"></rect><text x="218" y="192" fill="#6d685f">Renal sales</text><text x="218" y="222" font-size="19" font-weight="600" fill="#1b1a17">−3.8%</text><text x="218" y="244" font-size="11" fill="#6d685f">Q1 FY27, Chinese pricing</text></g><g><rect x="384" y="170" width="172" height="92" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="384" y="170" width="5" height="92" fill="#e2a623"></rect><text x="398" y="192" fill="#6d685f">Employee cost</text><text x="398" y="222" font-size="19" font-weight="600" fill="#1b1a17">+28.5%</text><text x="398" y="244" font-size="11" fill="#6d685f">Haryana wage up 35%</text></g><g><rect x="564" y="170" width="172" height="92" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="564" y="170" width="5" height="92" fill="#e2a623"></rect><text x="578" y="192" fill="#6d685f">R&amp;D</text><text x="578" y="222" font-size="19" font-weight="600" fill="#1b1a17">1.6% of sales</text><text x="578" y="244" font-size="11" fill="#6d685f">global median 7.3%</text></g></svg>