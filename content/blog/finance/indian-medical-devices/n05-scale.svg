<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="The largest listed Indian maker is about 1/165th of Medtronic" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The largest listed Indian maker is about 1/165th of Medtronic</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">FY26 revenue drawn as area. Converted at an illustrative Rs 85 per dollar.</text><rect x="60" y="76" width="230" height="230" fill="#b9b3a8" fill-opacity="0.5" stroke="#1b1a17"></rect><text x="175" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1a17">Medtronic</text><text x="175" y="205" text-anchor="middle" fill="#1b1a17">$36.4 billion</text><rect x="330" y="288.09452428428494" width="17.905475715715028" height="17.905475715715028" fill="#4f7be0"></rect><line x1="347.90547571571506" x2="360" y1="297.0472621421425" y2="266" stroke="#1b1a17"></line><text x="366" y="262" font-weight="600" fill="#1b1a17">Poly Medicure</text><text x="366" y="278" fill="#1b1a17">Rs 1,875 cr (~$0.22 billion)</text><g><text x="420" y="96" font-weight="600" fill="#1b1a17">Other Indian listed makers, FY26</text><text x="420" y="118" fill="#6d685f">SMT (stents): Rs 1,219 cr</text><text x="420" y="136" fill="#6d685f">Tarsons (labware): Rs 423 cr</text><text x="420" y="166" font-weight="600" fill="#1b1a17">The global market</text><text x="420" y="186" fill="#6d685f">About $572 billion a year</text></g></svg>