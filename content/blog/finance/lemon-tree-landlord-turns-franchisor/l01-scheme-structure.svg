<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 470" role="img" aria-label="After the scheme, Lemon Tree keeps the brand and owns 41% of the buildings" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="lt-own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d685f"/></marker><marker id="lt-fee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f7be0"/></marker></defs>
<text x="24" y="30" font-size="16" fill="#1b1a17">After the scheme, Lemon Tree keeps the brand and owns 41% of the buildings</text>
<rect x="40" y="60" width="320" height="48" rx="8" fill="none" stroke="#6d685f" stroke-width="1.25"/>
<text x="200" y="88" font-weight="600" text-anchor="middle" fill="#1b1a17">Lemon Tree shareholders</text>
<rect x="560" y="60" width="176" height="48" rx="8" fill="none" stroke="#6d685f" stroke-width="1.25"/>
<text x="648" y="88" font-weight="600" text-anchor="middle" fill="#1b1a17">Warburg Pincus</text>
<rect x="24" y="170" width="320" height="112" rx="8" fill="#4f7be0" fill-opacity="0.10" stroke="#4f7be0" stroke-width="2"/>
<text x="40" y="194" font-weight="600" fill="#1b1a17">Lemon Tree Hotels (asset-light)</text>
<text x="40" y="214" font-size="11.5" fill="#1b1a17">Brands, loyalty, distribution, management</text>
<text x="40" y="230" font-size="11.5" fill="#1b1a17">Fees from 39 Fleur + ~97 third-party hotels</text>
<text x="40" y="246" font-size="11.5" fill="#1b1a17">Keeps 2 leased hotels (202 rooms)</text>
<text x="40" y="262" font-size="11.5" fill="#1b1a17">Zero debt after the scheme</text>
<rect x="416" y="170" width="320" height="112" rx="8" fill="none" stroke="#6d685f" stroke-width="1.25"/>
<text x="432" y="194" font-weight="600" fill="#1b1a17">Fleur Hotels (owns the buildings)</text>
<text x="432" y="214" font-size="11.5" fill="#1b1a17">39 hotels, ~5,600 rooms + 2 under construction</text>
<text x="432" y="230" font-size="11.5" fill="#1b1a17">Carries all group debt (~Rs 1,430 Cr)</text>
<text x="432" y="246" font-size="11.5" fill="#1b1a17">Up to Rs 960 Cr primary from Warburg</text>
<text x="432" y="262" font-size="11.5" fill="#1b1a17">Listing on NSE/BSE targeted for CY27</text>
<rect x="24" y="340" width="320" height="72" rx="8" fill="none" stroke="#6d685f" stroke-width="1.25"/>
<text x="40" y="364" font-weight="600" fill="#1b1a17">Third-party hotel owners</text>
<text x="40" y="384" font-size="11.5" fill="#1b1a17">6,452 rooms operating, ~10,900 in pipeline</text>
<text x="40" y="400" font-size="11.5" fill="#1b1a17">+ Omaxe MoU for ~4,000 keys (Oct 2026)</text>
<g fill="none" stroke="#6d685f" stroke-width="1.25"><path d="M200 108V170" marker-end="url(#lt-own)"/><path d="M360 84H496V170" marker-end="url(#lt-own)"/><path d="M648 108V170" marker-end="url(#lt-own)"/><path d="M344 200H416" marker-end="url(#lt-own)"/></g>
<g fill="none" stroke="#4f7be0" stroke-width="1.25" stroke-dasharray="5 4"><path d="M416 258H344" marker-end="url(#lt-fee)"/><path d="M184 340V282" marker-end="url(#lt-fee)"/></g>
<text x="208" y="144" font-size="11.5" fill="#6d685f">100%</text>
<text x="372" y="76" font-size="11.5" fill="#6d685f">32.96% direct</text>
<text x="656" y="144" font-size="11.5" fill="#6d685f">26.01%</text>
<text x="380" y="192" font-size="11.5" text-anchor="middle" fill="#6d685f">41.03%</text>
<text x="380" y="276" font-size="11.5" text-anchor="middle" fill="#6d685f">fees</text>
<text x="380" y="292" font-size="11.5" text-anchor="middle" fill="#6d685f">Rs 96 Cr</text>
<text x="192" y="316" font-size="11.5" fill="#6d685f">base + incentive fees, Rs 74 Cr (FY26)</text>
<text x="24" y="448" font-size="11.5" fill="#6d685f">Solid = ownership, before Warburg's primary money dilutes it. Dashed = fee flow, FY26.</text>
