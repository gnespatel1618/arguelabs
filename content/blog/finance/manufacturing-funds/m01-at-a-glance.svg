<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="Manufacturing funds at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">India&#x27;s manufacturing funds at a glance, 30 Oct 2026</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="40" y="82" font-size="13" fill="#6d685f">Index fund, 3 years</text><text x="40" y="112" font-size="22" font-weight="600" fill="#2f9e5b">16.6% a yr</text><text x="40" y="136" font-size="11.5" fill="#6d685f">Nifty 500 fund: 9.9% a year</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="280" y="82" font-size="13" fill="#6d685f">2-year SIP in the index fund</text><text x="280" y="112" font-size="22" font-weight="600" fill="#d8463d">2.5% a yr</text><text x="280" y="136" font-size="11.5" fill="#6d685f">Late buyers earned little</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="520" y="82" font-size="13" fill="#6d685f">Worst fall, 2024–25</text><text x="520" y="112" font-size="22" font-weight="600" fill="#d8463d">−23.2%</text><text x="520" y="136" font-size="11.5" fill="#6d685f">Nifty 500: −17.6%</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="194" font-size="13" fill="#6d685f">Index P/E</text><text x="40" y="224" font-size="22" font-weight="600" fill="#1b1a17">25.6</text><text x="40" y="248" font-size="11.5" fill="#6d685f">5-year median: 26.9</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.6"></rect><text x="280" y="194" font-size="11.5" fill="#6d685f">Active funds that beat it convincingly</text><text x="280" y="224" font-size="22" font-weight="600" fill="#4f7be0">2 of 12</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Kotak and ICICI, over 3+ years</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#e2a623" stroke-width="1.6"></rect><text x="520" y="194" font-size="13" fill="#6d685f">Funds that changed a manager</text><text x="520" y="224" font-size="22" font-weight="600" fill="#1b1a17">9 of 12</text><text x="520" y="248" font-size="11.5" fill="#6d685f">Nov 2025 to Sep 2026</text></g></svg>