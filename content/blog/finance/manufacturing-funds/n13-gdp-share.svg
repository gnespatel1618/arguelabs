<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 350" role="img" aria-label="Manufacturing is about 17% of GDP against a 25% target" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The 25% target needs a pace manufacturing has never kept up</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Manufacturing as % of GDP (BizzBuzz; National Manufacturing Mission target, Budget 2026–27)</text><g><line x1="80" x2="560" y1="300" y2="300" stroke="#e4ded2"></line><text x="72" y="304" text-anchor="end" fill="#6d685f">0%</text></g><g><line x1="80" x2="560" y1="225" y2="225" stroke="#e4ded2"></line><text x="72" y="229" text-anchor="end" fill="#6d685f">10%</text></g><g><line x1="80" x2="560" y1="150" y2="150" stroke="#e4ded2"></line><text x="72" y="154" text-anchor="end" fill="#6d685f">20%</text></g><rect x="80" y="161.25" width="480" height="26.25" fill="#b9b3a8" fill-opacity="0.15"></rect><g><rect x="120" y="161.25" width="80" height="138.75" fill="#b9b3a8" fill-opacity="0.85" stroke="none" stroke-dasharray="none"></rect><text x="160" y="153.25" text-anchor="middle" font-weight="600" fill="#1b1a17">18.5%</text><text x="160" y="318" text-anchor="middle" fill="#6d685f">Peak, FY22</text></g><g><rect x="270" y="170.25" width="80" height="129.75" fill="#b9b3a8" fill-opacity="0.85" stroke="none" stroke-dasharray="none"></rect><text x="310" y="162.25" text-anchor="middle" font-weight="600" fill="#1b1a17">17.3%</text><text x="310" y="318" text-anchor="middle" fill="#6d685f">FY24</text></g><g><rect x="420" y="112.5" width="80" height="187.5" fill="#4f7be0" fill-opacity="0.25" stroke="#4f7be0" stroke-dasharray="5 4"></rect><text x="460" y="104.5" text-anchor="middle" font-weight="600" fill="#1b1a17">25%</text><text x="460" y="318" text-anchor="middle" fill="#6d685f">Target, 2035</text></g><rect x="590" y="90" width="146" height="186" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="602" y="112" font-size="11" fill="#6d685f">Shaded: where it has</text><text x="602" y="128" font-size="11" fill="#6d685f">stayed for a decade,</text><text x="602" y="144" font-size="11" fill="#6d685f">15–18.5% of GDP.</text><text x="602" y="160" font-size="11" fill="#6d685f"></text><text x="602" y="176" font-size="11" fill="#1b1a17">To reach 25% it must</text><text x="602" y="192" font-size="11" fill="#1b1a17">outgrow the economy</text><text x="602" y="208" font-size="11" fill="#1b1a17">by ~4% a year for</text><text x="602" y="224" font-size="11" fill="#1b1a17">ten years. Make in</text><text x="602" y="240" font-size="11" fill="#6d685f">India set the same</text><text x="602" y="256" font-size="11" fill="#6d685f">goal in 2014.</text></svg>