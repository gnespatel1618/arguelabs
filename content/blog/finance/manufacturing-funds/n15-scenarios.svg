<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Three-year scenarios weight to about 10% a year" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Three-year scenarios weight to about 10% a year, not the 16–17% of the past three</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Return a year from P/E 25.6 = EPS growth plus change in multiple. My assumptions.</text><line x1="330" x2="330" y1="78" y2="264" stroke="#1b1a17"></line><g><text x="24" y="102" font-weight="600" fill="#1b1a17">Bull · 25% chance</text><text x="24" y="119" font-size="11" fill="#6d685f">Brent &lt; $90, RBI reverses, EU deal, capex cycle</text><rect x="330" y="92" width="319.09090909090907" height="26" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="657.090909090909" y="110" text-anchor="start" font-weight="600" fill="#1b1a17">~19.5%</text></g><g><text x="24" y="164" font-weight="600" fill="#1b1a17">Base · 50% chance</text><text x="24" y="181" font-size="11" fill="#6d685f">Brent $95–110; margins squeezed, then recover</text><rect x="330" y="154" width="196.36363636363635" height="26" fill="#4f7be0" fill-opacity="0.8"></rect><text x="534.3636363636364" y="172" text-anchor="start" font-weight="600" fill="#1b1a17">~12%</text></g><g><text x="24" y="226" font-weight="600" fill="#1b1a17">Bear · 25% chance</text><text x="24" y="243" font-size="11" fill="#6d685f">Brent &gt; $120, rupee past 100, global slowdown</text><rect x="280.90909090909093" y="216" width="49.090909090909086" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="274.90909090909093" y="234" text-anchor="end" font-weight="600" fill="#1b1a17">−3%</text></g><line x1="493.6363636363636" x2="493.6363636363636" y1="78" y2="264" stroke="#1b1a17" stroke-dasharray="4 4"></line><text x="493.6363636363636" y="278" text-anchor="middle" font-weight="600" fill="#1b1a17">weighted ~10% a year</text></svg>