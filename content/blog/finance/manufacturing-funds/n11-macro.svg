<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="Strong factories, a cost and funding shock" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Strong factories, hit by a cost and funding shock at the same time</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="40" y="82" fill="#6d685f">Manufacturing PMI, Sep</text><text x="40" y="112" font-size="22" font-weight="600" fill="#2f9e5b">55.1</text><text x="40" y="136" font-size="11.5" fill="#6d685f">Up from 52.8 in August</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="280" y="82" fill="#6d685f">Manufacturing IIP, Sep</text><text x="280" y="112" font-size="22" font-weight="600" fill="#2f9e5b">+7.6%</text><text x="280" y="136" font-size="11.5" fill="#6d685f">Year on year</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="82" fill="#6d685f">Capacity use, Apr–Jun</text><text x="520" y="112" font-size="22" font-weight="600" fill="#1b1a17">74.6%</text><text x="520" y="136" font-size="11.5" fill="#6d685f">76.3% seasonally adjusted</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="40" y="194" fill="#6d685f">Brent crude</text><text x="40" y="224" font-size="22" font-weight="600" fill="#d8463d">&gt;$117</text><text x="40" y="248" font-size="11.5" fill="#6d685f">About $82 in July</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="280" y="194" fill="#6d685f">Rupee per dollar</text><text x="280" y="224" font-size="22" font-weight="600" fill="#d8463d">~96–97</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Past 97 on 8 Oct</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="520" y="194" fill="#6d685f">Repo rate</text><text x="520" y="224" font-size="22" font-weight="600" fill="#d8463d">5.50%</text><text x="520" y="248" font-size="11.5" fill="#6d685f">Raised 25 bp on 7 Oct</text></g></svg>