<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Funds must cut excess overlap over three years or be merged" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The 50% overlap cap: cut the excess in three steps, or be merged</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Share of a fund&#x27;s overlap above 50% that may remain, under SEBI&#x27;s 26 Feb 2026 circular</text><g><line x1="90" x2="560" y1="290" y2="290" stroke="#e4ded2"></line><text x="82" y="294" text-anchor="end" fill="#6d685f">0%</text></g><g><line x1="90" x2="560" y1="190" y2="190" stroke="#e4ded2"></line><text x="82" y="194" text-anchor="end" fill="#6d685f">50%</text></g><g><line x1="90" x2="560" y1="90" y2="90" stroke="#e4ded2"></line><text x="82" y="94" text-anchor="end" fill="#6d685f">100%</text></g><path d="M90 90 H246.66666666666666V160 H403.3333333333333V230 H560V290" fill="none" stroke="#d8463d" stroke-width="2.5"></path><g><circle cx="90" cy="90" r="5" fill="#d8463d"></circle><text x="90" y="308" text-anchor="middle" fill="#6d685f">26 Feb 2026</text></g><g><circle cx="246.66666666666666" cy="160" r="5" fill="#d8463d"></circle><text x="246.66666666666666" y="308" text-anchor="middle" fill="#6d685f">Feb 2027</text><text x="252.66666666666666" y="152" text-anchor="start" font-size="11" fill="#1b1a17">−35%</text></g><g><circle cx="403.3333333333333" cy="230" r="5" fill="#d8463d"></circle><text x="403.3333333333333" y="308" text-anchor="middle" fill="#6d685f">Feb 2028</text><text x="409.3333333333333" y="222" text-anchor="start" font-size="11" fill="#1b1a17">−35%</text></g><g><circle cx="560" cy="290" r="5" fill="#d8463d"></circle><text x="560" y="308" text-anchor="middle" fill="#6d685f">Feb 2029</text><text x="552" y="282" text-anchor="end" font-size="11" fill="#1b1a17">−30%</text></g><rect x="590" y="90" width="146" height="200" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="602" y="112" font-size="11" fill="#6d685f" font-weight="400">Measured quarterly as</text><text x="602" y="129" font-size="11" fill="#6d685f" font-weight="400">the average of daily</text><text x="602" y="146" font-size="11" fill="#6d685f" font-weight="400">overlap with the same</text><text x="602" y="163" font-size="11" fill="#6d685f" font-weight="400">house&#x27;s other equity</text><text x="602" y="180" font-size="11" fill="#6d685f" font-weight="400">funds (large cap</text><text x="602" y="197" font-size="11" fill="#6d685f" font-weight="400">exempt). Disclosed</text><text x="602" y="214" font-size="11" fill="#6d685f" font-weight="400">monthly from Aug 2026.</text><text x="602" y="231" font-size="11" fill="#6d685f" font-weight="400"></text><text x="602" y="248" font-size="11" fill="#1b1a17" font-weight="600">Most affected: the</text><text x="602" y="265" font-size="11" fill="#1b1a17" font-weight="600">near-index funds.</text></svg>