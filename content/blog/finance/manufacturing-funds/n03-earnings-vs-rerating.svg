<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Earnings grew 8.5% but the price fell 2.5% as the P/E shrank" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Businesses got better while shareholders lost money</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Nifty500 Multicap Manufacturing index, year to 30 Oct 2026</text><line x1="80" x2="560" y1="260" y2="260" stroke="#1b1a17"></line><g><rect x="120" y="204.75" width="90" height="55.25" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="165" y="196.75" text-anchor="middle" font-weight="600" fill="#1b1a17">+8.5%</text><text x="165" y="310" text-anchor="middle" fill="#6d685f">Earnings growth</text></g><g><rect x="270" y="204.75" width="90" height="65.64999999999998" fill="#d8463d" fill-opacity="0.8"></rect><text x="315" y="288.4" text-anchor="middle" font-weight="600" fill="#1b1a17">−10.1%</text><text x="315" y="310" text-anchor="middle" fill="#6d685f">P/E 30.7 → 27.6</text></g><g><rect x="420" y="260" width="90" height="16.25" fill="#1b1a17" fill-opacity="0.8"></rect><text x="465" y="294.25" text-anchor="middle" font-weight="600" fill="#1b1a17">−2.5%</text><text x="465" y="310" text-anchor="middle" fill="#6d685f">Price</text></g><rect x="580" y="90" width="156" height="160" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="594" y="114" font-size="11.5" fill="#1b1a17" font-weight="600">Return = earnings</text><text x="594" y="132" font-size="11.5" fill="#1b1a17" font-weight="600">+ change in P/E.</text><text x="594" y="150" font-size="11.5" fill="#6d685f" font-weight="400"></text><text x="594" y="168" font-size="11.5" fill="#6d685f" font-weight="400">The starting multiple</text><text x="594" y="186" font-size="11.5" fill="#6d685f" font-weight="400">was too high, so</text><text x="594" y="204" font-size="11.5" fill="#6d685f" font-weight="400">the de-rating ate</text><text x="594" y="222" font-size="11.5" fill="#6d685f" font-weight="400">the earnings growth.</text></svg>