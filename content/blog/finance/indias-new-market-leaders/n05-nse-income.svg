<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 360" role="img" aria-label="Weekly Nifty options earned more than every other named NSE line combined" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">One contract, weekly Nifty options, earned 37% of NSE&#x27;s Q2 income</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Selected NSE revenue lines, Q2 FY27, ₹ crore, with year-on-year growth where reported</text><g><text x="208" y="101" text-anchor="end" fill="#1b1a17">Weekly Nifty options</text><rect x="220" y="86" width="458.73" height="22" fill="#e2a623" fill-opacity="0.9"></rect><text x="686.73" y="101" font-weight="600" fill="#1b1a17">₹1,699 cr</text></g><g><text x="208" y="137" text-anchor="end" fill="#1b1a17">Equity cash market</text><rect x="220" y="122" width="127.98" height="22" fill="#4f7be0" fill-opacity="0.75"></rect><text x="355.98" y="137" font-weight="600" fill="#1b1a17">₹474 cr<tspan font-weight="400" fill="#2f9e5b">  +30%</tspan></text></g><g><text x="208" y="173" text-anchor="end" fill="#1b1a17">Data feeds</text><rect x="220" y="158" width="44.550000000000004" height="22" fill="#4f7be0" fill-opacity="0.75"></rect><text x="272.55" y="173" font-weight="600" fill="#1b1a17">₹165 cr<tspan font-weight="400" fill="#2f9e5b">  +43%</tspan></text></g><g><text x="208" y="209" text-anchor="end" fill="#1b1a17">Listing services</text><rect x="220" y="194" width="40.5" height="22" fill="#4f7be0" fill-opacity="0.75"></rect><text x="268.5" y="209" font-weight="600" fill="#1b1a17">₹150 cr<tspan font-weight="400" fill="#2f9e5b">  +70%</tspan></text></g><g><text x="208" y="245" text-anchor="end" fill="#1b1a17">Clearing</text><rect x="220" y="230" width="19.71" height="22" fill="#4f7be0" fill-opacity="0.75"></rect><text x="247.71" y="245" font-weight="600" fill="#1b1a17">₹73 cr<tspan font-weight="400" fill="#2f9e5b">  +32%</tspan></text></g><g><text x="208" y="281" text-anchor="end" fill="#1b1a17">Mutual fund platform</text><rect x="220" y="266" width="3.5100000000000002" height="22" fill="#4f7be0" fill-opacity="0.75"></rect><text x="231.51" y="281" font-weight="600" fill="#1b1a17">₹13 cr</text></g><text x="24" y="318" font-size="11.5" fill="#6d685f">Reported Q2 profit rose 23%; excluding last year&#x27;s ₹1,297 cr SEBI settlement fee and ₹1,201 cr one-off gain,</text><text x="24" y="336" font-size="11.5" fill="#6d685f">pre-tax profit grew 9%. FY26 profit fell 15% after SEBI&#x27;s earlier curbs on retail F&amp;O.</text></svg>