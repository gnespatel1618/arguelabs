<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="SBI Funds costs grew 24% against 9% revenue growth" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">SBI Funds: costs grew almost three times as fast as revenue</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Q2 FY27 vs Q2 FY26, year-on-year change, %</text><line x1="240" x2="240" y1="80" y2="222" stroke="#1b1a17"></line><g><text x="140" y="105" text-anchor="end" fill="#1b1a17">Revenue</text><rect x="240" y="87" width="108" height="26" fill="#4f7be0" fill-opacity="0.8"></rect><text x="356" y="105" font-weight="600" fill="#1b1a17">+9%</text></g><g><text x="140" y="151" text-anchor="end" fill="#1b1a17">Operating costs</text><rect x="240" y="133" width="288" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="536" y="151" font-weight="600" fill="#1b1a17">+24%</text></g><g><text x="140" y="197" text-anchor="end" fill="#1b1a17">Net profit</text><rect x="168" y="179" width="72" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="250" y="197" font-weight="600" fill="#1b1a17">−6%</text></g><text x="24" y="262" font-size="11.5" fill="#6d685f">Costs rose on cloud, AI and hiring; management says 60% of the increase will recur.</text><text x="24" y="280" font-size="11.5" fill="#6d685f">Mutual fund QAAUM ₹13.14 lakh crore, 15.0% of the industry; 27.4% of passive money.</text></svg>