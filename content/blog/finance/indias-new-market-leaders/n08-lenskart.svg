<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 360" role="img" aria-label="Lenskart grew on every line in Q2 FY27" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Lenskart: every line grew faster than 20% in Q2</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Q2 FY27, year-on-year growth, %. EBITDA margin 21.9%; 143 stores added in the quarter.</text><g><text x="188" y="97" text-anchor="end" fill="#1b1a17">Revenue</text><rect x="200" y="82" width="117" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="325" y="97" font-weight="600" fill="#1b1a17">+32.5%</text></g><g><text x="188" y="129" text-anchor="end" fill="#1b1a17">India revenue</text><rect x="200" y="114" width="127.08" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="335.08" y="129" font-weight="600" fill="#1b1a17">+35.3%</text></g><g><text x="188" y="161" text-anchor="end" fill="#1b1a17">EBITDA</text><rect x="200" y="146" width="167.76000000000002" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="375.76" y="161" font-weight="600" fill="#1b1a17">+46.6%</text></g><g><text x="188" y="193" text-anchor="end" fill="#1b1a17">Eye tests</text><rect x="200" y="178" width="145.44" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="353.44" y="193" font-weight="600" fill="#1b1a17">+40.4%</text></g><g><text x="188" y="225" text-anchor="end" fill="#1b1a17">Eyewear units sold</text><rect x="200" y="210" width="97.56" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="305.56" y="225" font-weight="600" fill="#1b1a17">+27.1%</text></g><g><text x="188" y="257" text-anchor="end" fill="#1b1a17">Same-store sales</text><rect x="200" y="242" width="74.88000000000001" height="22" fill="#4f7be0" fill-opacity="0.8"></rect><text x="282.88" y="257" font-weight="600" fill="#1b1a17">+20.8%</text></g><g><text x="188" y="289" text-anchor="end" fill="#1b1a17">Net profit</text><rect x="200" y="274" width="360" height="22" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="568" y="289" font-weight="600" fill="#1b1a17">&gt;100%<tspan font-weight="400" fill="#6d685f">  more than doubled</tspan></text></g><text x="24" y="330" font-size="11.5" fill="#6d685f">P/E 161 and EV/EBITDA 52.8, the highest on this list. International (Owndays and others) is 42% of revenue.</text></svg>