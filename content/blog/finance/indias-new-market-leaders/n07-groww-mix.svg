01" y1="150" y2="208" stroke="#1b1a17"></line><text x="603.9240000000001" y="222" text-anchor="middle" fill="#1b1a17">Loans 5.9%</text></g><g><rect x="624.9280000000001" y="96" width="109.072" height="54" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="632.9280000000001" y="128" fill="#fff" font-weight="600">15.6%</text><text x="734.0000000000001" y="178" text-anchor="end" fill="#1b1a17">Everything else</text></g><text x="24" y="262" font-size="11.5" fill="#6d685f">SEBI&#x27;s Closing Auction System (from 3 Aug 2026) cut F&amp;O revenue 14.3% in one quarter.</text><text x="24" y="280" font-size="11.5" fill="#6d685f">Groww carries 14.8% of India&#x27;s SIP inflows; its own AMC grew AUM 145% to ₹7,179 cr.</text></svg>