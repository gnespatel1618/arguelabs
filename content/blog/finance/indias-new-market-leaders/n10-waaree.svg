<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="Waaree exports from India collapsed; US-made modules earn more per watt" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Waaree: exports from India collapsed, so it is making in the US</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Left: export revenue from India, ₹ crore. Right: management&#x27;s estimate of profit per watt, US cents.</text><text x="24" y="88" font-weight="600" fill="#1b1a17">Export revenue from India</text><g><text x="24" y="134" fill="#6d685f">Q2 FY26</text><rect x="94" y="118" width="190" height="26" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="292" y="136" font-weight="600" fill="#1b1a17">₹2,143 cr</text></g><g><text x="24" y="186" fill="#6d685f">Q2 FY27</text><rect x="94" y="170" width="7.890807279514699" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="109.8908072795147" y="188" font-weight="600" fill="#1b1a17">₹89 cr</text></g><text x="24" y="240" fill="#6d685f" font-size="11.5">Exports: 7.8% of the order book, from about 24%.</text><text x="24" y="258" fill="#6d685f" font-size="11.5">3 GW+ of export orders dropped after US Section 232.</text><text x="400" y="88" font-weight="600" fill="#1b1a17">Profit per watt (management)</text><g><text x="400" y="134" fill="#6d685f">India exports</text><rect x="520" y="118" width="54" height="26" fill="#b9b3a8" fill-opacity="0.85"></rect><rect x="574" y="118" width="18" height="26" fill="#b9b3a8" fill-opacity="0.4"></rect><text x="600" y="136" font-weight="600" fill="#1b1a17">3–4¢</text></g><g><text x="400" y="186" fill="#6d685f">US-made (Texas)</text><rect x="520" y="170" width="144" height="26" fill="#2f9e5b" fill-opacity="0.85"></rect><rect x="664" y="170" width="18" height="26" fill="#2f9e5b" fill-opacity="0.4"></rect><text x="690" y="188" font-weight="600" fill="#1b1a17">8–9¢</text></g><text x="400" y="240" fill="#6d685f" font-size="11.5">US figure includes a 7-cent production incentive.</text><text x="400" y="258" fill="#6d685f" font-size="11.5">US plant: 1.6 GW live, 4.8 GW planned.</text><text x="24" y="300" fill="#6d685f" font-size="11.5">Q2 FY27 profit ₹754 cr (from ₹878 cr); operating margin 18% vs 23%. FY27 EBITDA guidance ₹7,000–7,700 cr kept.</text></svg>