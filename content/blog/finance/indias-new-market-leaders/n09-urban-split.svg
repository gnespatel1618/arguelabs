<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 320" role="img" aria-label="InstaHelp lost 174 crore while the rest made about 30 crore" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Urban Company: the old business funds the new bet</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Q2 FY27 adjusted EBITDA, ₹ crore (approximate split)</text><line x1="540" x2="540" y1="84" y2="210" stroke="#1b1a17"></line><g><text x="24" y="115" fill="#1b1a17">Core India, international and Native</text><rect x="540" y="94" width="39" height="32" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="587" y="115" font-weight="600" fill="#1b1a17">+₹30 cr</text></g><g><text x="24" y="175" fill="#1b1a17">InstaHelp (15-minute house help)</text><rect x="313.79999999999995" y="154" width="226.20000000000002" height="32" fill="#d8463d" fill-opacity="0.8"></rect><text x="323.79999999999995" y="175" font-weight="600" fill="#fff">−₹174 cr</text></g><text x="24" y="246" font-size="11.5" fill="#6d685f">InstaHelp: 6.23 mn orders in Q2; loss per order down to ₹279. Net order value ₹114 vs ~₹300 needed to break even.</text><text x="24" y="266" font-size="11.5" fill="#6d685f">Group net loss ₹182.5 cr (from ₹59 cr). Cash and treasury ₹1,901 cr; board seeks approval to raise up to ₹2,500 cr</text><text x="24" y="284" font-size="11.5" fill="#6d685f">(about 9.3% dilution at ₹158).</text></svg>