<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="India&#x27;s new market leaders at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">India&#x27;s new market leaders at a glance, 6 Nov 2026</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="82" font-size="13" fill="#6d685f">New #1s listed since Oct 2024</text><text x="40" y="112" font-size="22" font-weight="600" fill="#1b1a17">8</text><text x="40" y="136" font-size="11.5" fill="#6d685f">Worth ₹23.4 lakh crore together</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="280" y="82" font-size="13" fill="#6d685f">Growth Lenskart&#x27;s price needs</text><text x="280" y="112" font-size="22" font-weight="600" fill="#d8463d">34.9% a yr</text><text x="280" y="136" font-size="11.5" fill="#6d685f">Profit CAGR for 10 years, P/E 161</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="520" y="82" font-size="13" fill="#6d685f">Growth Waaree&#x27;s price needs</text><text x="520" y="112" font-size="22" font-weight="600" fill="#2f9e5b">8.4% a yr</text><text x="520" y="136" font-size="11.5" fill="#6d685f">P/E 18; delivered 99% a yr (3-yr)</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.6"></rect><text x="40" y="194" font-size="13" fill="#6d685f">SBI Funds vs its issue price</text><text x="40" y="224" font-size="22" font-weight="600" fill="#4f7be0">−12.9%</text><text x="40" y="248" font-size="11.5" fill="#6d685f">#1 AMC, 43% ROE, P/E 33.7</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#e2a623" stroke-width="1.6"></rect><text x="280" y="194" font-size="11.5" fill="#6d685f">NSE&#x27;s Q2 income from one contract</text><text x="280" y="224" font-size="22" font-weight="600" fill="#1b1a17">37%</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Weekly Nifty options</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.6"></rect><text x="520" y="194" font-size="11.5" fill="#6d685f">Operating margin, rails vs makers</text><text x="520" y="224" font-size="22" font-weight="600" fill="#4f7be0">54–82%</text><text x="520" y="248" font-size="11.5" fill="#6d685f">vs 9.5–18% for LG and Waaree</text></g></svg>