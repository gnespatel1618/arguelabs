<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 250" role="img" aria-label="Who bought GQG ITC stake" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">ITC: one foreign seller, five big buyers</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">GQG Partners sold 2.9% of ITC at ₹257.35 on 8 Oct 2026 for ₹9,395 crore. Who took it, ₹ crore:</text><g><rect x="24" y="80" width="259.3824374667376" height="50" fill="#4f7be0" fill-opacity="0.8"></rect><text x="32" y="100" font-weight="600" fill="#1b1a17">Fidelity</text><text x="32" y="120" fill="#1b1a17">3,449</text></g><g><rect x="285.3824374667376" y="80" width="181.32389568919638" height="50" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="293.3824374667376" y="100" font-weight="600" fill="#1b1a17">ICICI Pru MF</text><text x="293.3824374667376" y="120" fill="#1b1a17">2,419</text></g><g><rect x="468.70633315593403" y="80" width="71.35987227248536" height="50" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="476.70633315593403" y="100" font-weight="600" fill="#1b1a17">SBI MF</text><text x="476.70633315593403" y="120" fill="#1b1a17">968</text></g><g><rect x="542.0662054284194" y="80" width="50.74635444385311" height="50" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="550.0662054284194" y="100" font-weight="600" fill="#1b1a17">Nippon MF</text><text x="550.0662054284194" y="120" fill="#1b1a17">696</text></g><g><rect x="594.8125598722725" y="80" width="139.1874401277275" height="50" fill="#b9b3a8" fill-opacity="1"></rect><text x="602.8125598722725" y="100" font-weight="600" fill="#1b1a17">Others*</text><text x="602.8125598722725" y="120" fill="#1b1a17">1,863</text></g><rect x="24" y="146" width="12" height="12" fill="#4f7be0"></rect><text x="42" y="156" font-size="11.5" fill="#6d685f">Long-only foreign fund</text><rect x="200" y="146" width="12" height="12" fill="#2f9e5b"></rect><text x="218" y="156" font-size="11.5" fill="#6d685f">Indian mutual funds</text><text x="24" y="190" font-size="11.5" fill="#1b1a17">The stock is still around ₹258, within 2% of its 52-week low, at about 16x earnings.</text><text x="24" y="226" font-size="11" fill="#6d685f">*Edelweiss MF, Mirae MF, ICICI Pru Life and others; this is the balance of the deal after the four named buyers.</text></svg>