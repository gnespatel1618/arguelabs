<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Indian mutual funds took big shares of every large fundraise" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Indian funds are now the capital market</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Share of each issue taken by the named Indian mutual funds, %, Sep–Oct 2026; at least, as smaller MF buyers are not counted</text><g><text x="218" y="100" text-anchor="end" font-weight="600" fill="#1b1a17">Cemindia Projects QIP</text><text x="218" y="115" text-anchor="end" font-size="11" fill="#6d685f">Motilal Oswal MF alone</text><rect x="230" y="84" width="340.40000000000003" height="24" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="578.4000000000001" y="101" font-weight="600" fill="#1b1a17">46%</text></g><g><text x="218" y="146" text-anchor="end" font-weight="600" fill="#1b1a17">TD Power Systems QIP</text><text x="218" y="161" text-anchor="end" font-size="11" fill="#6d685f">Axis, Canara Robeco, ICICI Pru MFs</text><rect x="230" y="130" width="296" height="24" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="534" y="147" font-weight="600" fill="#1b1a17">40%</text></g><g><text x="218" y="192" text-anchor="end" font-weight="600" fill="#1b1a17">Jio Platforms anchor book</text><text x="218" y="207" text-anchor="end" font-size="11" fill="#6d685f">25 MF houses, ₹2,785 cr</text><rect x="230" y="176" width="251.60000000000002" height="24" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="489.6" y="193" font-weight="600" fill="#1b1a17">34%</text></g><g><text x="218" y="238" text-anchor="end" font-weight="600" fill="#1b1a17">Bharat Forge QIP</text><text x="218" y="253" text-anchor="end" font-size="11" fill="#6d685f">ICICI Pru, Axis, Mirae MFs</text><rect x="230" y="222" width="155.4" height="24" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="393.4" y="239" font-weight="600" fill="#1b1a17">21%</text></g><text x="24" y="274" font-size="11" fill="#6d685f">Foreign money still shows up through sovereign funds (GIC, ADIA, Norges), which buy on long horizons.</text><text x="24" y="290" font-size="11" fill="#6d685f">Over half of NSE&#x27;s IPO anchor book also went to Indian institutions.</text></svg>