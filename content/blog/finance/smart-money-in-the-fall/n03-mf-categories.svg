<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 260" role="img" aria-label="New fund money went to small and mid caps, not large caps" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Savers bought the dip in small and mid caps, not large caps</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Net inflows into equity fund categories, September 2026, ₹ crore</text><g><text x="168" y="96" text-anchor="end" fill="#1b1a17">Small-cap funds</text><rect x="180" y="80" width="397.716" height="22" fill="#4f7be0" fill-opacity="0.85"></rect><text x="585.716" y="96" font-weight="600" fill="#1b1a17">9,039</text></g><g><text x="168" y="136" text-anchor="end" fill="#1b1a17">Mid-cap funds</text><rect x="180" y="120" width="344.74" height="22" fill="#4f7be0" fill-opacity="0.85"></rect><text x="532.74" y="136" font-weight="600" fill="#1b1a17">7,835</text></g><g><text x="168" y="176" text-anchor="end" fill="#1b1a17">Flexi-cap funds</text><rect x="180" y="160" width="294.88800000000003" height="22" fill="#4f7be0" fill-opacity="0.85"></rect><text x="482.88800000000003" y="176" font-weight="600" fill="#1b1a17">6,702</text></g><g><text x="168" y="216" text-anchor="end" fill="#1b1a17">Large-cap funds</text><rect x="180" y="200" width="37.796" height="22" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="225.796" y="216" font-weight="600" fill="#1b1a17">859</text></g><text x="24" y="248" font-size="11" fill="#6d685f">Total equity fund inflows were ₹38,307 cr; the SIP stoppage ratio fell for a fifth straight month, to 78.5%.</text></svg>