<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="Smart money in the fall at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Smart money in the fall, at a glance (26 Oct 2026)</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.6"></rect><text x="40" y="82" fill="#6d685f">FPI net selling, 2026 to date</text><text x="40" y="112" font-size="22" font-weight="600" fill="#d8463d">−₹3.08 lakh cr</text><text x="40" y="136" font-size="11.5" fill="#6d685f">A record; −₹48,056 cr in Oct so far</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="280" y="82" fill="#6d685f">Domestic institutions, Sep</text><text x="280" y="112" font-size="22" font-weight="600" fill="#2f9e5b">+₹64,759 cr</text><text x="280" y="136" font-size="11.5" fill="#6d685f">38th straight month of buying</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.6"></rect><text x="520" y="82" fill="#6d685f">SIP inflows, Sep</text><text x="520" y="112" font-size="22" font-weight="600" fill="#2f9e5b">₹32,490 cr</text><text x="520" y="136" font-size="11.5" fill="#6d685f">A record; stoppages falling</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="194" fill="#6d685f">FPI ownership of NSE stocks</text><text x="40" y="224" font-size="22" font-weight="600" fill="#1b1a17">15.1%</text><text x="40" y="248" font-size="11.5" fill="#6d685f">Lowest in 69 quarters (Jun 2026)</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.6"></rect><text x="280" y="194" fill="#6d685f">IT weight in MF portfolios</text><text x="280" y="224" font-size="22" font-weight="600" fill="#4f7be0">5.3%</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Record low; FPIs bought IT in Oct</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="194" fill="#6d685f">Largest block deal, ITC</text><text x="520" y="224" font-size="22" font-weight="600" fill="#1b1a17">₹9,395 cr</text><text x="520" y="248" font-size="11.5" fill="#6d685f">GQG out; Fidelity + 4 Indian MFs in</text></g></svg>