<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 240" role="img" aria-label="Three commodity companies made 30% of the profit increase on 6% of sales" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Three commodity companies made 30% of the profit jump</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Adani Power, Hindustan Zinc and JSW Steel, among the first 337 companies to report Q2 FY27</text><g><text x="218" y="102" text-anchor="end" font-weight="600" fill="#1b1a17">Share of sales</text><rect x="230" y="84" width="70.28571428571429" height="28" fill="#b9b3a8"></rect><text x="308.2857142857143" y="103" font-weight="600" fill="#1b1a17">~6%</text></g><g><text x="218" y="152" text-anchor="end" font-weight="600" fill="#1b1a17">Share of profit increase</text><rect x="230" y="134" width="351.4285714285714" height="28" fill="#e2a623"></rect><text x="589.4285714285713" y="153" font-weight="600" fill="#1b1a17">~30%</text></g><text x="24" y="206" font-size="11.5" fill="#1b1a17">Headline profit growth is +25.5% (sales +22.3%), the best in 12 quarters, but it is narrow.</text><text x="24" y="224" font-size="11" fill="#6d685f">Brokers have barely moved Nifty EPS: Motilal Oswal is at ₹1,233 for FY27 and has cut FY28 by 1.3%.</text></svg>