<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 280" role="img" aria-label="Bank profits grew while margins shrank" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Bank profits are growing while margins shrink</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Q2 FY27: profit growth, % year on year (left) and change in net interest margin, basis points (right)</text><text x="260" y="80" text-anchor="middle" font-weight="600" fill="#6d685f">Profit growth</text><text x="560" y="80" text-anchor="middle" font-weight="600" fill="#6d685f">NIM change</text><g><text x="150" y="112" text-anchor="end" font-weight="600" fill="#1b1a17">Axis Bank</text><rect x="170" y="96" width="171" height="22" fill="#2f9e5b" fill-opacity="0.75"></rect><text x="347" y="112" font-weight="600" fill="#1b1a17">+38%</text><rect x="560" y="96" width="40" height="22" fill="#d8463d" fill-opacity="0.75"></rect><text x="554" y="112" text-anchor="end" font-weight="600" fill="#1b1a17">-10 bp</text></g><g><text x="150" y="152" text-anchor="end" font-weight="600" fill="#1b1a17">Kotak Bank</text><rect x="170" y="136" width="130.5" height="22" fill="#2f9e5b" fill-opacity="0.75"></rect><text x="306.5" y="152" font-weight="600" fill="#1b1a17">+29%</text><rect x="512" y="136" width="88" height="22" fill="#d8463d" fill-opacity="0.75"></rect><text x="506" y="152" text-anchor="end" font-weight="600" fill="#1b1a17">-22 bp</text></g><g><text x="150" y="192" text-anchor="end" font-weight="600" fill="#1b1a17">ICICI Bank</text><rect x="170" y="176" width="90" height="22" fill="#2f9e5b" fill-opacity="0.75"></rect><text x="266" y="192" font-weight="600" fill="#1b1a17">+20%</text><rect x="528" y="176" width="72" height="22" fill="#d8463d" fill-opacity="0.75"></rect><text x="522" y="192" text-anchor="end" font-weight="600" fill="#1b1a17">-18 bp</text></g><g><text x="150" y="232" text-anchor="end" font-weight="600" fill="#1b1a17">HDFC Bank</text><rect x="170" y="216" width="21.150000000000002" height="22" fill="#2f9e5b" fill-opacity="0.75"></rect><text x="197.15" y="232" font-weight="600" fill="#1b1a17">+4.7%</text><text x="592" y="232" text-anchor="end" font-size="11.5" fill="#6d685f">NIM 3.16%; CASA down to 31.6%</text></g><line x1="600" x2="600" y1="90" y2="252" stroke="#1b1a17"></line><text x="24" y="270" font-size="11" fill="#6d685f">Deposits got costlier, and the RBI&#x27;s 7 October hike to 5.50% adds to that. Funds are buying the banks on valuation, not momentum.</text></svg>