<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 270" role="img" aria-label="Indian institutions own more of the market than foreigners, the widest gap since 2001" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Indian institutions now own more of the market than foreigners</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Share of NSE-listed companies&#x27; value, June 2026</text><g><text x="218" y="102" text-anchor="end" font-weight="600" fill="#1b1a17">Domestic institutions</text><rect x="230" y="84" width="363.4090909090909" height="26" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="601.4090909090909" y="102" font-weight="600" fill="#1b1a17">19.5%</text></g><g><text x="218" y="148" text-anchor="end" font-weight="600" fill="#1b1a17">FPIs</text><rect x="230" y="130" width="281.40909090909093" height="26" fill="#d8463d" fill-opacity="0.8"></rect><text x="519.409090909091" y="148" font-weight="600" fill="#1b1a17">15.1%</text></g><g><text x="218" y="194" text-anchor="end" font-weight="600" fill="#1b1a17">Mutual funds alone</text><rect x="230" y="176" width="216.18181818181816" height="26" fill="#4f7be0" fill-opacity="0.8"></rect><text x="454.18181818181813" y="194" font-weight="600" fill="#1b1a17">11.6%</text></g><rect x="24" y="222" width="712" height="34" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="38" y="244" fill="#1b1a17">FPI ownership is the lowest in 69 quarters; MF ownership is a record. The gap is the widest since 2001.</text></svg>