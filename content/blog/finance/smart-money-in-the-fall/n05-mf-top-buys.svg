<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Mutual funds biggest September buys were Reliance and BSE" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Funds&#x27; biggest September buys were Reliance and BSE</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Net mutual-fund buying, September 2026, ₹ crore (Prime Database, Motilal Oswal)</text><g><text x="168" y="101" text-anchor="end" font-weight="600" fill="#1b1a17">Reliance Industries</text><rect x="180" y="84" width="313.84615384615387" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="501.84615384615387" y="101" font-weight="600" fill="#1b1a17">~6,000</text><text x="575.8461538461538" y="101" font-size="11" fill="#6d685f">ahead of the Jio Platforms IPO</text></g><g><text x="168" y="145" text-anchor="end" font-weight="600" fill="#1b1a17">BSE</text><rect x="180" y="128" width="287.6923076923077" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="475.6923076923077" y="145" font-weight="600" fill="#1b1a17">over 5,500</text><text x="549.6923076923076" y="145" font-size="11" fill="#6d685f">Nifty 50 entry; 30 Sep block</text></g><g><text x="168" y="189" text-anchor="end" font-weight="600" fill="#1b1a17">NSE (pre-IPO)</text><rect x="180" y="172" width="178.26461538461535" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="366.26461538461535" y="189" font-weight="600" fill="#1b1a17">~3,408</text><text x="440.26461538461535" y="189" font-size="11" fill="#6d685f">before its IPO</text></g><g><text x="168" y="233" text-anchor="end" font-weight="600" fill="#1b1a17">PB Fintech</text><rect x="180" y="216" width="91.38153846153845" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="279.38153846153847" y="233" font-weight="600" fill="#1b1a17">~1,747</text><text x="353.38153846153847" y="233" font-size="11" fill="#6d685f">Policybazaar</text></g><text x="24" y="274" font-size="11.5" fill="#1b1a17">Also in the top five: HDFC Bank, ICICI Bank and Swiggy. Biggest sells: Wipro, L&amp;T and TCS.</text><text x="24" y="290" font-size="11" fill="#6d685f">Reliance and NSE are IPO positioning, and BSE is index-inclusion buying; the discretionary signal is in the banks and Swiggy.</text></svg>