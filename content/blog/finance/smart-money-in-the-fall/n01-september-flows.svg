<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="In September Indian money outbought foreign selling almost two to one" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">In September, Indian money out-bought foreign selling almost 2 to 1</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Net equity flows, September 2026, ₹ crore</text><line x1="450" x2="450" y1="70" y2="262" stroke="#1b1a17"></line><g><text x="24" y="94" font-weight="600" fill="#1b1a17">FPIs, net</text><text x="24" y="110" font-size="11" fill="#6d685f">sold ₹45,537 cr in the market, put ₹9,676 cr into IPOs</text><rect x="321.925" y="80" width="128.075" height="24" fill="#d8463d" fill-opacity="0.8"></rect><text x="315.925" y="97" text-anchor="end" font-weight="600" fill="#1b1a17">−35,861</text></g><g><text x="24" y="142" font-weight="600" fill="#1b1a17">Domestic institutions, net</text><text x="24" y="158" font-size="11" fill="#6d685f">MFs, insurers, banks, pension funds</text><rect x="450" y="128" width="231.28214285714284" height="24" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="687.2821428571428" y="145" text-anchor="start" font-weight="600" fill="#1b1a17">+64,759</text></g><g><text x="24" y="190" font-weight="600" fill="#1b1a17">Equity MF inflows</text><text x="24" y="206" font-size="11" fill="#6d685f">up 31% on August</text><rect x="450" y="176" width="136.81071428571428" height="24" fill="#4f7be0" fill-opacity="0.8"></rect><text x="592.8107142857143" y="193" text-anchor="start" font-weight="600" fill="#1b1a17">+38,307</text></g><g><text x="24" y="238" font-weight="600" fill="#1b1a17">SIP inflows</text><text x="24" y="254" font-size="11" fill="#6d685f">a record</text><rect x="450" y="224" width="116.03571428571428" height="24" fill="#4f7be0" fill-opacity="0.8"></rect><text x="572.0357142857142" y="241" text-anchor="start" font-weight="600" fill="#1b1a17">+32,490</text></g><text x="24" y="290" font-size="11" fill="#6d685f">MF and SIP inflows are part of the domestic institutions&#x27; buying, not on top of it.</text></svg>