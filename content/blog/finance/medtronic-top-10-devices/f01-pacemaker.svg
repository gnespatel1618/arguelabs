<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 310" role="img" aria-label="Fig 1. A pacemaker is a sealed battery and chip that sends pulses down a wire" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1b1a17">Fig 1. A pacemaker is a sealed battery and chip that sends pulses down a wire</text><g><rect x="120" y="70" width="100" height="24" rx="6" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><text x="170" y="86" text-anchor="middle" font-size="11.5" fill="#1b1a17">Header</text><rect x="40" y="94" width="220" height="150" rx="28" fill="none" stroke="#1b1a17" stroke-width="2"></rect><rect x="58" y="112" width="88" height="114" rx="8" fill="#f6ece9" stroke="#1b1a17" stroke-width="1"></rect><text x="102" y="166" text-anchor="middle" font-size="11.5" fill="#1b1a17">Lithium</text><text x="102" y="182" text-anchor="middle" font-size="11.5" fill="#1b1a17">battery</text><rect x="156" y="112" width="86" height="114" rx="8" fill="#4f7be0" fill-opacity="0.12" stroke="#4f7be0" stroke-width="1.5"></rect><text x="199" y="166" text-anchor="middle" font-size="11.5" fill="#1b1a17">Chip and</text><text x="199" y="182" text-anchor="middle" font-size="11.5" fill="#1b1a17">capacitors</text><text x="150" y="270" text-anchor="middle" font-size="11.5" fill="#6d685f">Titanium case, laser-welded shut</text><text x="150" y="286" text-anchor="middle" font-size="11.5" fill="#6d685f">so body fluid can&#x27;t get in</text></g><g><path d="M200 70 C230 44 330 44 380 94 S452 160 462 212" fill="none" stroke="#1b1a17" stroke-width="2.5"></path><text x="250" y="44" font-size="11.5" fill="#6d685f">Lead: coiled wire in silicone</text></g><g><path d="M420 130 C420 100 460 95 470 120 C480 95 520 100 520 130 C520 180 470 220 470 244 C470 220 420 180 420 130 Z" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></path><circle cx="462" cy="214" r="5" fill="#4f7be0"></circle><text x="470" y="272" text-anchor="middle" font-size="11.5" fill="#6d685f">Tip senses each beat and</text><text x="470" y="288" text-anchor="middle" font-size="11.5" fill="#6d685f">fires a pulse if it pauses</text></g><line x1="560" y1="70" x2="560" y2="290" stroke="#e4ded2"></line><g><text x="648" y="120" text-anchor="middle" font-weight="600" fill="#1b1a17">Micra (leadless)</text><rect x="600" y="160" width="90" height="30" rx="15" fill="#4f7be0" fill-opacity="0.12" stroke="#4f7be0" stroke-width="1.5"></rect><path d="M690 168 l14 -10 M690 182 l14 10" stroke="#4f7be0" stroke-width="1.5" fill="none"></path><text x="648" y="224" text-anchor="middle" font-size="11.5" fill="#6d685f">Battery, chip and electrode in</text><text x="648" y="240" text-anchor="middle" font-size="11.5" fill="#6d685f">one capsule, hooked into the</text><text x="648" y="256" text-anchor="middle" font-size="11.5" fill="#6d685f">heart wall: no wire</text></g></svg>