<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="Fig 4. A stent is opened by a balloon and stays to hold the artery open" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1b1a17">Fig 4. A stent is opened by a balloon and stays to hold the artery open</text><g><g><line x1="190" y1="76" x2="560" y2="76" stroke="#1b1a17" stroke-width="2"></line><line x1="190" y1="124" x2="560" y2="124" stroke="#1b1a17" stroke-width="2"></line></g><g><path d="M300 76 Q380 118 460 76 Z" fill="#b9b3a8" stroke="#1b1a17"></path><path d="M300 124 Q380 82 460 124 Z" fill="#b9b3a8" stroke="#1b1a17"></path></g><line x1="190" y1="100" x2="560" y2="100" stroke="#1b1a17" stroke-width="1"></line><text x="24" y="104" font-weight="600" fill="#1b1a17">1. Blocked artery</text><text x="572" y="96" font-size="11.5" fill="#6d685f">Plaque narrows the artery;</text><text x="572" y="112" font-size="11.5" fill="#6d685f">a thin wire crosses it</text></g><g><g><line x1="190" y1="172" x2="560" y2="172" stroke="#1b1a17" stroke-width="2"></line><line x1="190" y1="220" x2="560" y2="220" stroke="#1b1a17" stroke-width="2"></line></g><g><path d="M300 172 Q380 184 460 172 Z" fill="#b9b3a8" stroke="#1b1a17"></path><path d="M300 220 Q380 208 460 220 Z" fill="#b9b3a8" stroke="#1b1a17"></path></g><line x1="190" y1="196" x2="560" y2="196" stroke="#1b1a17" stroke-width="1"></line><ellipse cx="380" cy="196" rx="72" ry="12" fill="#4f7be0" fill-opacity="0.25" stroke="#4f7be0"></ellipse><path d="M312 184 L320 180 L328 188 L336 180 L344 188 L352 180 L360 188 L368 180 L376 188 L384 180 L392 188 L400 180 L408 188 L416 180 L424 188 L432 180 L440 188 L448 180" fill="none" stroke="#4f7be0" stroke-width="1.5"></path><path d="M312 208 L320 204 L328 212 L336 204 L344 212 L352 204 L360 212 L368 204 L376 212 L384 204 L392 212 L400 204 L408 212 L416 204 L424 212 L432 204 L440 212 L448 204" fill="none" stroke="#4f7be0" stroke-width="1.5"></path><text x="24" y="200" font-weight="600" fill="#1b1a17">2. Balloon inflates</text><text x="572" y="192" font-size="11.5" fill="#6d685f">Balloon presses plaque</text><text x="572" y="208" font-size="11.5" fill="#6d685f">into the wall; stent opens</text></g><g><g><line x1="190" y1="268" x2="560" y2="268" stroke="#1b1a17" stroke-width="2"></line><line x1="190" y1="316" x2="560" y2="316" stroke="#1b1a17" stroke-width="2"></line></g><g><path d="M300 268 Q380 280 460 268 Z" fill="#b9b3a8" stroke="#1b1a17"></path><path d="M300 316 Q380 304 460 316 Z" fill="#b9b3a8" stroke="#1b1a17"></path></g><path d="M312 280 L320 276 L328 284 L336 276 L344 284 L352 276 L360 284 L368 276 L376 284 L384 276 L392 284 L400 276 L408 284 L416 276 L424 284 L432 276 L440 284 L448 276" fill="none" stroke="#4f7be0" stroke-width="1.5"></path><path d="M312 304 L320 300 L328 308 L336 300 L344 308 L352 300 L360 308 L368 300 L376 308 L384 300 L392 308 L400 300 L408 308 L416 300 L424 308 L432 300 L440 308 L448 300" fill="none" stroke="#4f7be0" stroke-width="1.5"></path><text x="24" y="296" font-weight="600" fill="#1b1a17">3. Stent stays</text><text x="572" y="288" font-size="11.5" fill="#6d685f">Balloon removed; the mesh</text><text x="572" y="304" font-size="11.5" fill="#6d685f">stays and releases a drug</text></g></svg>