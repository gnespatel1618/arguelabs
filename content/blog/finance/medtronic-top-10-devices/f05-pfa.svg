130" r="16" fill="none" stroke="#1b1a17" stroke-width="1.5"></circle><circle cx="640" cy="210" r="16" fill="none" stroke="#1b1a17" stroke-width="1.5"></circle></g><g fill="none" stroke="#4f7be0" stroke-width="2.5" stroke-dasharray="4 3"><circle cx="480" cy="130" r="26"></circle><circle cx="480" cy="210" r="26"></circle><circle cx="640" cy="130" r="26"></circle><circle cx="640" cy="210" r="26"></circle></g><path d="M640 156 C630 210 560 240 520 278" fill="none" stroke="#1b1a17" stroke-width="3"></path><circle cx="666" cy="130" r="3" fill="#1b1a17"></circle><circle cx="659.9171555210934" cy="146.71247785185002" r="3" fill="#1b1a17"></circle><circle cx="644.5148526193402" cy="155.6050015783174" r="3" fill="#1b1a17"></circle><circle cx="627" cy="152.5166604983954" r="3" fill="#1b1a17"></circle><circle cx="615.5679918595664" cy="138.8925237264674" r="3" fill="#1b1a17"></circle><circle cx="615.5679918595664" cy="121.10747627353261" r="3" fill="#1b1a17"></circle><circle cx="627" cy="107.4833395016046" r="3" fill="#1b1a17"></circle><circle cx="644.5148526193402" cy="104.39499842168259" r="3" fill="#1b1a17"></circle><circle cx="659.9171555210934" cy="113.28752214814998" r="3" fill="#1b1a17"></circle><text x="560" y="58" text-anchor="middle" font-weight="600" fill="#1b1a17">After: rings block them</text><text x="604" y="96" text-anchor="middle" font-size="11" fill="#6d685f">9-electrode loop</text><text x="560" y="292" text-anchor="middle" font-size="11.5" fill="#6d685f">Pulses kill a ring of tissue around</text><text x="560" y="308" text-anchor="middle" font-size="11.5" fill="#6d685f">each vein opening; signals can&#x27;t cross</text></g></svg>