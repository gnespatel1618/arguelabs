<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="Fig 7. Neurostimulators send gentle pulses that quiet faulty nerve signals" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1b1a17">Fig 7. Neurostimulators send gentle pulses that quiet faulty nerve signals</text><g><text x="200" y="58" text-anchor="middle" font-weight="600" fill="#1b1a17">Deep brain stimulation (DBS)</text><path d="M80 290 Q86 196 160 186 Q234 196 240 290 Z" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></path><rect x="150" y="166" width="20" height="22" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><circle cx="160" cy="120" r="52" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></circle><ellipse cx="160" cy="112" rx="36" ry="26" fill="none" stroke="#6d685f" stroke-width="1"></ellipse><line x1="166" y1="68" x2="166" y2="120" stroke="#4f7be0" stroke-width="2.5"></line><circle cx="166" cy="122" r="5" fill="#4f7be0"></circle><path d="M166 68 C215 60 226 120 206 160 S200 200 202 214" fill="none" stroke="#1b1a17" stroke-width="1.5"></path><rect x="182" y="214" width="40" height="26" rx="8" fill="#4f7be0" fill-opacity="0.2" stroke="#4f7be0" stroke-width="1.5"></rect><line x1="244" y1="96" x2="172" y2="118" stroke="#1b1a17" stroke-width="1"></line><line x1="244" y1="150" x2="214" y2="150" stroke="#1b1a17" stroke-width="1"></line><line x1="244" y1="232" x2="224" y2="228" stroke="#1b1a17" stroke-width="1"></line><text x="250" y="96" font-size="11.5" fill="#1b1a17">Electrode in a deep</text><text x="250" y="112" font-size="11.5" fill="#1b1a17">brain target</text><text x="250" y="150" font-size="11.5" fill="#1b1a17">Extension wire</text><text x="250" y="166" font-size="11.5" fill="#1b1a17">under the skin</text><text x="250" y="232" font-size="11.5" fill="#1b1a17">Battery under</text><text x="250" y="248" font-size="11.5" fill="#1b1a17">the collarbone</text><text x="200" y="306" text-anchor="middle" font-size="11.5" fill="#6d685f">Pulses calm the faulty brain circuit</text><text x="200" y="322" text-anchor="middle" font-size="11.5" fill="#6d685f">behind Parkinson&#x27;s tremor</text></g><line x1="410" y1="70" x2="410" y2="300" stroke="#e4ded2"></line><g><text x="580" y="58" text-anchor="middle" font-weight="600" fill="#1b1a17">Spinal cord stimulation</text><rect x="560" y="80" width="40" height="190" rx="18" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><line x1="616" y1="106" x2="616" y2="204" stroke="#1b1a17" stroke-width="3"></line><rect x="611" y="118" width="10" height="6" fill="#4f7be0"></rect><rect x="611" y="138" width="10" height="6" fill="#4f7be0"></rect><rect x="611" y="158" width="10" height="6" fill="#4f7be0"></rect><rect x="611" y="178" width="10" height="6" fill="#4f7be0"></rect><path d="M470 284 L560 252 M580 252 V212" fill="none" stroke="#d8463d" stroke-width="2"></path><path d="M572 196 l16 16 M588 196 l-16 16" stroke="#d8463d" stroke-width="2.5"></path><text x="552" y="96" text-anchor="end" font-size="11.5" fill="#1b1a17">Spinal cord</text><text x="632" y="124" font-size="11.5" fill="#1b1a17">Stimulator lead</text><text x="632" y="140" font-size="11.5" fill="#1b1a17">on the cord</text><text x="516" y="262" text-anchor="end" font-size="11.5" fill="#1b1a17">Pain signal</text><text x="600" y="230" font-size="11.5" fill="#1b1a17">Blocked here</text><text x="580" y="306" text-anchor="middle" font-size="11.5" fill="#6d685f">Pulses on the cord mask pain</text><text x="580" y="322" text-anchor="middle" font-size="11.5" fill="#6d685f">signals on their way to the brain</text></g></svg>