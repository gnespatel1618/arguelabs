<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 400" role="img" aria-label="Five heart devices work at five different spots in one heart" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1b1a17">Five heart devices work at five different spots in one heart</text><text x="24" y="50" font-size="11.5" fill="#6d685f">Schematic front view, not to scale. The patient&#x27;s right side is on the left.</text><g><rect x="80" y="110" width="120" height="90" rx="14" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><rect x="220" y="110" width="120" height="90" rx="14" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><rect x="80" y="216" width="120" height="140" rx="14" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><rect x="220" y="216" width="120" height="140" rx="14" fill="#f6ece9" stroke="#1b1a17" stroke-width="1.25"></rect><text x="150" y="160" text-anchor="middle" font-size="11.5" fill="#6d685f">Right atrium</text><text x="280" y="170" text-anchor="middle" font-size="11.5" fill="#6d685f">Left atrium</text><text x="150" y="250" text-anchor="middle" font-size="11.5" fill="#6d685f">Right ventricle</text><text x="270" y="240" text-anchor="middle" font-size="11.5" fill="#6d685f">Left ventricle</text></g><g fill="none"><path d="M340 252 H380 V104 Q380 80 404 80 H436" stroke="#1b1a17" stroke-opacity="0.35" stroke-width="12"></path><text x="392" y="150" font-size="11.5" fill="#6d685f">Aorta</text><line x1="250" y1="70" x2="250" y2="110" stroke="#1b1a17" stroke-opacity="0.35" stroke-width="6"></line><line x1="310" y1="70" x2="310" y2="110" stroke="#1b1a17" stroke-opacity="0.35" stroke-width="6"></line><text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#6d685f">Lung veins</text><path d="M376 262 C330 282 304 320 292 376" stroke="#1b1a17" stroke-width="2"></path></g><g><path d="M96 68 V340" stroke="#1b1a17" stroke-width="2" fill="none"></path><circle cx="96" cy="344" r="4" fill="#1b1a17"></circle><rect x="140" y="320" width="30" height="12" rx="6" fill="#4f7be0" fill-opacity="0.5" stroke="#4f7be0"></rect><line x1="352" y1="243" x2="352" y2="261" stroke="#4f7be0" stroke-width="4"></line><circle cx="250" cy="112" r="5" fill="#4f7be0"></circle><circle cx="310" cy="112" r="5" fill="#4f7be0"></circle><rect x="309" y="300.5" width="24" height="9" rx="2" fill="#4f7be0" fill-opacity="0.4" stroke="#4f7be0" transform="rotate(126 321 305)"></rect></g><g><circle cx="122" cy="84" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="122" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">1</text></g><g><circle cx="155" cy="296" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="155" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">2</text></g><g><circle cx="358" cy="226" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="358" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">3</text></g><g><circle cx="280" cy="88" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="280" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">4</text></g><g><circle cx="262" cy="312" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="262" y="316" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">5</text></g><g><g><circle cx="470" cy="88" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="470" y="92" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">1</text></g><text x="490" y="92" font-weight="600" fill="#1b1a17">Pacemaker or ICD lead</text><text x="490" y="108" font-size="11.5" fill="#6d685f">Through a vein into the right</text><text x="490" y="124" font-size="11.5" fill="#6d685f">ventricle; senses, paces or shocks</text></g><g><g><circle cx="470" cy="148" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="470" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">2</text></g><text x="490" y="152" font-weight="600" fill="#1b1a17">Micra leadless pacemaker</text><text x="490" y="168" font-size="11.5" fill="#6d685f">Pill-sized capsule hooked into the</text><text x="490" y="184" font-size="11.5" fill="#6d685f">right ventricle wall, no wire</text></g><g><g><circle cx="470" cy="208" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="470" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">3</text></g><text x="490" y="212" font-weight="600" fill="#1b1a17">TAVR valve (Evolut)</text><text x="490" y="228" font-size="11.5" fill="#6d685f">Opens inside the stiff aortic valve,</text><text x="490" y="244" font-size="11.5" fill="#6d685f">the heart&#x27;s exit door</text></g><g><g><circle cx="470" cy="268" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="470" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">4</text></g><text x="490" y="272" font-weight="600" fill="#1b1a17">Pulsed-field ablation (AFib)</text><text x="490" y="288" font-size="11.5" fill="#6d685f">Pulses where the lung veins enter</text><text x="490" y="304" font-size="11.5" fill="#6d685f">the left atrium silence stray signals</text></g><g><g><circle cx="470" cy="328" r="10" fill="#4f7be0" fill-opacity="0.15" stroke="#4f7be0" stroke-width="1.5"></circle><text x="470" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b1a17">5</text></g><text x="490" y="332" font-weight="600" fill="#1b1a17">Coronary stent (Onyx)</text><text x="490" y="348" font-size="11.5" fill="#6d685f">Mesh tube propping open a blocked</text><text x="490" y="364" font-size="11.5" fill="#6d685f">artery on the heart&#x27;s surface</text></g></svg>