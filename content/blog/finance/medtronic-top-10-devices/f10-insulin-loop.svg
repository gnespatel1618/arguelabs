<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 310" role="img" aria-label="Fig 10. The 780G is a loop: sense, decide, dose, repeat" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1a17"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1b1a17">Fig 10. The 780G is a loop: sense, decide, dose, repeat</text><g fill="none" stroke="#1b1a17" stroke-width="1.25"><path d="M488 80 Q610 80 610 142" marker-end="url(#loop-arrow)"></path><path d="M610 196 Q610 260 490 260" marker-end="url(#loop-arrow)"></path><path d="M272 260 Q150 260 150 198" marker-end="url(#loop-arrow)"></path><path d="M150 144 Q150 80 270 80" marker-end="url(#loop-arrow)"></path></g><g><rect x="272" y="54" width="216" height="52" rx="8" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="380" y="76" text-anchor="middle" font-weight="600" fill="#1b1a17">1. Sensor</text><text x="380" y="94" text-anchor="middle" font-size="11.5" fill="#6d685f">Reads glucose every few minutes</text></g><g><rect x="502" y="144" width="216" height="52" rx="8" fill="#4f7be0" fill-opacity="0.12" stroke="#4f7be0" stroke-width="2"></rect><text x="610" y="166" text-anchor="middle" font-weight="600" fill="#1b1a17">2. Algorithm in the pump</text><text x="610" y="184" text-anchor="middle" font-size="11.5" fill="#6d685f">Adjusts insulin every 5 minutes</text></g><g><rect x="272" y="234" width="216" height="52" rx="8" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="380" y="256" text-anchor="middle" font-weight="600" fill="#1b1a17">3. Pump and cannula</text><text x="380" y="274" text-anchor="middle" font-size="11.5" fill="#6d685f">Pushes insulin under the skin</text></g><g><rect x="42" y="144" width="216" height="52" rx="8" fill="none" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="150" y="166" text-anchor="middle" font-weight="600" fill="#1b1a17">4. Blood sugar changes</text><text x="150" y="184" text-anchor="middle" font-size="11.5" fill="#6d685f">and the sensor reads it again</text></g><text x="380" y="166" text-anchor="middle" font-weight="600" fill="#1b1a17">Repeats all day</text><text x="380" y="184" text-anchor="middle" font-size="11.5" fill="#6d685f">The user still enters meals</text></svg>