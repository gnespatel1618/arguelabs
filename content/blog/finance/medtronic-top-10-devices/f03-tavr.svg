<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Fig 3. TAVR swaps a heart valve through a catheter, in three steps" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1b1a17">Fig 3. TAVR swaps a heart valve through a catheter, in three steps</text><g><g><line x1="94" y1="76" x2="94" y2="236" stroke="#1b1a17" stroke-width="2"></line><line x1="174" y1="76" x2="174" y2="236" stroke="#1b1a17" stroke-width="2"></line></g><g><polygon points="94,176 128,158 94,144" fill="#b9b3a8" stroke="#1b1a17"></polygon><polygon points="174,176 140,158 174,144" fill="#b9b3a8" stroke="#1b1a17"></polygon></g><line x1="134" y1="244" x2="134" y2="104" stroke="#1b1a17" stroke-width="2"></line><rect x="126" y="138" width="16" height="40" rx="3" fill="#4f7be0" fill-opacity="0.3" stroke="#4f7be0" stroke-width="1.5"></rect><text x="134" y="62" text-anchor="middle" font-weight="600" fill="#1b1a17">1. Thread up from the groin</text><text x="180" y="156" font-size="11.5" fill="#6d685f">Calcified</text><text x="180" y="172" font-size="11.5" fill="#6d685f">leaflets</text><text x="134" y="264" text-anchor="middle" font-size="11.5" fill="#6d685f">Folded valve rides a catheter</text><text x="134" y="280" text-anchor="middle" font-size="11.5" fill="#6d685f">to the stiff, calcified valve</text></g><g><g><line x1="340" y1="76" x2="340" y2="236" stroke="#1b1a17" stroke-width="2"></line><line x1="420" y1="76" x2="420" y2="236" stroke="#1b1a17" stroke-width="2"></line></g><g><polygon points="340,176 374,158 340,144" fill="#b9b3a8" stroke="#1b1a17"></polygon><polygon points="420,176 386,158 420,144" fill="#b9b3a8" stroke="#1b1a17"></polygon></g><line x1="380" y1="244" x2="380" y2="184" stroke="#1b1a17" stroke-width="2"></line><g stroke="#4f7be0" stroke-width="1.25"><rect x="356" y="134" width="48" height="50" fill="#4f7be0" fill-opacity="0.12"></rect><g><line x1="356" y1="134" x2="368" y2="184"></line><line x1="368" y1="134" x2="356" y2="184"></line></g><g><line x1="368" y1="134" x2="380" y2="184"></line><line x1="380" y1="134" x2="368" y2="184"></line></g><g><line x1="380" y1="134" x2="392" y2="184"></line><line x1="392" y1="134" x2="380" y2="184"></line></g><g><line x1="392" y1="134" x2="404" y2="184"></line><line x1="404" y1="134" x2="392" y2="184"></line></g></g><text x="380" y="62" text-anchor="middle" font-weight="600" fill="#1b1a17">2. Release the valve</text><text x="380" y="264" text-anchor="middle" font-size="11.5" fill="#6d685f">Nitinol frame springs open</text><text x="380" y="280" text-anchor="middle" font-size="11.5" fill="#6d685f">on its own (self-expanding)</text></g><g><g><line x1="586" y1="76" x2="586" y2="236" stroke="#1b1a17" stroke-width="2"></line><line x1="666" y1="76" x2="666" y2="236" stroke="#1b1a17" stroke-width="2"></line></g><rect x="586" y="138" width="6" height="44" fill="#b9b3a8" stroke="#1b1a17"></rect><rect x="660" y="138" width="6" height="44" fill="#b9b3a8" stroke="#1b1a17"></rect><g stroke="#4f7be0" stroke-width="1.25"><rect x="592" y="130" width="68" height="60" fill="#4f7be0" fill-opacity="0.12"></rect><g><line x1="592" y1="130" x2="609" y2="190"></line><line x1="609" y1="130" x2="592" y2="190"></line></g><g><line x1="609" y1="130" x2="626" y2="190"></line><line x1="626" y1="130" x2="609" y2="190"></line></g><g><line x1="626" y1="130" x2="643" y2="190"></line><line x1="643" y1="130" x2="626" y2="190"></line></g><g><line x1="643" y1="130" x2="660" y2="190"></line><line x1="660" y1="130" x2="643" y2="190"></line></g></g><path d="M594 142 Q609 172 626 152 Q643 172 658 142" fill="none" stroke="#4f7be0" stroke-width="2.5"></path><text x="626" y="62" text-anchor="middle" font-weight="600" fill="#1b1a17">3. New valve takes over</text><text x="626" y="264" text-anchor="middle" font-size="11.5" fill="#6d685f">Old leaflets pressed to the wall;</text><text x="626" y="280" text-anchor="middle" font-size="11.5" fill="#6d685f">new tissue leaflets open and close</text></g></svg>