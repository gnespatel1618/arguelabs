<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 548" role="img" aria-label="Every device has its own spot in the body; five of the ten work on the heart" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1b1a17">Every device has its own spot; five of the ten work on the heart</text><text x="24" y="50" font-size="11.5" fill="#6d685f">Front view, schematic. The patient&#x27;s left side is on the right.</text><g stroke="#1b1a17" stroke-width="1.25"><circle cx="380" cy="100" r="28" fill="#f6ece9"></circle><ellipse cx="380" cy="94" rx="16" ry="10" fill="none" stroke="#6d685f" stroke-width="1"></ellipse><rect x="371" y="127" width="18" height="14" fill="#f6ece9"></rect><path d="M318 146 Q380 136 442 146 L452 346 Q380 358 308 346 Z" fill="#f6ece9"></path><polygon points="318,150 294,158 276,318 292,322 312,190" fill="#f6ece9"></polygon><polygon points="442,150 466,158 484,318 468,322 448,190" fill="#f6ece9"></polygon><polygon points="312,346 330,528 364,528 376,354" fill="#f6ece9"></polygon><polygon points="448,346 430,528 396,528 384,354" fill="#f6ece9"></polygon><line x1="380" y1="141" x2="380" y2="346" stroke="#6d685f" stroke-width="1" stroke-dasharray="3 4"></line><path d="M398 210 c-5 -9 -18 -4 -13 7 l13 11 l13 -11 c5 -11 -8 -16 -13 -7 z" fill="#4f7be0" fill-opacity="0.35" stroke="#4f7be0"></path></g><g><line x1="260" y1="96" x2="376" y2="94" stroke="#1b1a17" stroke-width="1"></line><circle cx="380" cy="94" r="4" fill="#4f7be0"></circle><text x="252" y="90" text-anchor="end" font-weight="600" fill="#1b1a17">Brain</text><text x="252" y="106" text-anchor="end" font-size="11.5" fill="#6d685f">DBS electrodes for Parkinson&#x27;s</text></g><g><line x1="260" y1="264" x2="376" y2="268" stroke="#1b1a17" stroke-width="1"></line><circle cx="380" cy="268" r="4" fill="#4f7be0"></circle><text x="252" y="252" text-anchor="end" font-weight="600" fill="#1b1a17">Spine</text><text x="252" y="268" text-anchor="end" font-size="11.5" fill="#6d685f">Screws, rods, cages (Mazor-guided);</text><text x="252" y="284" text-anchor="end" font-size="11.5" fill="#6d685f">spinal cord stimulator leads</text></g><g><line x1="260" y1="318" x2="352" y2="312" stroke="#1b1a17" stroke-width="1"></line><circle cx="356" cy="312" r="4" fill="#4f7be0"></circle><text x="252" y="314" text-anchor="end" font-weight="600" fill="#1b1a17">Abdomen and pelvis</text><text x="252" y="330" text-anchor="end" font-size="11.5" fill="#6d685f">Staplers, LigaSure, Hugo robot</text></g><g><line x1="260" y1="378" x2="362" y2="354" stroke="#1b1a17" stroke-width="1"></line><circle cx="366" cy="352" r="4" fill="#4f7be0"></circle><text x="252" y="374" text-anchor="end" font-weight="600" fill="#1b1a17">Groin vessels</text><text x="252" y="390" text-anchor="end" font-size="11.5" fill="#6d685f">Catheter entry for TAVR, PFA,</text><text x="252" y="406" text-anchor="end" font-size="11.5" fill="#6d685f">Micra and stents (or the wrist)</text></g><g><line x1="512" y1="166" x2="424" y2="168" stroke="#1b1a17" stroke-width="1"></line><circle cx="420" cy="168" r="4" fill="#4f7be0"></circle><text x="520" y="162" font-weight="600" fill="#1b1a17">Under the collarbone</text><text x="520" y="178" font-size="11.5" fill="#6d685f">Pacemaker, ICD, CRT, DBS battery</text></g><g><line x1="512" y1="220" x2="412" y2="220" stroke="#1b1a17" stroke-width="1"></line><text x="520" y="216" font-weight="600" fill="#1b1a17">Heart</text><text x="520" y="232" font-size="11.5" fill="#6d685f">Leads, Micra, TAVR, stents, PFA</text><text x="520" y="248" font-size="11.5" fill="#6d685f">(see the close-up below)</text></g><g><line x1="512" y1="308" x2="428" y2="318" stroke="#1b1a17" stroke-width="1"></line><circle cx="424" cy="318" r="4" fill="#4f7be0"></circle><text x="520" y="304" font-weight="600" fill="#1b1a17">Skin of the belly</text><text x="520" y="320" font-size="11.5" fill="#6d685f">Pump cannula and glucose sensor</text></g><g><line x1="512" y1="362" x2="394" y2="341" stroke="#1b1a17" stroke-width="1"></line><circle cx="390" cy="340" r="4" fill="#4f7be0"></circle><text x="520" y="358" font-weight="600" fill="#1b1a17">Sacral nerve</text><text x="520" y="374" font-size="11.5" fill="#6d685f">InterStim for bladder control</text></g></svg>