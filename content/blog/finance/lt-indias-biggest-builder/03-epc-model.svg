<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 352" role="img" aria-label="Client money funds the work; fixed prices carry the risk" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="epc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1a17"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1b1a17">Client money funds the work; fixed prices carry the risk</text><g fill="none" stroke="#1b1a17" stroke-width="1.25"><path d="M152 114H170" marker-end="url(#epc-arrow)"></path><path d="M298 114H316" marker-end="url(#epc-arrow)"></path><path d="M444 114H462" marker-end="url(#epc-arrow)"></path><path d="M590 114H608" marker-end="url(#epc-arrow)"></path><path d="M234 164V220" stroke-dasharray="3 3"></path><path d="M526 164V220" stroke-dasharray="3 3"></path></g><g><rect x="24" y="64" width="128" height="100" rx="0" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="36" y="88" font-size="13" font-weight="600" fill="#1b1a17">1. Win the bid</text><text x="36" y="110" fill="#6d685f">L&amp;T prices the</text><text x="36" y="126" fill="#6d685f">job and its risk</text></g><g><rect x="170" y="64" width="128" height="100" rx="0" fill="#4f7be0" fill-opacity="0.14" stroke="#4f7be0" stroke-width="2"></rect><text x="182" y="88" font-size="13" font-weight="600" fill="#1b1a17">2. Advance</text><text x="182" y="110" fill="#1b1a17">Client pays about</text><text x="182" y="126" fill="#1b1a17">10% upfront</text></g><g><rect x="316" y="64" width="128" height="100" rx="0" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="328" y="88" font-size="13" font-weight="600" fill="#1b1a17">3. Engineer, buy</text><text x="328" y="110" fill="#6d685f">Design, order steel</text><text x="328" y="126" fill="#6d685f">and equipment,</text><text x="328" y="142" fill="#6d685f">then build</text></g><g><rect x="462" y="64" width="128" height="100" rx="0" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="474" y="88" font-size="13" font-weight="600" fill="#1b1a17">4. Monthly bills</text><text x="474" y="110" fill="#6d685f">Paid as work is</text><text x="474" y="126" fill="#6d685f">done; the advance</text><text x="474" y="142" fill="#6d685f">is recovered</text></g><g><rect x="608" y="64" width="128" height="100" rx="0" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="620" y="88" font-size="13" font-weight="600" fill="#1b1a17">5. Handover</text><text x="620" y="110" fill="#6d685f">About 5% held as</text><text x="620" y="126" fill="#6d685f">retention, paid</text><text x="620" y="142" fill="#6d685f">after defect period</text></g><g><rect x="24" y="220" width="344" height="104" rx="0" fill="#2f9e5b" fill-opacity="0.08" stroke="#2f9e5b" stroke-width="1.25"></rect><text x="40" y="246" font-size="13" font-weight="600" fill="#1b1a17">Why the model works</text><text x="40" y="270" fill="#1b1a17">Advances and supplier credit fund the work,</text><text x="40" y="288" fill="#1b1a17">so L&amp;T needs little cash of its own.</text><text x="40" y="306" fill="#6d685f">Net working capital: 4.1% of revenue (FY26)</text></g><g><rect x="392" y="220" width="344" height="104" rx="0" fill="#d8463d" fill-opacity="0.08" stroke="#d8463d" stroke-width="1.25"></rect><text x="408" y="246" font-size="13" font-weight="600" fill="#1b1a17">Where it goes wrong</text><text x="408" y="270" fill="#1b1a17">About half the order book is fixed-price.</text><text x="408" y="288" fill="#1b1a17">Cost overruns come out of L&amp;T&#x27;s margin.</text><text x="408" y="306" fill="#6d685f">Energy margin fell from 8.5% to 6.8% in FY26</text></g><text x="24" y="344" font-size="11" fill="#6d685f">Advance and retention shares are typical Indian public-contract terms, not L&amp;T disclosures.</text></svg>