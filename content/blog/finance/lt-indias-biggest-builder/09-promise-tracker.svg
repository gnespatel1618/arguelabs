 vs 15%)</title></circle><text x="410" y="198" text-anchor="middle" font-size="10.5" fill="#6d685f">+16% vs 15%</text></g><g><circle cx="530" cy="180" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Revenue growth, FY26: missed (+12% vs 15%)</title></circle><text x="530" y="198" text-anchor="middle" font-size="10.5" fill="#6d685f">+12% vs 15%</text></g><g><circle cx="650" cy="180" r="7" fill="#ea7a2c" stroke="none" stroke-width="2"><title>Revenue growth, FY27 so far: risk (Q1 +7% vs 10-12%)</title></circle><text x="650" y="198" text-anchor="middle" font-size="10.5" fill="#6d685f">Q1 +7% vs 10-12%</text></g><g><circle cx="290" cy="224" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Core margin, FY24: missed (~8.25% vs 9%)</title></circle><text x="290" y="242" text-anchor="middle" font-size="10.5" fill="#6d685f">~8.25% vs 9%</text></g><g><circle cx="410" cy="224" r="7" fill="#e2a623" stroke="none" stroke-width="2"><title>Core margin, FY25: mixed (8.3%, only via a 9.9% Q4)</title></circle><text x="410" y="242" text-anchor="middle" font-size="10.5" fill="#6d685f">8.3%, only via a 9.9% Q4</text></g><g><circle cx="530" cy="224" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Core margin, FY26: missed (8.3% vs 8.5%)</title></circle><text x="530" y="242" text-anchor="middle" font-size="10.5" fill="#6d685f">8.3% vs 8.5%</text></g><g><circle cx="650" cy="224" r="7" fill="#ea7a2c" stroke="none" stroke-width="2"><title>Core margin, FY27 so far: risk (Q1 7.0% vs ~7.8%)</title></circle><text x="650" y="242" text-anchor="middle" font-size="10.5" fill="#6d685f">Q1 7.0% vs ~7.8%</text></g><g><circle cx="410" cy="268" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Oil and gas margin recovery, FY25: missed (pushed to FY27)</title></circle><text x="410" y="286" text-anchor="middle" font-size="10.5" fill="#6d685f">pushed to FY27</text></g><g><circle cx="530" cy="268" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Oil and gas margin recovery, FY26: missed (moved out on 3 calls)</title></circle><text x="530" y="286" text-anchor="middle" font-size="10.5" fill="#6d685f">moved out on 3 calls</text></g><g><circle cx="650" cy="268" r="7" fill="#ea7a2c" stroke="none" stroke-width="2"><title>Oil and gas margin recovery, FY27 so far: risk (a couple of quarters)</title></circle><text x="650" y="286" text-anchor="middle" font-size="10.5" fill="#6d685f">a couple of quarters</text></g><g><circle cx="530" cy="312" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>Asset exits on time, FY26: missed (Metro missed FY26)</title></circle><text x="530" y="330" text-anchor="middle" font-size="10.5" fill="#6d685f">Metro missed FY26</text></g><g><circle cx="650" cy="312" r="7" fill="#e2a623" stroke="none" stroke-width="2"><title>Asset exits on time, FY27 so far: mixed (Nabha on time; Metro late)</title></circle><text x="650" y="330" text-anchor="middle" font-size="10.5" fill="#6d685f">Nabha on time; Metro late</text></g><g><circle cx="530" cy="356" r="7" fill="#d8463d" stroke="none" stroke-width="2"><title>ROE 18% (Lakshya 2026), FY26: missed (16.6% ex one-off)</title></circle><text x="530" y="374" text-anchor="middle" font-size="10.5" fill="#6d685f">16.6% ex one-off</text></g></g><g><circle cx="30" cy="436" r="6" fill="#2f9e5b"></circle><text x="42" y="440" fill="#6d685f">Kept</text><circle cx="100" cy="436" r="6" fill="none" stroke="#2f9e5b" stroke-width="2"></circle><text x="112" y="440" fill="#6d685f">On track</text><circle cx="190" cy="436" r="6" fill="#e2a623"></circle><text x="202" y="440" fill="#6d685f">Mixed</text><circle cx="262" cy="436" r="6" fill="#ea7a2c"></circle><text x="274" y="440" fill="#6d685f">At risk</text><circle cx="340" cy="436" r="6" fill="#d8463d"></circle><text x="352" y="440" fill="#6d685f">Missed</text><text x="420" y="440" fill="#6d685f">Blank = no guidance given</text></g></svg>