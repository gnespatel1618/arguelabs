<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Working capital fell to 4% on advances and is guided back to 10%" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Advances cut working capital to 4%; it is guided back to about 10%</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Net working capital as % of revenue (L&amp;T definition)</text><line x1="70" x2="700" y1="290" y2="290" stroke="#1b1a17"></line><g><g><rect x="101.5" y="118.57142857142858" width="63" height="171.42857142857142" fill="#b9b3a8" fill-opacity="1" stroke="none" stroke-dasharray="4 3"><title>FY24: 12% of revenue</title></rect><text x="133" y="110.57142857142858" text-anchor="middle" fill="#1b1a17">12.0%</text><text x="133" y="310" text-anchor="middle" fill="#6d685f">FY24</text></g><g><rect x="227.5" y="132.85714285714286" width="63" height="157.14285714285714" fill="#b9b3a8" fill-opacity="1" stroke="none" stroke-dasharray="4 3"><title>FY25: 11% of revenue</title></rect><text x="259" y="124.85714285714286" text-anchor="middle" fill="#1b1a17">11.0%</text><text x="259" y="310" text-anchor="middle" fill="#6d685f">FY25</text></g><g><rect x="353.5" y="231.42857142857144" width="63" height="58.571428571428555" fill="#4f7be0" fill-opacity="1" stroke="none" stroke-dasharray="4 3"><title>FY26: 4.1% of revenue</title></rect><text x="385" y="223.42857142857144" text-anchor="middle" fill="#1b1a17">4.1%</text><text x="385" y="310" text-anchor="middle" fill="#6d685f">FY26</text></g><g><rect x="479.5" y="220" width="63" height="70" fill="#4f7be0" fill-opacity="1" stroke="none" stroke-dasharray="4 3"><title>Q1 FY27: 4.9% of revenue</title></rect><text x="511" y="212" text-anchor="middle" fill="#1b1a17">4.9%</text><text x="511" y="310" text-anchor="middle" fill="#6d685f">Q1 FY27</text></g><g><rect x="605.5" y="147.14285714285714" width="63" height="142.85714285714286" fill="#b9b3a8" fill-opacity="0.25" stroke="#b9b3a8" stroke-dasharray="4 3"><title>FY27 guide: 10% of revenue</title></rect><text x="637" y="139.14285714285714" text-anchor="middle" fill="#1b1a17">10.0%</text><text x="637" y="310" text-anchor="middle" fill="#6d685f">FY27 guide</text></g></g><text x="637" y="328" text-anchor="middle" font-size="11" fill="#6d685f">~₹15,000-20,000 Cr of cash absorbed</text></svg>