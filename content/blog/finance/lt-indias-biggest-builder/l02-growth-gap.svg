<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 320" role="img" aria-label="L&amp;T revenue grew 16% but EBITDA only 1%" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Revenue up 16%, operating profit up 1%</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">L&amp;T Q2 FY27, growth on a year ago, consolidated</text><g><text x="188" y="101" text-anchor="end" font-weight="600" fill="#1b1a17">Order inflow</text><rect x="200" y="84" width="326.6666666666667" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="534.6666666666667" y="101" font-weight="600" fill="#1b1a17">+28%</text></g><g><text x="188" y="145" text-anchor="end" font-weight="600" fill="#1b1a17">Revenue</text><rect x="200" y="128" width="186.66666666666666" height="24" fill="#4f7be0" fill-opacity="0.85"></rect><text x="394.66666666666663" y="145" font-weight="600" fill="#1b1a17">+16%</text></g><g><text x="188" y="189" text-anchor="end" font-weight="600" fill="#1b1a17">EBITDA</text><rect x="200" y="172" width="11.666666666666666" height="24" fill="#d8463d" fill-opacity="0.85"></rect><text x="219.66666666666666" y="189" font-weight="600" fill="#1b1a17">+1%</text></g><g><text x="188" y="233" text-anchor="end" font-weight="600" fill="#1b1a17">Net profit</text><rect x="200" y="216" width="385" height="24" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="593" y="233" font-weight="600" fill="#1b1a17">+33%</text></g><text x="24" y="276" font-size="11.5" fill="#1b1a17">EBITDA margin fell to 8.7% from 10.0%. Profit grew on treasury income from cash released by working capital.</text><text x="24" y="294" font-size="11" fill="#6d685f">Revenue ₹78,750 Cr; EBITDA ₹6,845 Cr; net profit ₹5,202 Cr; orders ₹1.48 lakh Cr, a record.</text></svg>