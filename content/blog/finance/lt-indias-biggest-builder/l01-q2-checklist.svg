<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 370" role="img" aria-label="L&amp;T Q2 FY27 against our checklist: two passed, two mixed, two failed" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Our Q2 checklist: 2 passed, 2 mixed, 2 failed</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">The six things we said to watch on 27 Oct, against what L&amp;T reported</text><g><rect x="24" y="76" width="712" height="40" fill="#2f9e5b" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="76" width="5" height="40" fill="#2f9e5b"></rect><text x="38" y="93" font-weight="600" fill="#1b1a17">1. Revenue guidance</text><text x="38" y="109" font-size="10.5" fill="#6d685f">10–12% kept, cut, or kept with a warning?</text><text x="280" y="101" font-size="11.5" fill="#1b1a17">Kept at 10–12%; order inflow and 7.8% margin targets also kept</text><text x="728" y="101" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2f9e5b">PASSED</text></g><g><rect x="24" y="122" width="712" height="40" fill="#d8463d" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="122" width="5" height="40" fill="#d8463d"></rect><text x="38" y="139" font-weight="600" fill="#1b1a17">2. Core margin</text><text x="38" y="155" font-size="10.5" fill="#6d685f">Below 7.5% is a warning sign</text><text x="280" y="147" font-size="11.5" fill="#1b1a17">Projects and manufacturing at 7.0%, down 30 bp</text><text x="728" y="147" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#d8463d">FAILED</text></g><g><rect x="24" y="168" width="712" height="40" fill="#2f9e5b" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="168" width="5" height="40" fill="#2f9e5b"></rect><text x="38" y="185" font-weight="600" fill="#1b1a17">3. Working capital</text><text x="38" y="201" font-size="10.5" fill="#6d685f">Above 8% of revenue = tailwind unwinding</text><text x="280" y="193" font-size="11.5" fill="#1b1a17">1.7% of revenue (4.1% in March); target now below 10%</text><text x="728" y="193" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2f9e5b">PASSED</text></g><g><rect x="24" y="214" width="712" height="40" fill="#e2a623" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="214" width="5" height="40" fill="#e2a623"></rect><text x="38" y="231" font-weight="600" fill="#1b1a17">4. Gulf</text><text x="38" y="247" font-size="10.5" fill="#6d685f">Energy margin, extra costs clients pay</text><text x="280" y="239" font-size="11.5" fill="#1b1a17">Hydrocarbon margin up to 7.5%; wider energy segment −80 bp</text><text x="728" y="239" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#e2a623">MIXED</text></g><g><rect x="24" y="260" width="712" height="40" fill="#d8463d" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="260" width="5" height="40" fill="#d8463d"></rect><text x="38" y="277" font-weight="600" fill="#1b1a17">5. Quality of profit</text><text x="38" y="293" font-size="10.5" fill="#6d685f">Operations vs treasury income</text><text x="280" y="285" font-size="11.5" fill="#1b1a17">EBITDA +1% while profit +33%: treasury income again</text><text x="728" y="285" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#d8463d">FAILED</text></g><g><rect x="24" y="306" width="712" height="40" fill="#e2a623" fill-opacity="0.08" stroke="#e4ded2"></rect><rect x="24" y="306" width="5" height="40" fill="#e2a623"></rect><text x="38" y="323" font-weight="600" fill="#1b1a17">6. Capex plan</text><text x="38" y="339" font-size="10.5" fill="#6d685f">Lakshya capex detail promised in Q2</text><text x="280" y="331" font-size="11.5" fill="#1b1a17">Partial: ~$750m for AI GPUs, 100 MW+ of data centres in 1.5–2 years</text><text x="728" y="331" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="1" fill="#e2a623">MIXED</text></g></svg>