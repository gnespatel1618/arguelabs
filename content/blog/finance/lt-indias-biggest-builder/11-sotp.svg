<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 400" role="img" aria-label="Strip out the listed stakes and the core business costs 38 times earnings" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Strip out the listed stakes and the core costs about 38x earnings</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">₹ lakh Cr at ₹3,653; listed stakes at 80% of market value (20% holding-company discount)</text><g><text x="24" y="101" fill="#1b1a17" font-weight="600">L&amp;T market value</text><rect x="200" y="84" width="500" height="24" fill="#b9b3a8"><title>L&amp;T market value: ₹5,02,554 Cr</title></rect><text x="706" y="101" fill="#1b1a17">5.03</text></g><g><g><text x="24" y="141" fill="#1b1a17">less LTM stake</text><rect x="629.0135985386645" y="124" width="70.9864014613355" height="24" fill="#d8463d" fill-opacity="0.45"><title>LTM stake: ₹71,349 Cr after discount</title></rect><text x="706" y="141" fill="#6d685f">-0.71</text></g><g><text x="24" y="181" fill="#1b1a17">less L&amp;T Finance stake</text><rect x="595.6261416683581" y="164" width="33.38745687030644" height="24" fill="#d8463d" fill-opacity="0.45"><title>L&amp;T Finance stake: ₹33,558 Cr after discount</title></rect><text x="635.0135985386645" y="181" fill="#6d685f">-0.34</text></g><g><text x="24" y="221" fill="#1b1a17">less LTTS stake</text><rect x="572.5659332131472" y="204" width="23.06020845521084" height="24" fill="#d8463d" fill-opacity="0.45"><title>LTTS stake: ₹23,178 Cr after discount</title></rect><text x="601.6261416683581" y="221" fill="#6d685f">-0.23</text></g><g><text x="24" y="261" fill="#1b1a17">less E2E stake</text><rect x="570.576097295017" y="244" width="1.9898359181302112" height="24" fill="#d8463d" fill-opacity="0.45"><title>E2E stake: ₹2,000 Cr after discount</title></rect><text x="578.5659332131472" y="261" fill="#6d685f">-0.02</text></g></g><g><text x="24" y="301" font-weight="600" fill="#1b1a17">Core business</text><rect x="200" y="284" width="370.576097295017" height="24" fill="#4f7be0"></rect><text x="576.576097295017" y="301" font-weight="600" fill="#1b1a17">3.72</text></g><g><line x1="24" x2="700" y1="330" y2="330" stroke="#e4ded2"></line><text x="24" y="358" fill="#1b1a17">Core value ÷ core FY26 profit (₹9,763 Cr) = 38x</text><text x="24" y="378" font-size="11.5" fill="#6d685f">About 33x after adding back one-offs; about 22x on FY28 consensus earnings</text></g></svg>