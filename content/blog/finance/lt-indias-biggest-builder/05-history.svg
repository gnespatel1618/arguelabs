<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 540" role="img" aria-label="A takeover fight is why L and T has no promoter today" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1b1a17">A takeover fight is why L&amp;T has no promoter today</text><line x1="110" x2="110" y1="68" y2="492" stroke="#1b1a17" stroke-width="1.25"></line><g><circle cx="110" cy="68" r="5" fill="#b9b3a8"></circle><text x="24" y="72" font-weight="600" fill="#1b1a17">1938</text><text x="136" y="72" fill="#1b1a17">Founded in Bombay by two Danish engineers, Henning Holck-Larsen and Søren Kristian Toubro</text></g><g><circle cx="110" cy="114" r="5" fill="#b9b3a8"></circle><text x="24" y="118" font-weight="600" fill="#1b1a17">1987–89</text><text x="136" y="118" fill="#1b1a17">Reliance builds a stake, then makes a hostile bid; management resists</text></g><g><circle cx="110" cy="160" r="5" fill="#b9b3a8"></circle><text x="24" y="164" font-weight="600" fill="#1b1a17">1999</text><text x="136" y="164" fill="#1b1a17">A.M. Naik becomes CEO; leads L&amp;T for 18 years</text></g><g><circle cx="110" cy="206" r="5" fill="#b9b3a8"></circle><text x="24" y="210" font-weight="600" fill="#1b1a17">2001</text><text x="136" y="210" fill="#1b1a17">Reliance sells its stake to the Birla group&#x27;s Grasim</text></g><g><circle cx="110" cy="252" r="7" fill="#4f7be0"></circle><text x="24" y="256" font-weight="600" fill="#1b1a17">2003–04</text><text x="136" y="256" font-weight="600" fill="#1b1a17">Cement business goes to Grasim (now UltraTech); Grasim&#x27;s L&amp;T stake</text><text x="136" y="274" font-weight="600" fill="#1b1a17">goes to an employees&#x27; trust. Result: no promoter, still true today</text></g><g><circle cx="110" cy="308" r="5" fill="#b9b3a8"></circle><text x="24" y="312" font-weight="600" fill="#1b1a17">2017</text><text x="136" y="312" fill="#1b1a17">S.N. Subrahmanyan becomes CEO (Chairman and MD from 2023)</text></g><g><circle cx="110" cy="354" r="5" fill="#b9b3a8"></circle><text x="24" y="358" font-weight="600" fill="#1b1a17">2019</text><text x="136" y="358" fill="#1b1a17">Hostile takeover of Mindtree; later merged into LTIMindtree (now LTM)</text></g><g><circle cx="110" cy="400" r="5" fill="#b9b3a8"></circle><text x="24" y="404" font-weight="600" fill="#1b1a17">2020</text><text x="136" y="404" fill="#1b1a17">Electrical &amp; Automation business sold to Schneider for ₹14,000 Cr</text></g><g><circle cx="110" cy="446" r="5" fill="#b9b3a8"></circle><text x="24" y="450" font-weight="600" fill="#1b1a17">2023</text><text x="136" y="450" fill="#1b1a17">First-ever share buyback: ₹10,000 Cr at ₹3,200 a share</text></g><g><circle cx="110" cy="492" r="5" fill="#b9b3a8"></circle><text x="24" y="496" font-weight="600" fill="#1b1a17">2026</text><text x="136" y="496" fill="#1b1a17">Lakshya 2031 plan launched; Gulf war disrupts execution</text></g><text x="24" y="522" font-size="11.5" fill="#6d685f">Today: Employees&#x27; Trust 14.6% + LIC 13.2% = a friendly 28% bloc (Sep 2026)</text></svg>