<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="Kaynes converts the least profit into cash among its peers" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Kaynes turns the least of its profit into cash among its peers</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Operating cash flow as % of operating profit, FY22-FY26 combined (Screener)</text><line x1="330" x2="330" y1="70" y2="294" stroke="#1b1a17"></line><g><text x="24" y="99" font-weight="400" fill="#1b1a17">Dixon</text><rect x="330" y="84" width="324" height="20" fill="#b9b3a8" fill-opacity="1"><title>Dixon: 90%</title></rect><text x="660" y="99" text-anchor="start" font-weight="400" fill="#1b1a17">90%</text></g><g><text x="24" y="135" font-weight="400" fill="#1b1a17">Amber</text><rect x="330" y="120" width="320.4000000000001" height="20" fill="#b9b3a8" fill-opacity="1"><title>Amber: 89%</title></rect><text x="656.4000000000001" y="135" text-anchor="start" font-weight="400" fill="#1b1a17">89%</text></g><g><text x="24" y="171" font-weight="400" fill="#1b1a17">Centum</text><rect x="330" y="156" width="313.20000000000005" height="20" fill="#b9b3a8" fill-opacity="1"><title>Centum: 87%</title></rect><text x="649.2" y="171" text-anchor="start" font-weight="400" fill="#1b1a17">87%</text></g><g><text x="24" y="207" font-weight="400" fill="#1b1a17">Syrma SGS</text><rect x="330" y="192" width="72" height="20" fill="#b9b3a8" fill-opacity="1"><title>Syrma SGS: 20%</title></rect><text x="408" y="207" text-anchor="start" font-weight="400" fill="#1b1a17">20%</text></g><g><text x="24" y="243" font-weight="400" fill="#1b1a17">Avalon</text><rect x="330" y="228" width="64.80000000000001" height="20" fill="#b9b3a8" fill-opacity="1"><title>Avalon: 18%</title></rect><text x="400.8" y="243" text-anchor="start" font-weight="400" fill="#1b1a17">18%</text></g><g><text x="24" y="279" font-weight="600" fill="#1b1a17">Kaynes</text><rect x="182.4" y="264" width="147.6" height="20" fill="#d8463d" fill-opacity="0.8"><title>Kaynes: -41%</title></rect><text x="176.4" y="279" text-anchor="end" font-weight="600" fill="#1b1a17">-41%</text></g><text x="24" y="318" font-size="11" fill="#6d685f">Negative = the business consumed cash while reporting profit.</text></svg>