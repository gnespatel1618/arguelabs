<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 330" role="img" aria-label="India electronics production grew about seven times in eleven years" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">India&#x27;s electronics output grew 6.9x in eleven years</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Electronics production, ₹ lakh crore. About half is mobile phones; Kaynes is in the other half</text><line x1="60" x2="720" y1="290" y2="290" stroke="#1b1a17"></line><g><rect x="78.15" y="262.85714285714283" width="46.2" height="27.142857142857167" fill="#b9b3a8"><title>FY15: ₹1.9 lakh Cr</title></rect><text x="101.25" y="254.85714285714283" text-anchor="middle" fill="#1b1a17">1.9</text><text x="101.25" y="310" text-anchor="middle" fill="#6d685f">FY15</text></g><g><rect x="160.65" y="234.57142857142856" width="46.2" height="55.428571428571445" fill="#b9b3a8"><title>FY18: ₹3.88 lakh Cr</title></rect><text x="183.75" y="226.57142857142856" text-anchor="middle" fill="#1b1a17">3.9</text><text x="183.75" y="310" text-anchor="middle" fill="#6d685f">FY18</text></g><g><rect x="243.15" y="210.85714285714283" width="46.2" height="79.14285714285717" fill="#b9b3a8"><title>FY21: ₹5.54 lakh Cr</title></rect><text x="266.25" y="202.85714285714283" text-anchor="middle" fill="#1b1a17">5.5</text><text x="266.25" y="310" text-anchor="middle" fill="#6d685f">FY21</text></g><g><rect x="325.65" y="198.42857142857144" width="46.2" height="91.57142857142856" fill="#b9b3a8"><title>FY22: ₹6.41 lakh Cr</title></rect><text x="348.75" y="190.42857142857144" text-anchor="middle" fill="#1b1a17">6.4</text><text x="348.75" y="310" text-anchor="middle" fill="#6d685f">FY22</text></g><g><rect x="408.15" y="172.14285714285714" width="46.2" height="117.85714285714286" fill="#b9b3a8"><title>FY23: ₹8.25 lakh Cr</title></rect><text x="4