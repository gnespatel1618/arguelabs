<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 296" role="img" aria-label="Kaynes at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1b1a17">Kaynes at a glance, 20 Oct 2026</text><g><rect x="24" y="60" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.5"></rect><text x="40" y="86" fill="#6d685f">Share price (19 Oct 2026)</text><text x="40" y="116" font-size="22" font-weight="600" fill="#d8463d">₹3,250</text><text x="40" y="140" font-size="11.5" fill="#6d685f">-53% from the ₹6,998 high</text></g><g><rect x="264" y="60" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="280" y="86" fill="#6d685f">Revenue (FY26)</text><text x="280" y="116" font-size="22" font-weight="600" fill="#1b1a17">₹3,626 Cr</text><text x="280" y="140" font-size="11.5" fill="#6d685f">Up 33%; ₹4,500 Cr+ was guided</text></g><g><rect x="504" y="60" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="86" fill="#6d685f">EBITDA margin (FY26)</text><text x="520" y="116" font-size="22" font-weight="600" fill="#1b1a17">15.9%</text><text x="520" y="140" font-size="11.5" fill="#6d685f">The one promise kept</text></g><g><rect x="24" y="172" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.5"></rect><text x="40" y="198" fill="#6d685f">Operating cash flow (FY26)</text><text x="40" y="228" font-size="22" font-weight="600" fill="#d8463d">-₹600 Cr</text><text x="40" y="252" font-size="11.5" fill="#6d685f">Profit was +₹364 Cr</text></g><g><rect x="264" y="172" width="224" height="96" fill="#f6f2ea" stroke="#d8463d" stroke-width="1.5"></rect><text x="280" y="198" fill="#6d685f">Return on equity</text><text x="280" y="228" font-size="22" font-weight="600" fill="#d8463d">8.7%</text><text x="280" y="252" font-size="11.5" fill="#6d685f">Below its cost of capital</text></g><g><rect x="504" y="172" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="198" fill="#6d685f">P/E (trailing)</text><text x="520" y="228" font-size="22" font-weight="600" fill="#1b1a17">63x</text><text x="520" y="252" font-size="11.5" fill="#6d685f">37x on FY28 consensus</text></g></svg>