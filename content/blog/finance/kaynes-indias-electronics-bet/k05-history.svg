<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 620" role="img" aria-label="Thirty-five years of building, then twelve months of bad news" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1b1a17">35 years of building, then 12 months of bad news</text><line x1="112" x2="112" y1="68" y2="548" stroke="#1b1a17" stroke-width="1.25"></line><g><circle cx="112" cy="68" r="5" fill="#b9b3a8"></circle><text x="24" y="72" font-weight="600" fill="#1b1a17">1988</text><text x="136" y="72" font-weight="400" fill="#1b1a17">Ramesh Kunhikannan starts Kaynes as a one-man business in Mysuru</text></g><g><circle cx="112" cy="108" r="5" fill="#b9b3a8"></circle><text x="24" y="112" font-weight="600" fill="#1b1a17">2008</text><text x="136" y="112" font-weight="400" fill="#1b1a17">Incorporated as a company; plants follow in Chennai, Bengaluru, Manesar</text></g><g><circle cx="112" cy="148" r="7" fill="#4f7be0"></circle><text x="24" y="152" font-weight="600" fill="#1b1a17">Nov 2022</text><text x="136" y="152" font-weight="400" fill="#1b1a17">IPO at ₹587, raising ₹858 Cr</text></g><g><circle cx="112" cy="188" r="5" fill="#b9b3a8"></circle><text x="24" y="192" font-weight="600" fill="#1b1a17">Dec 2023</text><text x="136" y="192" font-weight="400" fill="#1b1a17">Raises ₹1,400 Cr from institutions at ₹2,424 a share</text></g><g><circle cx="112" cy="228" r="5" fill="#b9b3a8"></circle><text x="24" y="232" font-weight="600" fill="#1b1a17">Sep 2024</text><text x="136" y="232" font-weight="400" fill="#1b1a17">Buys Iskraemeco India (smart meters) for ₹43 Cr</text></g><g><circle cx="112" cy="268" r="7" fill="#4f7be0"></circle><text x="24" y="272" font-weight="600" fill="#1b1a17">Jan 2025</text><text x="136" y="272" font-weight="400" fill="#1b1a17">Stock peaks near ₹7,600, about 200 times earnings</text></g><g><circle cx="112" cy="308" r="5" fill="#b9b3a8"></circle><text x="24" y="312" font-weight="600" fill="#1b1a17">May 2025</text><text x="136" y="312" font-weight="400" fill="#1b1a17">Buys August Electronics (Canada) for CAD 57 m</text></g><g><circle cx="112" cy="348" r="7" fill="#d8463d"></circle><text x="24" y="352" font-weight="600" fill="#1b1a17">Jun 2025</text><text x="136" y="352" font-weight="400" fill="#1b1a17">Promoter sells ₹625 Cr of shares; two weeks later, a ₹1,600 Cr raise at ₹5,570</text></g><g><circle cx="112" cy="388" r="7" fill="#d8463d"></circle><text x="24" y="392" font-weight="600" fill="#1b1a17">Sep 2025</text><text x="136" y="392" font-weight="400" fill="#1b1a17">CEO resigns; Dr Muthukumar Narayanaswamy becomes MD</text></g><g><circle cx="112" cy="428" r="7" fill="#d8463d"></circle><text x="24" y="432" font-weight="600" fill="#1b1a17">Dec 2025</text><text x="136" y="432" font-weight="600" fill="#1b1a17">Kotak flags undisclosed related-party deals; stock falls ~31% in 2 weeks</text></g><g><circle cx="112" cy="468" r="7" fill="#4f7be0"></circle><text x="24" y="472" font-weight="600" fill="#1b1a17">Mar 2026</text><text x="136" y="472" font-weight="400" fill="#1b1a17">Sanand chip-packaging plant (Unit 1) inaugurated</text></g><g><circle cx="112" cy="508" r="7" fill="#d8463d"></circle><text x="24" y="512" font-weight="600" fill="#1b1a17">May 2026</text><text x="136" y="512" font-weight="400" fill="#1b1a17">FY26 misses guidance; cash flow -₹600 Cr; numeric guidance dropped</text></g><g><circle cx="112" cy="548" r="5" fill="#b9b3a8"></circle><text x="24" y="552" font-weight="600" fill="#1b1a17">Sep 2026</text><text x="136" y="552" font-weight="400" fill="#1b1a17">New auditor approved: Walker Chandiok (Grant Thornton Bharat)</text></g><circle cx="30" cy="590" r="6" fill="#4f7be0"></circle><text x="42" y="594" font-size="11.5" fill="#6d685f">Milestone</text><circle cx="130" cy="590" r="6" fill="#d8463d"></circle><text x="142" y="594" font-size="11.5" fill="#6d685f">Governance or guidance event</text></svg>