<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Kaynes is moving upstream into PCBs and chip packaging" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="vc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1a17"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#1b1a17">Kaynes is moving upstream: from assembling boards to making their parts</text><g fill="none" stroke="#1b1a17" stroke-width="1.25"><path d="M184 120H208" marker-end="url(#vc-arrow)"></path><path d="M368 120H392" marker-end="url(#vc-arrow)"></path><path d="M552 120H576" marker-end="url(#vc-arrow)"></path></g><g><rect x="24" y="64" width="160" height="112" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="36" y="88" font-size="13" font-weight="600" fill="#1b1a17">1. Design</text><text x="36" y="110" fill="#6d685f">Help the customer</text><text x="36" y="126" fill="#6d685f">design the board</text><text x="36" y="142" fill="#6d685f">and the process</text></g><g><rect x="208" y="64" width="160" height="112" fill="#4f7be0" fill-opacity="0.14" stroke="#4f7be0" stroke-width="2"></rect><text x="220" y="88" font-size="13" font-weight="600" fill="#1b1a17">2. Make the parts</text><text x="220" y="110" fill="#1b1a17">Bare PCBs (Chennai)</text><text x="220" y="126" fill="#1b1a17">Chip packaging</text><text x="220" y="142" fill="#1b1a17">(OSAT, Sanand)</text></g><text x="220" y="162" font-size="11" fill="#4f7be0" font-weight="600">NEW: sales from Q3 FY27</text><g><rect x="392" y="64" width="160" height="112" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="404" y="88" font-size="13" font-weight="600" fill="#1b1a17">3. Assemble</text><text x="404" y="110" fill="#6d685f">Put components on</text><text x="404" y="126" fill="#6d685f">boards, build full</text><text x="404" y="142" fill="#6d685f">boxes. Core EMS</text></g><g><rect x="576" y="64" width="160" height="112" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1.25"></rect><text x="588" y="88" font-size="13" font-weight="600" fill="#1b1a17">4. Customers</text><text x="588" y="110" fill="#6d685f">Cars, factories,</text><text x="588" y="126" fill="#6d685f">trains, defence,</text><text x="588" y="142" fill="#6d685f">medical, IoT</text></g><path d="M472 176V216" fill="none" stroke="#1b1a17" stroke-width="1.25" stroke-dasharray="3 3"></path><rect x="208" y="216" width="424" height="96" fill="#d8463d" fill-opacity="0.08" stroke="#d8463d" stroke-width="1.25"></rect><text x="224" y="242" font-size="13" font-weight="600" fill="#1b1a17">Side business: smart meters (GridCrest, ex-Iskraemeco)</text><text x="224" y="264" fill="#1b1a17">Makes and installs meters for state power utilities, which pay slowly.</text><text x="224" y="282" fill="#1b1a17">FY26 revenue ₹971 Cr, but ₹1,311 Cr of unpaid bills (Jun 2026).</text><text x="224" y="300" fill="#6d685f">Management is now shrinking it; a plan is due in Feb 2027.</text></svg>