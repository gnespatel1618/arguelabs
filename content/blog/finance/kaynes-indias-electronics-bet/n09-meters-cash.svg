<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="Smart meters bill faster than utilities pay" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Smart meters: utilities owe more than a full year of sales</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Kaynes smart-meter business (GridCrest), ₹ Cr. Core EMS collects in ~55 days; meters in ~15 months</text><g><text x="24" y="94" font-weight="600" fill="#1b1a17">FY26: revenue vs unpaid bills</text><g><text x="24" y="120" fill="#6d685f">Revenue</text><rect x="230" y="106" width="348.10831426392065" height="20" fill="#b9b3a8" fill-opacity="1"></rect><text x="586.1083142639206" y="121" font-weight="600" fill="#1b1a17">971</text></g><g><text x="24" y="150" fill="#6d685f">Unpaid bills (Jun 2026)</text><rect x="230" y="136" width="470" height="20" fill="#d8463d" fill-opacity="0.8"></rect><text x="708" y="151" font-weight="600" fill="#1b1a17">1,311</text></g></g><g><text x="24" y="194" font-weight="600" fill="#1b1a17">Q1 FY27: billed vs collected</text><g><text x="24" y="220" fill="#6d685f">Billed</text><rect x="230" y="206" width="86.04118993135012" height="20" fill="#b9b3a8" fill-opacity="1"></rect><text x="324.0411899313501" y="221" font-weight="600" fill="#1b1a17">240</text></g><g><text x="24" y="250" fill="#6d685f">Collected</text><rect x="230" y="236" width="31.548436308161712" height="20" fill="#4f7be0" fill-opacity="1"></rect><text x="269.54843630816174" y="251" font-weight="600" fill="#1b1a17">88</text></g></g><text x="321.54843630816174" y="255" font-size="11" fill="#6d685f">~37% of the quarter&#x27;s billing collected</text><text x="24" y="288" font-size="11" fill="#6d685f">Unpaid bills ≈ 28% of Kaynes&#x27; net worth. Q1 figures from the Aug 2026 call (billing approximate).</text></svg>