<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 280" role="img" aria-label="Only a small part of the chip plant subsidy has arrived" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Only 9% of the expected chip-plant subsidy has arrived so far</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Kaynes Semicon OSAT, Sanand (Gujarat), ₹ Cr</text><g><text x="24" y="96" fill="#1b1a17">Total project cost</text><rect x="300" y="80" width="390" height="22" fill="#b9b3a8"><title>Total project cost: ₹3,307 Cr</title></rect><text x="698" y="96" fill="#1b1a17">3,307</text></g><g><text x="24" y="140" fill="#1b1a17">Govt subsidy expected (50% + 20%)</text><rect x="300" y="124" width="215.81493801028122" height="22" fill="#b9b3a8"><title>Govt subsidy expected (50% + 20%): ₹1,830 Cr</title></rect><text x="523.8149380102813" y="140" fill="#1b1a17">1,830</text></g><g><text x="24" y="184" fill="#1b1a17">Spent so far</text><rect x="300" y="168" width="82.55216208043544" height="22" fill="#b9b3a8"><title>Spent so far: ₹700 Cr</title></rect><text x="390.55216208043544" y="184" fill="#1b1a17">700</text></g><g><text x="24" y="228" fill="#1b1a17">Subsidy received (to Jul 2026)</text><rect x="300" y="212" width="20.04838221953432" height="22" fill="#4f7be0"><title>Subsidy received (to Jul 2026): ₹170 Cr</title></rect><text x="328.04838221953435" y="228" fill="#1b1a17">170</text></g><text x="24" y="266" font-size="11" fill="#6d685f">Subsidy expected = 70% of about ₹2,615 Cr eligible capex (annual report); spent and received from the Aug 2026 call.</text></svg>