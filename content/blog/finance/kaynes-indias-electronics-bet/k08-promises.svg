<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 470" role="img" aria-label="Kaynes management promises: most missed or slipped" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">2 promises kept, 7 missed or slipped since Jan 2025</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">What management said on earnings calls vs what happened</text><text x="44" y="76" font-weight="600" fill="#6d685f">Promise</text><text x="330" y="76" font-weight="600" fill="#6d685f">Guided</text><text x="520" y="76" font-weight="600" fill="#6d685f">Delivered</text><g><line x1="24" x2="736" y1="102" y2="102" stroke="#e4ded2"></line><circle cx="30" cy="88" r="6" fill="#d8463d"><title>FY25 revenue: missed</title></circle><text x="44" y="92" fill="#1b1a17">FY25 revenue</text><text x="330" y="92" fill="#6d685f">Over ₹3,000 Cr</text><text x="520" y="92" fill="#1b1a17">₹2,722 Cr</text></g><g><line x1="24" x2="736" y1="132" y2="132" stroke="#e4ded2"></line><circle cx="30" cy="118" r="6" fill="#d8463d"><title>FY26 revenue: missed</title></circle><text x="44" y="122" fill="#1b1a17">FY26 revenue</text><text x="330" y="122" fill="#6d685f">₹4,500 Cr+ (Jul 2025)</text><text x="520" y="122" fill="#1b1a17">₹3,626 Cr</text></g><g><line x1="24" x2="736" y1="162" y2="162" stroke="#e4ded2"></line><circle cx="30" cy="148" r="6" fill="#2f9e5b"><title>FY26 EBITDA margin: kept</title></circle><text x="44" y="152" fill="#1b1a17">FY26 EBITDA margin</text><text x="330" y="152" fill="#6d685f">About 15.6%</text><text x="520" y="152" fill="#1b1a17">15.9%</text></g><g><line x1="24" x2="736" y1="192" y2="192" stroke="#e4ded2"></line><circle cx="30" cy="178" r="6" fill="#d8463d"><title>FY26 operating cash flow: missed</title></circle><text x="44" y="182" fill="#1b1a17">FY26 operating cash flow</text><text x="330" y="182" fill="#6d685f">Significantly positive</text><text x="520" y="182" fill="#1b1a17">-₹600 Cr</text></g><g><line x1="24" x2="736" y1="222" y2="222" stroke="#e4ded2"></line><circle cx="30" cy="208" r="6" fill="#d8463d"><title>Working capital days: missed</title></circle><text x="44" y="212" fill="#1b1a17">Working capital days</text><text x="330" y="212" fill="#6d685f">70-85 days</text><text x="520" y="212" fill="#1b1a17">122-133 days</text></g><g><line x1="24" x2="736" y1="252" y2="252" stroke="#e4ded2"></line><circle cx="30" cy="238" r="6" fill="#d8463d"><title>Collect acquired meter dues (₹350 Cr): missed</title></circle><text x="44" y="242" fill="#1b1a17">Collect acquired meter dues (₹350 Cr)</text><text x="330" y="242" fill="#6d685f">Next quarter (2025)</text><text x="520" y="242" fill="#1b1a17">~₹80 Cr by May 2026</text></g><g><line x1="24" x2="736" y1="282" y2="282" stroke="#e4ded2"></line><circle cx="30" cy="268" r="6" fill="#2f9e5b"><title>Build Sanand chip plant (Unit 1): kept</title></circle><text x="44" y="272" fill="#1b1a17">Build Sanand chip plant (Unit 1)</text><text x="330" y="272" fill="#6d685f">By FY26</text><text x="520" y="272" fill="#1b1a17">Opened 31 Mar 2026</text></g><g><line x1="24" x2="736" y1="312" y2="312" stroke="#e4ded2"></line><circle cx="30" cy="298" r="6" fill="#ea7a2c"><title>Chip plant mass production: slipped</title></circle><text x="44" y="302" fill="#1b1a17">Chip plant mass production</text><text x="330" y="302" fill="#6d685f">Jan 2026</text><text x="520" y="302" fill="#1b1a17">Now Q3 FY27</text></g><g><line x1="24" x2="736" y1="342" y2="342" stroke="#e4ded2"></line><circle cx="30" cy="328" r="6" fill="#ea7a2c"><title>PCB plant start: slipped</title></circle><text x="44" y="332" fill="#1b1a17">PCB plant start</text><text x="330" y="332" fill="#6d685f">Apr 2026</text><text x="520" y="332" fill="#1b1a17">Now Q2-Q3 FY27</text></g><g><line x1="24" x2="736" y1="372" y2="372" stroke="#e4ded2"></line><circle cx="30" cy="358" r="6" fill="#e2a623"><title>US$1 bn revenue by FY28: risk</title></circle><text x="44" y="362" fill="#1b1a17">US$1 bn revenue by FY28</text><text x="330" y="362" fill="#6d685f">Feb 2026</text><text x="520" y="362" fill="#1b1a17">Needs ~51% a year</text></g><g><line x1="24" x2="736" y1="402" y2="402" stroke="#e4ded2"></line><circle cx="30" cy="388" r="6" fill="#b9b3a8"><title>Positive cash flow by FY27 end: open</title></circle><text x="44" y="392" fill="#1b1a17">Positive cash flow by FY27 end</text><text x="330" y="392" fill="#6d685f">Aug 2026</text><text x="520" y="392" fill="#1b1a17">Q1 was -₹259 Cr</text></g><g><circle cx="30" cy="446" r="6" fill="#2f9e5b"></circle><text x="42" y="450" fill="#6d685f">Kept</text></g><g><circle cx="100" cy="446" r="6" fill="#ea7a2c"></circle><text x="112" y="450" fill="#6d685f">Slipped</text></g><g><circle cx="180" cy="446" r="6" fill="#d8463d"></circle><text x="192" y="450" fill="#6d685f">Missed</text></g><g><circle cx="256" cy="446" r="6" fill="#e2a623"></circle><text x="268" y="450" fill="#6d685f">At risk</text></g><g><circle cx="336" cy="446" r="6" fill="#b9b3a8"></circle><text x="348" y="450" fill="#6d685f">Open</text></g></svg>