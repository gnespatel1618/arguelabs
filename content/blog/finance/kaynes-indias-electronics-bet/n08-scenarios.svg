<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 350" role="img" aria-label="Bear base and bull values against today" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Two of three cases sit below today&#x27;s price</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Value around mid-2028 = FY28 EPS × P/E, before dividends. Illustrative.</text><g><line x1="250" x2="250" y1="90" y2="296" stroke="#e4ded2"></line><text x="250" y="314" text-anchor="middle" fill="#6d685f">₹1,000</text></g><g><line x1="370" x2="370" y1="90" y2="296" stroke="#e4ded2"></line><text x="370" y="314" text-anchor="middle" fill="#6d685f">₹2,000</text></g><g><line x1="490" x2="490" y1="90" y2="296" stroke="#e4ded2"></line><text x="490" y="314" text-anchor="middle" fill="#6d685f">₹3,000</text></g><g><line x1="610" x2="610" y1="90" y2="296" stroke="#e4ded2"></line><text x="610" y="314" text-anchor="middle" fill="#6d685f">₹4,000</text></g><g><line x1="730" x2="730" y1="90" y2="296" stroke="#e4ded2"></line><text x="730" y="314" text-anchor="middle" fill="#6d685f">₹5,000</text></g><line x1="520" x2="520" y1="82" y2="296" stroke="#1b1a17" stroke-width="1.5"></line><text x="520" y="78" text-anchor="middle" font-weight="600" fill="#1b1a17">Today ₹3,250</text><line x1="575.8" x2="575.8" y1="92" y2="296" stroke="#3a3833" stroke-dasharray="4 4"></line><text x="581.8" y="290" font-size="11" fill="#6d685f">Street avg ₹3,715</text><g><text x="24" y="118" font-weight="600" fill="#1b1a17">Bear</text><text x="24" y="134" font-size="11" fill="#6d685f">EPS ₹40 × 35x</text><text x="24" y="148" font-size="11" fill="#6d685f">Plants slip, meter write-downs, dilution</text><line x1="520" x2="298" y1="120" y2="120" stroke="#d8463d" stroke-width="2"></line><circle cx="298" cy="120" r="8" fill="#d8463d"></circle><text x="298" y="106" text-anchor="middle" font-weight="600" fill="#1b1a17">₹1,400 (-57%)</text></g><g><text x="24" y="184" font-weight="600" fill="#1b1a17">Base</text><text x="24" y="200" font-size="11" fill="#6d685f">EPS ₹57 × 45x</text><text x="24" y="214" font-size="11" fill="#6d685f">Plants ramp H2 FY27, meters shrink slowly</text><line x1="520" x2="437.79999999999995" y1="186" y2="186" stroke="#4f7be0" stroke-width="2"></line><circle cx="437.79999999999995" cy="186" r="8" fill="#4f7be0"></circle><text x="437.79999999999995" y="172" text-anchor="middle" font-weight="600" fill="#1b1a17">₹2,565 (-21%)</text></g><g><text x="24" y="250" font-weight="600" fill="#1b1a17">Bull</text><text x="24" y="266" font-size="11" fill="#6d685f">EPS ₹88 × 50x</text><text x="24" y="280" font-size="11" fill="#6d685f">Consensus delivered, cash turns positive</text><line x1="520" x2="658" y1="252" y2="252" stroke="#2f9e5b" stroke-width="2"></line><circle cx="658" cy="252" r="8" fill="#2f9e5b"></circle><text x="658" y="238" text-anchor="middle" font-weight="600" fill="#1b1a17">₹4,400 (+35%)</text></g></svg>