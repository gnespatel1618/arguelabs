<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 230" role="img" aria-label="Management tone moved from bullish to cautious in eighteen months" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="tone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1a17"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Management&#x27;s tone, call by call: bullish to cautious in 18 months</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">Our read of seven earnings calls and the special call on the Kotak report</text><g><rect x="24" y="84" width="140" height="56" fill="#2f9e5b" fill-opacity="0.85"></rect><text x="36" y="108" font-size="15" font-weight="600" fill="#1b1a17">Bullish</text><text x="36" y="127" font-size="11" fill="#1b1a17">Jan-Jul 2025</text><text x="24" y="164" font-size="11" fill="#6d685f">&quot;$1 bn revenue&quot;,</text><text x="24" y="179" font-size="11" fill="#6d685f">chip-plant hype</text></g><g><rect x="168" y="84" width="140" height="56" fill="#e2a623" fill-opacity="0.85"></rect><text x="180" y="108" font-size="15" font-weight="600" fill="#1b1a17">Evasive</text><text x="180" y="127" font-size="11" fill="#1b1a17">Nov 2025</text><text x="168" y="164" font-size="11" fill="#6d685f">Cash questions deflected</text><text x="168" y="179" font-size="11" fill="#6d685f"></text></g><g><rect x="312" y="84" width="140" height="56" fill="#ea7a2c" fill-opacity="0.85"></rect><text x="324" y="108" font-size="15" font-weight="600" fill="#1b1a17">Defensive</text><text x="324" y="127" font-size="11" fill="#1b1a17">Dec 2025</text><text x="312" y="164" font-size="11" fill="#6d685f">Kotak report:</text><text x="312" y="179" font-size="11" fill="#6d685f">&quot;inadvertent&quot;</text></g><g><rect x="456" y="84" width="140" height="56" fill="#d8463d" fill-opacity="0.85"></rect><text x="468" y="108" font-size="15" font-weight="600" fill="#1b1a17">Humbled</text><text x="468" y="127" font-size="11" fill="#1b1a17">May 2026</text><text x="456" y="164" font-size="11" fill="#6d685f">Apologised for the FY26</text><text x="456" y="179" font-size="11" fill="#6d685f">miss</text></g><g><rect x="600" y="84" width="140" height="56" fill="#b9b3a8" fill-opacity="0.6"></rect><text x="612" y="108" font-size="15" font-weight="600" fill="#1b1a17">Cautious</text><text x="612" y="127" font-size="11" fill="#1b1a17">Aug 2026</text><text x="600" y="164" font-size="11" fill="#6d685f">&quot;It is going to be a tough</text><text x="600" y="179" font-size="11" fill="#6d685f">year&quot;</text></g><line x1="24" x2="736" y1="206" y2="206" stroke="#1b1a17" marker-end="url(#tone)"></line><text x="736" y="222" text-anchor="end" font-size="11" fill="#6d685f">time →</text></svg>