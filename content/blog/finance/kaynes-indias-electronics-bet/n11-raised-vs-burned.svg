<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 210" role="img" aria-label="Kaynes raised about as much equity as it burned in free cash flow" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Shareholders&#x27; new money has been paying for the cash gap</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">₹ Cr. Fresh equity since the Nov 2022 IPO vs free cash flow over FY23-FY26</text><text x="24" y="98" font-weight="600" fill="#1b1a17">Fresh equity raised</text><text x="24" y="114" font-size="11" fill="#6d685f">IPO + Dec 2023 + Jun 2025 raises</text><rect x="250" y="84" width="450" height="26" fill="#4f7be0"></rect><text x="692" y="102" text-anchor="end" font-weight="600" fill="#ffffff">₹3,660</text><text x="24" y="154" font-weight="600" fill="#1b1a17">Free cash flow, FY23-FY26</text><text x="24" y="170" font-size="11" fill="#6d685f">operating cash flow minus capex</text><rect x="250" y="140" width="401.6803278688525" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="643.6803278688525" y="158" text-anchor="end" font-weight="600" fill="#ffffff">-₹3,267</text><text x="24" y="200" font-size="11" fill="#6d685f">Free cash outflow over four years used up an amount equal to about 89% of the equity raised.</text></svg>