<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 230" role="img" aria-label="Smart meters are about a quarter of revenue" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Smart meters are a quarter of revenue and most of the cash problem</text><text data-claude-text-id="sub" x="24" y="50" fill="#6d685f">FY26 revenue by customer type, % (smart meters split out of industrial)</text><g><rect x="24" y="80" width="190.24" height="44" fill="#d8463d" fill-opacity="0.75"><title>Smart meters: 27%</title></rect><text x="32" y="98" fill="#1b1a17" font-weight="600">Smart meters</text><text x="32" y="116" fill="#1b1a17">27%</text></g><g><rect x="216.24" y="80" width="197.36" height="44" fill="#b9b3a8" fill-opacity="0.85"><title>Other industrial and EV: 28%</title></rect><text x="224.24" y="98" fill="#1b1a17" font-weight="400">Other industrial and EV</text><text x="224.24" y="116" fill="#1b1a17">28%</text></g><g><rect x="415.6" y="80" width="176" height="44" fill="#b9b3a8" fill-opacity="0.7"><title>Automotive: 25%</title></rect><text x="423.6" y="98" fill="#1b1a17" font-weight="400">Automotive</text><text x="423.6" y="116" fill="#1b1a17">25%</text></g><g><rect x="593.6" y="80" width="69.2" height="44" fill="#b9b3a8" fill-opacity="0.55"><title>IoT, IT, consumer: 10%</title></rect><text x="662.8000000000001" y="140" text-anchor="end" font-size="11" fill="#6d685f">IoT, IT, consumer 10%</text></g><g><rect x="664.8000000000001" y="80" width="40.72" height="44" fill="#b9b3a8" fill-opacity="0.4"><title>Railways: 6%</title></rect><text x="705.5200000000001" y="154" text-anchor="end" font-size="11" fill="#6d685f">Railways 6%</text></g><g><rect x="707.52" y="80" width="12.24" height="44" fill="#b9b3a8" fill-opacity="0.3"><title>Aerospace &amp; defence: 2%</title></rect><text x="719.76" y="168" text-anchor="end" font-size="11" fill="#6d685f">Aerospace &amp; defence 2%</text></g><g><rect x="721.76" y="80" width="12.24" height="44" fill="#b9b3a8" fill-opacity="0.2"><title>Medical: 2%</title></rect><text x="734" y="182" text-anchor="end" font-size="11" fill="#6d685f">Medical 2%</text></g><text x="24" y="218" font-size="11" fill="#6d685f">Smart meters = ₹971 Cr of ₹3,626 Cr; the deck reports them inside a 55% industrial-incl-EV bucket.</text></svg>