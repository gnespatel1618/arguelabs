<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 290" role="img" aria-label="Core pharma promises are mostly kept; new-venture promises mostly slip" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Core pharma promises are mostly kept; new-venture promises mostly slip</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Guidance from earnings calls, Nov 2023 to Jan 2026, checked against what happened. Count of promises.</text><g><g><rect x="24" y="62" width="12" height="12" rx="2" fill="#2f9e5b" fill-opacity="0.7"></rect><text x="42" y="72" font-size="11.5" fill="#6d685f">Delivered or beat</text></g><g><rect x="204" y="62" width="12" height="12" rx="2" fill="#e2a623" fill-opacity="0.7"></rect><text x="222" y="72" font-size="11.5" fill="#6d685f">Delivered late</text></g><g><rect x="384" y="62" width="12" height="12" rx="2" fill="#d8463d" fill-opacity="0.7"></rect><text x="402" y="72" font-size="11.5" fill="#6d685f">Missed or dropped</text></g></g><g><text x="24" y="100" font-weight="600" fill="#1b1a17">Core pharma (revenue, margin, Fermion ramp)</text><text x="584" y="100" fill="#6d685f">9 promises</text><g><rect x="24" y="110" width="273" height="34" rx="4" fill="#2f9e5b" fill-opacity="0.55"></rect><text x="160.5" y="132" text-anchor="middle" font-weight="600" fill="#1b1a17">6</text></g><g><rect x="300" y="110" width="135" height="34" rx="4" fill="#d8463d" fill-opacity="0.55"></rect><text x="367.5" y="132" text-anchor="middle" font-weight="600" fill="#1b1a17">3</text></g></g><g><text x="24" y="192" font-weight="600" fill="#1b1a17">New ventures (battery, chips, JVs, new CDMO, capex)</text><text x="584" y="192" fill="#6d685f">12 promises</text><g><rect x="24" y="202" width="43" height="34" rx="4" fill="#2f9e5b" fill-opacity="0.55"></rect><text x="45.5" y="224" text-anchor="middle" font-weight="600" fill="#1b1a17">1</text></g><g><rect x="70" y="202" width="135" height="34" rx="4" fill="#e2a623" fill-opacity="0.55"></rect><text x="137.5" y="224" text-anchor="middle" font-weight="600" fill="#1b1a17">3</text></g><g><rect x="208" y="202" width="365" height="34" rx="4" fill="#d8463d" fill-opacity="0.55"></rect><text x="390.5" y="224" text-anchor="middle" font-weight="600" fill="#1b1a17">8</text></g></g><text x="24" y="282" font-size="11" fill="#6d685f">Bar length is proportional to the number of promises. The main ones are listed in the table below.</text></svg>