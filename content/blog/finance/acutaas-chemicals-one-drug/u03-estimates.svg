<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 360" role="img" aria-label="Our EPS estimates went up 13% for FY27 and 6% for FY28" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">We raised our EPS estimates 13% for FY27 and 6% for FY28</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Our EPS estimates, ₹, before and after the Q2 FY27 results</text><g><line x1="70" x2="560" y1="290" y2="290" stroke="#e4ded2"></line><text x="62" y="294" text-anchor="end" fill="#6d685f">0</text></g><g><line x1="70" x2="560" y1="238.5" y2="238.5" stroke="#e4ded2"></line><text x="62" y="242.5" text-anchor="end" fill="#6d685f">20</text></g><g><line x1="70" x2="560" y1="187" y2="187" stroke="#e4ded2"></line><text x="62" y="191" text-anchor="end" fill="#6d685f">40</text></g><g><line x1="70" x2="560" y1="135.5" y2="135.5" stroke="#e4ded2"></line><text x="62" y="139.5" text-anchor="end" fill="#6d685f">60</text></g><g><line x1="70" x2="560" y1="84" y2="84" stroke="#e4ded2"></line><text x="62" y="88" text-anchor="end" fill="#6d685f">80</text></g><g><g><rect x="110" y="156.1" width="70" height="133.9" fill="#b9b3a8" stroke="none" stroke-dasharray="none"></rect><text x="145" y="150.1" text-anchor="middle" font-weight="600" fill="#1b1a17">52</text><text x="145" y="306" text-anchor="middle" font-size="10.5" fill="#6d685f">Before Q2</text></g><g><rect x="194" y="139.105" width="70" height="150.895" fill="#4f7be0" stroke="none" stroke-dasharray="none"></rect><text x="229" y="133.105" text-anchor="middle" font-weight="600" fill="#1b1a17">58.6</text><text x="229" y="306" text-anchor="middle" font-size="10.5" fill="#6d685f">After Q2</text></g><text x="187" y="326" text-anchor="middle" font-weight="600" fill="#1b1a17">FY27E</text></g><g><g><rect x="358" y="125.19999999999999" width="70" height="164.8" fill="#b9b3a8" stroke="none" stroke-dasharray="none"></rect><text x="393" y="119.19999999999999" text-anchor="middle" font-weight="600" fill="#1b1a17">64</text><text x="393" y="306" text-anchor="middle" font-size="10.5" fill="#6d685f">Before Q2</text></g><g><rect x="442" y="114.9" width="70" height="175.1" fill="#4f7be0" stroke="none" stroke-dasharray="none"></rect><text x="477" y="108.9" text-anchor="middle" font-weight="600" fill="#1b1a17">68</text><text x="477" y="306" text-anchor="middle" font-size="10.5" fill="#6d685f">After Q2</text></g><text x="435" y="326" text-anchor="middle" font-weight="600" fill="#1b1a17">FY28E</text></g><rect x="580" y="84" width="156" height="230" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="594" y="106" font-weight="600" fill="#1b1a17">What we changed</text><text x="594" y="130" font-size="11" fill="#1b1a17">FY27 growth 27% → 30%</text><text x="594" y="152" font-size="11" fill="#1b1a17">FY27 margin 35.5% → 39%</text><text x="594" y="174" font-size="11" fill="#1b1a17">FY28 margin 35.5% → 37%</text><text x="594" y="196" font-size="11" fill="#6d685f">(battery mix dilutes)</text><text x="594" y="218" font-size="11" fill="#1b1a17">FY28 growth kept at 24%</text><text x="594" y="240" font-size="11" fill="#1b1a17">Tax kept at 26%</text><text x="594" y="262" font-size="11" fill="#1b1a17">PL Capital had 67.7</text><text x="594" y="284" font-size="11" fill="#6d685f">(before the results)</text></svg>