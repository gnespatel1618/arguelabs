<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 320" role="img" aria-label="Pharma is 88% of revenue; CDMO alone is nearly half" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Pharma is 88% of revenue; CDMO alone is nearly half</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">FY26 revenue by business, ₹ Cr (total ₹1,339 Cr)</text><g><text x="258" y="97" text-anchor="end" font-weight="600" fill="#1b1a17">CDMO (contract manufacturing)</text><rect x="270" y="82" width="335.64285714285717" height="22" rx="2" fill="#4f7be0"></rect><text x="613.6428571428571" y="97" fill="#1b1a17">635  ·  47%</text></g><g><text x="258" y="137" text-anchor="end" font-weight="400" fill="#1b1a17">Other pharma intermediates</text><rect x="270" y="122" width="284.90000000000003" height="22" rx="2" fill="#b9b3a8"></rect><text x="562.9000000000001" y="137" fill="#1b1a17">539  ·  40%</text></g><g><text x="258" y="177" text-anchor="end" font-weight="400" fill="#1b1a17">Commodity chemicals (parabens etc.)</text><rect x="270" y="162" width="79.02142857142857" height="22" rx="2" fill="#b9b3a8"></rect><text x="357.0214285714286" y="177" fill="#1b1a17">149.5  ·  11%</text></g><g><text x="258" y="217" text-anchor="end" font-weight="400" fill="#1b1a17">Chip chemicals (Baba)</text><rect x="270" y="202" width="8.298571428571428" height="22" rx="2" fill="#b9b3a8"></rect><text x="286.29857142857145" y="217" fill="#1b1a17">15.7  ·  1%</text></g><g><text x="258" y="257" text-anchor="end" font-weight="400" fill="#1b1a17">Battery additives</text><line x1="270" x2="270" y1="242" y2="264" stroke="#1b1a17"></line><text x="280" y="257" fill="#1b1a17">nil: first supplies only in Q1 FY27</text></g><line x1="270" x2="270" y1="74" y2="270" stroke="#1b1a17"></line><text x="24" y="300" font-size="11" fill="#6d685f">The CDMO / o