<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 270" role="img" aria-label="What Q2 FY27 changed for Acutaas" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Q2 FY27: the core beat again, and guidance went up</text><g><rect x="24" y="58" width="172" height="92" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.5"></rect><text x="36" y="80" fill="#6d685f">Q2 FY27 revenue</text><text x="36" y="110" font-size="20" font-weight="600" fill="#2f9e5b">₹437 Cr</text><text x="36" y="132" font-size="10.5" fill="#6d685f">Up 43% YoY and 32% QoQ</text></g><g><rect x="204" y="58" width="172" height="92" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.5"></rect><text x="216" y="80" fill="#6d685f">Q2 EBITDA margin</text><text x="216" y="110" font-size="20" font-weight="600" fill="#2f9e5b">40.3%</text><text x="216" y="132" font-size="10.5" fill="#6d685f">31.1% a year ago</text></g><g><rect x="384" y="58" width="172" height="92" fill="#f6f2ea" stroke="#2f9e5b" stroke-width="1.5"></rect><text x="396" y="80" fill="#6d685f">Q2 net profit</text><text x="396" y="110" font-size="20" font-weight="600" fill="#2f9e5b">₹123 Cr</text><text x="396" y="132" font-size="10.5" fill="#6d685f">Up 71% YoY</text></g><g><rect x="564" y="58" width="172" height="92" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.5"></rect><text x="576" y="80" fill="#6d685f">FY27 revenue guidance</text><text x="576" y="110" font-size="20" font-weight="600" fill="#4f7be0">~30%</text><text x="576" y="132" font-size="10.5" fill="#6d685f">From 25%; margin 38–40%</text></g><g><rect x="24" y="158" width="172" height="92" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.5"></rect><text x="36" y="180" fill="#6d685f">CDMO ₹1,000 Cr target</text><text x="36" y="210" font-size="20" font-weight="600" fill="#4f7be0">FY27</text><text x="36" y="232" font-size="10.5" fill="#6d685f">A year early; ₹2,000 Cr FY30</text></g><g><rect x="204" y="158" width="172" height="92" fill="#f6f2ea" stroke="#e2a623" stroke-width="1.5"></rect><text x="216" y="180" fill="#6d685f">Working capital</text><text x="216" y="210" font-size="20" font-weight="600" fill="#1b1a17">115 days</text><text x="216" y="232" font-size="10.5" fill="#6d685f">Up from 99 days in Q1</text></g><g><rect x="384" y="158" width="172" height="92" fill="#f6f2ea" stroke="#e2a623" stroke-width="1.5"></rect><text x="396" y="180" fill="#6d685f">Specialty chemicals</text><text x="396" y="210" font-size="20" font-weight="600" fill="#1b1a17">−20%</text><text x="396" y="232" font-size="10.5" fill="#6d685f">Legacy products phased out</text></g><g><rect x="564" y="158" width="172" height="92" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="576" y="180" fill="#6d685f">Share price</text><text x="576" y="210" font-size="20" font-weight="600" fill="#1b1a17">₹3,818</text><text x="576" y="232" font-size="10.5" fill="#6d685f">Was ₹3,152 in our post</text></g></svg>