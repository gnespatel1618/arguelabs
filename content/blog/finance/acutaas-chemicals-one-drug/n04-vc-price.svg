<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="Vinylene carbonate prices fell 90% then quadrupled" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Battery-additive prices: down 90%, then up fourfold</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Price of vinylene carbonate (VC) in China, thousand yuan per tonne</text><g><line x1="140" x2="600" y1="290" y2="290" stroke="#e4ded2"></line><text x="132" y="294" text-anchor="end" fill="#6d685f">0</text></g><g><line x1="140" x2="600" y1="250.3846153846154" y2="250.3846153846154" stroke="#e4ded2"></line><text x="132" y="254.3846153846154" text-anchor="end" fill="#6d685f">100</text></g><g><line x1="140" x2="600" y1="210.76923076923077" y2="210.76923076923077" stroke="#e4ded2"></line><text x="132" y="214.76923076923077" text-anchor="end" fill="#6d685f">200</text></g><g><line x1="140" x2="600" y1="171.15384615384616" y2="171.15384615384616" stroke="#e4ded2"></line><text x="132" y="175.15384615384616" text-anchor="end" fill="#6d685f">300</text></g><g><line x1="140" x2="600" y1="131.53846153846152" y2="131.53846153846152" stroke="#e4ded2"></line><text x="132" y="135.53846153846152" text-anchor="end" fill="#6d685f">400</text></g><g><line x1="140" x2="600" y1="91.9230769230769" y2="91.9230769230769" stroke="#e4ded2"></line><text x="132" y="95.9230769230769" text-anchor="end" fill="#6d685f">500</text></g><g><rect x="178.33333333333334" y="101.8269230769231" width="76.66666666666667" height="188.1730769230769" fill="#b9b3a8"></rect><text x="216.66666666666669" y="93.8269230769231" text-anchor="middle" font-weight="600" fill="#1b1a17">475k</text><text x="216.66666666666669" y="308" text-anchor="middle" fill="#6d685f">2021 peak</text></g><g><rect x="331.6666666666667" y="271.7769230769231" width="76.66666666666667" height="18.223076923076917" fill="#b9b3a8"></rect><text x="370" y="263.7769230769231" text-anchor="middle" font-weight="600" fill="#1b1a17">46k</text><text x="370" y="308" text-anchor="middle" fill="#6d685f">2025 low</text></g><g><rect x="485" y="210.76923076923077" width="76.66666666666667" height="79.23076923076923" fill="#4f7be0"></rect><text x="523.3333333333334" y="202.76923076923077" text-anchor="middle" font-weight="600" fill="#1b1a17">200k+</text><text x="523.3333333333334" y="308" text-anchor="middle" fill="#6d685f">July 2026</text></g><text x="616" y="103.80769230769229" font-size="11.5" font-weight="600" fill="#1b1a17">Why it matters</text><text x="616" y="121.80769230769229" font-size="11" fill="#6d685f">China makes most of the</text><text x="616" y="136.8076923076923" font-size="11" fill="#6d685f">world&#x27;s VC. A new Chinese</text><text x="616" y="151.8076923076923" font-size="11" fill="#6d685f">battery-safety rule drove</text><text x="616" y="166.8076923076923" font-size="11" fill="#6d685f">the 2026 jump. Acutaas</text><text x="616" y="181.8076923076923" font-size="11" fill="#6d685f">sold its 4,000 t on</text><text x="616" y="196.8076923076923" font-size="11" fill="#6d685f">3-year fixed-price deals.</text><text x="24" y="332" font-size="11" fill="#6d685f">Three data points from industry reports; not a continuous series.</text></svg>