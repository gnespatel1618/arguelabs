<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 344" role="img" aria-label="Even the most generous DCF is about a third of the share price" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Even the most generous DCF is about a third of the share price</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">DCF value per share, ₹, by cost of capital (WACC) and long-term growth. Boxed = base case.</text><text x="288" y="80" text-anchor="middle" font-size="11.5" fill="#6d685f">Long-term growth →</text><text x="196" y="102" text-anchor="middle" font-weight="600" fill="#1b1a17">5%</text><text x="288" y="102" text-anchor="middle" font-weight="600" fill="#1b1a17">6%</text><text x="380" y="102" text-anchor="middle" font-weight="600" fill="#1b1a17">7%</text><text x="90" y="102" text-anchor="middle" font-size="11.5" fill="#6d685f">WACC ↓</text><g><text x="138" y="135" text-anchor="end" fill="#1b1a17">11.5%</text><g><rect x="150" y="112" width="88" height="32" fill="#4f7be0" fill-opacity="0.40085106382978725"></rect><text x="194" y="134" text-anchor="middle" font-weight="400" fill="#1b1a17">870</text></g><g><rect x="242" y="112" width="88" height="32" fill="#4f7be0" fill-opacity="0.5272340425531915"></rect><text x="286" y="134" text-anchor="middle" font-weight="400" fill="#1b1a17">969</text></g><g><rect x="334" y="112" width="88" height="32" fill="#4f7be0" fill-opacity="0.7097872340425532"></rect><text x="378" y="134" text-anchor="middle" font-weight="400" fill="#1b1a17">1,112</text></g></g><g><text x="138" y="171" text-anchor="end" fill="#1b1a17">12.0%</text><g><rect x="150" y="148" width="88" height="32" fill="#4f7be0" fill-opacity="0.3178723404255319"></rect><text x="194" y="170" text-anchor="middle" font-weight="400" fill="#1b1a17">805</text></g><g><rect x="242" y="148" width="88" height="32" fill="#4f7be0" fill-opacity="0.4212765957446808"></rect><text x="286" y="170" text-anchor="middle" font-weight="400" fill="#1b1a17">886</text></g><g><rect x="334" y="148" width="88" height="32" fill="#4f7be0" fill-opacity="0.5655319148936171"></rect><text x="378" y="170" text-anchor="middle" font-weight="400" fill="#1b1a17">999</text></g></g><g><text x="138" y="207" text-anchor="end" fill="#1b1a17">12.5%</text><g><rect x="150" y="184" width="88" height="32" fill="#4f7be0" fill-opacity="0.2451063829787234"></rect><text x="194" y="206" text-anchor="middle" font-weight="400" fill="#1b1a17">748</text></g><g><rect x="242" y="184" width="88" height="32" fill="#4f7be0" fill-opacity="0.33063829787234045"></rect><text x="286" y="206" text-anchor="middle" font-weight="700" fill="#1b1a17">815</text><rect x="241" y="183" width="90" height="34" fill="none" stroke="#1b1a17" stroke-width="2"></rect></g><g><rect x="334" y="184" width="88" height="32" fill="#4f7be0" fill-opacity="0.44680851063829785"></rect><text x="378" y="206" text-anchor="middle" font-weight="400" fill="#1b1a17">906</text></g></g><g><text x="138" y="243" text-anchor="end" fill="#1b1a17">13.0%</text><g><rect x="150" y="220" width="88" height="32" fill="#4f7be0" fill-opacity="0.1825531914893617"></rect><text x="194" y="242" text-anchor="middle" font-weight="400" fill="#1b1a17">699</text></g><g><rect x="242" y="220" width="88" height="32" fill="#4f7be0" fill-opacity="0.2540425531914894"></rect><text x="286" y="242" text-anchor="middle" font-weight="400" fill="#1b1a17">755</text></g><g><rect x="334" y="220" width="88" height="32" fill="#4f7be0" fill-opacity="0.3485106382978723"></rect><text x="378" y="242" text-anchor="middle" font-weight="400" fill="#1b1a17">829</text></g></g><g><text x="138" y="279" text-anchor="end" fill="#1b1a17">13.5%</text><g><rect x="150" y="256" width="88" height="32" fill="#4f7be0" fill-opacity="0.12638297872340426"></rect><text x="194" y="278" text-anchor="middle" font-weight="400" fill="#1b1a17">655</text></g><g><rect x="242" y="256" width="88" height="32" fill="#4f7be0" fill-opacity="0.1876595744680851"></rect><text x="286" y="278" text-anchor="middle" font-weight="400" fill="#1b1a17">703</text></g><g><rect x="334" y="256" width="88" height="32" fill="#4f7be0" fill-opacity="0.265531914893617"></rect><text x="378" y="278" text-anchor="middle" font-weight="400" fill="#1b1a17">764</text></g></g><g><text x="480" y="122" font-weight="600" fill="#1b1a17">Compared with the price</text><g><text x="480" y="152" font-size="11.5" fill="#6d685f">Price today</text><rect x="480" y="158" width="230" height="14" fill="#d8463d" fill-opacity="0.8"></rect><text x="716" y="169" font-size="11.5" font-weight="600" fill="#1b1a17">₹3,152</text></g><g><text x="480" y="196" font-size="11.5" fill="#6d685f">Best DCF cell</text><rect x="480" y="202" width="81.14213197969544" height="14" fill="#4f7be0" fill-opacity="0.55"></rect><text x="567.1421319796955" y="213" font-size="11.5" font-weight="600" fill="#1b1a17">₹1,112</text></g><g><text x="480" y="240" font-size="11.5" fill="#6d685f">Base DCF</text><rect x="480" y="246" width="59.470177664974614" height="14" fill="#4f7be0" fill-opacity="0.55"></rect><text x="545.4701776649746" y="257" font-size="11.5" font-weight="600" fill="#1b1a17">₹815</text></g></g><text x="24" y="320" font-size="11" fill="#6d685f">Heavy capex and working capital eat most of the cash for years. Keeping margins at 35.5% forever only lifts the</text><text x="24" y="335" font-size="11" fill="#6d685f">base case to about ₹990.</text></svg>