<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 310" role="img" aria-label="Pharma money well spent; non-pharma bets poor or pending" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Money spent in pharma has paid off; outside pharma, not yet</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Major capital decisions since 2021 and our verdict. Overall grade: B.</text><g><text x="24" y="76" font-size="11" font-weight="600" letter-spacing="1" fill="#6d685f">INSIDE PHARMA</text><g><rect x="30" y="84" width="170" height="82" fill="#2f9e5b" fill-opacity="0.12" stroke="#2f9e5b" stroke-width="1.25"></rect><rect x="30" y="84" width="5" height="82" fill="#2f9e5b"></rect><text x="44" y="104" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#2f9e5b">EXCELLENT</text><text x="44" y="128" font-size="12" fill="#1b1a17">Gujarat Organics units</text><text x="44" y="148" font-size="11" fill="#6d685f">2021 · ₹93 Cr</text></g><g><rect x="208" y="84" width="170" height="82" fill="#2f9e5b" fill-opacity="0.12" stroke="#2f9e5b" stroke-width="1.25"></rect><rect x="208" y="84" width="5" height="82" fill="#2f9e5b"></rect><text x="222" y="104" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#2f9e5b">EXCELLENT</text><text x="222" y="128" font-size="12" fill="#1b1a17">Fermion CDMO blocks</text><text x="222" y="148" font-size="11" fill="#6d685f">2022–25 · part of ₹500 Cr+</text></g><g><rect x="386" y="84" width="170" height="82" fill="#2f9e5b" fill-opacity="0.12" stroke="#2f9e5b" stroke-width="1.25"></rect><rect x="386" y="84" width="5" height="82" fill="#2f9e5b"></rect><text x="400" y="104" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#2f9e5b">GOOD</text><text x="400" y="128" font-size="12" fill="#1b1a17">QIP + preferential</text><text x="400" y="148" font-size="11" fill="#6d685f">2024 · ₹500 Cr raised</text></g></g><g><text x="24" y="204" font-size="11" font-weight="600" letter-spacing="1" fill="#6d685f">OUTSIDE PHARMA</text><g><rect x="30" y="212" width="170" height="82" fill="#d8463d" fill-opacity="0.12" stroke="#d8463d" stroke-width="1.25"></rect><rect x="30" y="212" width="5" height="82" fill="#d8463d"></rect><text x="44" y="232" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#d8463d">POOR</text><text x="44" y="256" font-size="12" fill="#1b1a17">US drug-discovery JV</text><text x="44" y="276" font-size="11" fill="#6d685f">₹32 Cr, written off</text></g><g><rect x="208" y="212" width="170" height="82" fill="#d8463d" fill-opacity="0.12" stroke="#d8463d" stroke-width="1.25"></rect><rect x="208" y="212" width="5" height="82" fill="#d8463d"></rect><text x="222" y="232" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#d8463d">POOR SO FAR</text><text x="222" y="256" font-size="12" fill="#1b1a17">Baba Fine Chemicals</text><text x="222" y="276" font-size="11" fill="#6d685f">2023 · ₹68 Cr</text></g><g><rect x="386" y="212" width="170" height="82" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="386" y="212" width="5" height="82" fill="#e2a623"></rect><text x="400" y="232" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#1b1a17">PENDING</text><text x="400" y="256" font-size="12" fill="#1b1a17">Battery additives plant</text><text x="400" y="276" font-size="11" fill="#6d685f">~₹220 Cr · ~2 yrs late</text></g><g><rect x="564" y="212" width="170" height="82" fill="#e2a623" fill-opacity="0.12" stroke="#e2a623" stroke-width="1.25"></rect><rect x="564" y="212" width="5" height="82" fill="#e2a623"></rect><text x="578" y="232" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#1b1a17">PENDING</text><text x="578" y="256" font-size="12" fill="#1b1a17">Indichem, Korea</text><text x="578" y="276" font-size="11" fill="#6d685f">2025–26 · ~₹200 Cr</text></g></g></svg>