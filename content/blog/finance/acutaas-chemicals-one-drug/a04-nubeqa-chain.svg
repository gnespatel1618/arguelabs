<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 340" role="img" aria-label="How Acutaas intermediates reach Nubeqa patients" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1a17"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">From a Surat plant to a €3bn-a-year cancer drug</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">The Nubeqa (darolutamide) supply chain</text><path d="M30 112V100H286V112" fill="none" stroke="#4f7be0"></path><text x="158" y="80" text-anchor="middle" font-size="11.5" fill="#1b1a17">10-year supply contract, Nov 2022;</text><text x="158" y="94" text-anchor="middle" font-size="11.5" fill="#6d685f">two more intermediates added Sep and Dec 2023</text><g><rect x="20" y="130" width="128" height="84" fill="#4f7be0" fill-opacity="0.14" stroke="#4f7be0" stroke-width="1.75"></rect><text x="84" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1a17">Acutaas</text><text x="84" y="180" text-anchor="middle" font-size="11.5" fill="#6d685f">5 advanced</text><text x="84" y="195" text-anchor="middle" font-size="11.5" fill="#6d685f">intermediates</text><line x1="150" x2="166" y1="172" y2="172" stroke="#1b1a17" marker-end="url(#ar)"></line></g><g><rect x="168" y="130" width="128" height="84" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1"></rect><text x="232" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1a17">Fermion</text><text x="232" y="180" text-anchor="middle" font-size="11.5" fill="#6d685f">makes the API,</text><text x="232" y="195" text-anchor="middle" font-size="11.5" fill="#6d685f">darolutamide</text><line x1="298" x2="314" y1="172" y2="172" stroke="#1b1a17" marker-end="url(#ar)"></line></g><g><rect x="316" y="130" width="128" height="84" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1"></rect><text x="380" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1a17">Orion</text><text x="380" y="180" text-anchor="middle" font-size="11.5" fill="#6d685f">owns the drug;</text><text x="380" y="195" text-anchor="middle" font-size="11.5" fill="#6d685f">royalty ~25%</text><line x1="446" x2="462" y1="172" y2="172" stroke="#1b1a17" marker-end="url(#ar)"></line></g><g><rect x="464" y="130" width="128" height="84" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1"></rect><text x="528" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1a17">Bayer</text><text x="528" y="180" text-anchor="middle" font-size="11.5" fill="#6d685f">sells Nubeqa in</text><text x="528" y="195" text-anchor="middle" font-size="11.5" fill="#6d685f">~90 countries</text><line x1="594" x2="610" y1="172" y2="172" stroke="#1b1a17" marker-end="url(#ar)"></line></g><g><rect x="612" y="130" width="128" height="84" fill="#f6f2ea" fill-opacity="1" stroke="#1b1a17" stroke-width="1"></rect><text x="676" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1a17">Patients</text><text x="676" y="180" text-anchor="middle" font-size="10.5" fill="#6d685f">prostate cancer: 3 uses,</text><text x="676" y="195" text-anchor="middle" font-size="11.5" fill="#6d685f">2 more in trials</text></g><rect x="20" y="252" width="720" height="52" fill="#d8463d" fill-opacity="0.07" stroke="#d8463d" stroke-dasharray="4 3"></rect><text x="36" y="274" font-weight="600" fill="#1b1a17">The end date: darolutamide patents expire</text><text x="36" y="292" fill="#6d685f">UK 2029 · US, Japan, Brazil 2033 · Germany, France, Italy, Spain 2035</text></svg>