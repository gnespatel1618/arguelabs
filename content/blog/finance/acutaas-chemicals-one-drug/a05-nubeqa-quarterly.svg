<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 380" role="img" aria-label="Nubeqa sales have risen every quarter for four years" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Nubeqa sales have risen every quarter for four years</text><text x="24" y="50" font-size="12" fill="#6d685f">Bayer&#x27;s Nubeqa sales by quarter, € m. Calendar-year totals: 2022 €466m, 2023 €869m, 2024 €1,525m, 2025 €2,385m</text><g><g><line x1="56" x2="736" y1="330" y2="330" stroke="#e4ded2"></line><text x="48" y="334" text-anchor="end" font-size="11" fill="#6d685f">0</text></g><g><line x1="56" x2="736" y1="267.5" y2="267.5" stroke="#e4ded2"></line><text x="48" y="271.5" text-anchor="end" font-size="11" fill="#6d685f">250</text></g><g><line x1="56" x2="736" y1="205" y2="205" stroke="#e4ded2"></line><text x="48" y="209" text-anchor="end" font-size="11" fill="#6d685f">500</text></g><g><line x1="56" x2="736" y1="142.5" y2="142.5" stroke="#e4ded2"></line><text x="48" y="146.5" text-anchor="end" font-size="11" fill="#6d685f">750</text></g><g><line x1="56" x2="736" y1="80" y2="80" stroke="#e4ded2"></line><text x="48" y="84" text-anchor="end" font-size="11" fill="#6d685f">1000</text></g></g><g><line x1="56" x2="736" y1="142.5" y2="142.5" stroke="#3a3833" stroke-dasharray="4 4"></line><text x="62" y="136.5" font-size="11.5" fill="#6d685f">Bayer 2023 peak-sales target of €3bn a year, as a quarterly pace (€750m)</text></g><g><g><rect x="63.17777777777778" y="311" width="23.422222222222224" height="19" fill="#b9b3a8"><title>Q1 2022: €76m</title></rect><text x="74.88888888888889" y="305" text-anchor="middle" font-size="11" fill="#1b1a17">76</text><text x="63.17777777777778" y="348" font-size="11" fill="#6d685f">2022</text></g><g><rect x="100.95555555555555" y="303.75" width="23.422222222222224" height="26.25" fill="#b9b3a8"><title>Q2 2022: €1