<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 292" role="img" aria-label="Acutaas at a glance" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Acutaas at a glance, 21 Oct 2026</text><g><rect x="24" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="82" fill="#6d685f">Share price (21 Oct 2026)</text><text x="40" y="112" font-size="22" font-weight="600" fill="#1b1a17">₹3,152</text><text x="40" y="136" font-size="11.5" fill="#6d685f">52-week range ₹1,570–3,740</text></g><g><rect x="264" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="280" y="82" fill="#6d685f">Market value</text><text x="280" y="112" font-size="22" font-weight="600" fill="#1b1a17">₹25,809 Cr</text><text x="280" y="136" font-size="11.5" fill="#6d685f">Net cash ₹314 Cr, no debt</text></g><g><rect x="504" y="56" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="520" y="82" fill="#6d685f">P/E (trailing)</text><text x="520" y="112" font-size="22" font-weight="600" fill="#1b1a17">66.8x</text><text x="520" y="136" font-size="11.5" fill="#6d685f">About 49x our FY28 estimate</text></g><g><rect x="24" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="40" y="194" fill="#6d685f">Revenue (FY26)</text><text x="40" y="224" font-size="22" font-weight="600" fill="#1b1a17">₹1,339 Cr</text><text x="40" y="248" font-size="11.5" fill="#6d685f">Up 33%, at a 36% EBITDA margin</text></g><g><rect x="264" y="168" width="224" height="96" fill="#f6f2ea" stroke="#1b1a17" stroke-width="1"></rect><text x="280" y="194" fill="#6d685f">Return on capital (FY26)</text><text x="280" y="224" font-size="22" font-weight="600" fill="#1b1a17">31.6%</text><text x="280" y="248" font-size="11.5" fill="#6d685f">Highest in its peer group</text></g><g><rect x="504" y="168" width="224" height="96" fill="#f6f2ea" stroke="#4f7be0" stroke-width="1.75"></rect><text x="520" y="194" fill="#6d685f">CDMO share of revenue</text><text x="520" y="224" font-size="22" font-weight="600" fill="#4f7be0">47%</text><text x="520" y="248" font-size="11.5" fill="#6d685f">Mostly one drug: Nubeqa</text></g></svg>