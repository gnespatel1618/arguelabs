<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 386" role="img" aria-label="Five growth engines; only one is proven" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">Five growth engines; only one is proven</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Revenue potential per engine, ₹ Cr a year. Colour = our confidence it arrives.</text><g><line x1="220" x2="220" y1="78" y2="314" stroke="#e4ded2"></line><text x="220" y="330" text-anchor="middle" fill="#6d685f">0</text></g><g><line x1="305" x2="305" y1="78" y2="314" stroke="#e4ded2"></line><text x="305" y="330" text-anchor="middle" fill="#6d685f">200</text></g><g><line x1="390" x2="390" y1="78" y2="314" stroke="#e4ded2"></line><text x="390" y="330" text-anchor="middle" fill="#6d685f">400</text></g><g><line x1="475" x2="475" y1="78" y2="314" stroke="#e4ded2"></line><text x="475" y="330" text-anchor="middle" fill="#6d685f">600</text></g><g><line x1="560" x2="560" y1="78" y2="314" stroke="#e4ded2"></line><text x="560" y="330" text-anchor="middle" fill="#6d685f">800</text></g><text x="590" y="72" font-size="11" font-weight="600" fill="#6d685f">WHEN · CONFIDENCE</text><g><text x="208" y="96" text-anchor="end" font-weight="600" fill="#1b1a17">Nubeqa intermediates</text><rect x="390" y="84" width="127.5" height="16" rx="3" fill="#2f9e5b" fill-opacity="0.8"></rect><text x="523.5" y="96" font-size="11" fill="#1b1a17">400–700</text><text x="590" y="92" font-size="11.5" fill="#1b1a17">Now to about 2033</text><text x="590" y="106" font-size="11" fill="#2f9e5b">High near term</text></g><g><text x="208" y="142" text-anchor="end" font-weight="400" fill="#1b1a17">Apixaban and other generics</text><circle cx="407" cy="138" r="7" fill="#e2a623"></circle><text x="419" y="142" font-size="11" fill="#1b1a17">~440</text><text x="590" y="138" font-size="11.5" fill="#1b1a17">FY27 to FY30</text><text x="590" y="152" font-size="11" fill="#6d685f">Medium; prices fall</text></g><g><text x="208" y="188" text-anchor="end" font-weight="400" fill="#1b1a17">Battery additives (VC, FEC)</text><rect x="326.25" y="176" width="72.25" height="16" rx="3" fill="#ea7a2c" fill-opacity="0.8"></rect><text x="404.5" y="188" font-size="11" fill="#1b1a17">250–420</text><text x="590" y="184" font-size="11.5" fill="#1b1a17">FY27 to FY29</text><text x="590" y="198" font-size="11" fill="#ea7a2c">Medium-low</text></g><g><text x="208" y="234" text-anchor="end" font-weight="400" fill="#1b1a17">Four new CDMO drugs</text><rect x="305" y="222" width="85" height="16" rx="3" fill="#e2a623" fill-opacity="0.8"></rect><text x="396" y="234" font-size="11" fill="#1b1a17">200–400</text><text x="590" y="230" font-size="11.5" fill="#1b1a17">H2 FY27 to FY30</text><text x="590" y="244" font-size="11" fill="#6d685f">Medium</text></g><g><text x="208" y="280" text-anchor="end" font-weight="400" fill="#1b1a17">Chip chemicals</text><circle cx="305" cy="276" r="7" fill="#d8463d"></circle><text x="317" y="280" font-size="11" fill="#1b1a17">~200</text><text x="590" y="276" font-size="11.5" fill="#1b1a17">FY28 to FY31</text><text x="590" y="290" font-size="11" fill="#d8463d">Low</text></g><text x="24" y="360" font-size="11" fill="#6d685f">Apixaban is JM Financial&#x27;s estimate of the opportunity; battery and chip figures are our estimates at full plant use.</text><text x="24" y="376" font-size="11" fill="#6d685f">Add them up and ~₹3,000 Cr of revenue by FY30 is possible: roughly double FY26.</text></svg>