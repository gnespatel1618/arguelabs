<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 372" role="img" aria-label="CDMO revenue went from 57 to 635 crore in two years" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#4f7be0" fill-opacity="0.18"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#4f7be0" stroke-width="2"></line></pattern></defs><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">CDMO revenue went from ₹57 Cr to ₹635 Cr in two years</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">CDMO revenue, ₹ Cr, and share of total revenue. FY27–28 are broker estimates (hatched).</text><g><line x1="80" x2="640" y1="300" y2="300" stroke="#e4ded2"></line><text x="72" y="304" text-anchor="end" fill="#6d685f">0</text></g><g><line x1="80" x2="640" y1="250" y2="250" stroke="#e4ded2"></line><text x="72" y="254" text-anchor="end" fill="#6d685f">250</text></g><g><line x1="80" x2="640" y1="200" y2="200" stroke="#e4ded2"></line><text x="72" y="204" text-anchor="end" fill="#6d685f">500</text></g><g><line x1="80" x2="640" y1="150" y2="150" stroke="#e4ded2"></line><text x="72" y="154" text-anchor="end" fill="#6d685f">750</text></g><g><line x1="80" x2="640" y1="100" y2="100" stroke="#e4ded2"></line><text x="72" y="104" text-anchor="end" fill="#6d685f">1,000</text></g><line x1="546.64" x2="621.36" y1="100" y2="100" stroke="#3a3833" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="627.36" y="104" font-size="11.5" font-weight="600" fill="#1b1a17">Target ₹1,000 Cr</text><text x="627.36" y="119" font-size="11" fill="#6d685f">(management, FY28)</text><g><rect x="104.64" y="288.6" width="62.720000000000006" height="11.399999999999977" fill="#4f7be0" stroke="#4f7be0" stroke-width="0"></rect><text x="136" y="280.6" text-anchor="middle" font-weight="600" fill="#1b1a17">₹57</text><text x="136" y="318" text-anchor="middle" font-weight="600" fill="#1b1a17">FY24</text><text x="136" y="334" text-anchor="middle" font-size="11" fill="#6d685f">8% of revenue</text></g><g><rect x="216.64" y="243.6" width="62.720000000000006" height="56.400000000000006" fill="#4f7be0" stroke="#4f7be0" stroke-width="0"></rect><text x="248" y="235.6" text-anchor="middle" font-weight="600" fill="#1b1a17">₹282</text><text x="248" y="318" text-anchor="middle" font-weight="600" fill="#1b1a17">FY25</text><text x="248" y="334" text-anchor="middle" font-size="11" fill="#6d685f">28% of revenue</text></g><g><rect x="328.64" y="173" width="62.720000000000006" height="127" fill="#4f7be0" stroke="#4f7be0" stroke-width="0"></rect><text x="360" y="165" text-anchor="middle" font-weight="600" fill="#1b1a17">₹635</text><text x="360" y="318" text-anchor="middle" font-weight="600" fill="#1b1a17">FY26</text><text x="360" y="334" text-anchor="middle" font-size="11" fill="#6d685f">47% of revenue</text></g><g><rect x="440.64" y="140" width="62.720000000000006" height="160" fill="url(#hatch)" stroke="#4f7be0" stroke-width="1"></rect><text x="472" y="132" text-anchor="middle" font-weight="600" fill="#1b1a17">₹800</text><text x="472" y="318" text-anchor="middle" font-weight="600" fill="#1b1a17">FY27E</text><text x="472" y="334" text-anchor="middle" font-size="11" fill="#6d685f">47% of revenue</text></g><g><rect x="552.64" y="108" width="62.720000000000006" height="192" fill="url(#hatch)" stroke="#4f7be0" stroke-width="1"></rect><text x="584" y="92" text-anchor="middle" font-weight="600" fill="#1b1a17">₹960</text><text x="584" y="318" text-anchor="middle" font-weight="600" fill="#1b1a17">FY28E</text><text x="584" y="334" text-anchor="middle" font-size="11" fill="#6d685f">46% of revenue</text></g><text x="24" y="364" font-size="11" fill="#6d685f">The company stopped disclosing the CDMO split in FY26; the target can no longer be tracked from its own reports.</text></svg>