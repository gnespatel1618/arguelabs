<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg" viewBox="0 0 760 300" role="img" aria-label="The price needs 37% revenue growth a year for ten years" font-size="12.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text data-claude-text-id="title" x="24" y="28" font-size="16" fill="#1b1a17">The price needs 37% revenue growth a year for ten years</text><text data-claude-text-id="sub" x="24" y="50" font-size="12" fill="#6d685f">Annual revenue growth: what the share price implies vs what the business has done and is expected to do</text><g><text x="24" y="98" font-weight="600" fill="#1b1a17">Needed to justify ₹3,152</text><text x="24" y="115" font-size="11" fill="#6d685f">10 years in a row, at 12.5% WACC, 35.5% margin</text><rect x="300" y="84" width="351.5" height="26" fill="#d8463d" fill-opacity="0.85"></rect><text x="659.5" y="102" font-size="14" font-weight="600" fill="#1b1a17">37%</text></g><g><text x="24" y="154" font-weight="600" fill="#1b1a17">What it did, FY21–FY26</text><text x="24" y="171" font-size="11" fill="#6d685f">five-year compound growth</text><rect x="300" y="140" width="304" height="26" fill="#b9b3a8" fill-opacity="0.85"></rect><text x="612" y="158" font-size="14" font-weight="600" fill="#1b1a17">32%</text></g><g><text x="24" y="210" font-weight="600" fill="#1b1a17">What everyone expects</text><text x="24" y="227" font-size="11" fill="#6d685f">management and the Street, next two years</text><rect x="300" y="196" width="237.5" height="26" fill="#4f7be0" fill-opacity="0.85"></rect><text x="545.5" y="214" font-size="14" font-weight="600" fill="#1b1a17">25%</text></g><rect x="24" y="252" width="712" height="34" fill="#f6f2ea" stroke="#e4ded2"></rect><text x="38" y="274" fill="#1b1a17">37% for ten years means ₹31,000 Cr of revenue by FY36: 23 times today.</text></svg>